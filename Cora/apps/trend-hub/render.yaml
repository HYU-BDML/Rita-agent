# Render 배포 설정. 대시보드에서 "New → Blueprint" 로 이 파일을 가리키면 된다.
#
# 무료 플랜의 성질 두 가지를 알고 시작한다.
#   1. 15분 놀면 잠든다. 다음 접속이 깨우는 데 30~60초 걸린다 — 교수님께 미리 말해 둘 것.
#   2. 디스크를 못 붙인다. 그래서 db.json 을 저장소에 넣어 들고 간다(아래 참고).
#
# 파일이 쓰이긴 한다(회차 돌리기·검토 표시). 다만 **재배포하면 초기화된다** —
# 커밋해 둔 db.json 으로 되돌아간다. 교수님이 눌러 본 것은 남지 않는다.
# 남겨야 할 때가 오면 유료 플랜 + Persistent Disk(`/var/data`)로 옮기고
# 저장 경로만 env 로 뺀다. 지금은 시연이 목적이라 여기서 멈춘다.
services:
  - type: web
    name: trend-hub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # **healthCheckPath 를 두지 않는다.** 2026-09-19 배포가 이것 때문에 죽었다 —
    # `/` 로 뒀는데 `/`는 `/issues` 로 307 리다이렉트하고, Render 헬스체크는
    # 리다이렉트를 따라가지 않고 2xx 만 성공으로 본다. 빌드도 앱 Ready 도 멀쩡한 채
    # 15분을 기다리다 Timed Out 이 났다.
    #
    # `/issues` 로 바꾸는 길도 있지만 빼는 쪽을 골랐다. 그 화면은 첫 요청에서
    # 5MB db.json 을 읽어 그리므로, 무료 인스턴스의 느린 첫 기동에서 헬스체크가
    # 또 시간을 넘길 수 있다. 빼면 Render 는 포트가 열렸는지만 본다.
    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      # ── 없으면 그 판정기만 목 모드로 도는 것들 ──
      # sync:false = 값은 대시보드에서 넣는다. 저장소에 키를 두지 않는다.
      - key: ANTHROPIC_API_KEY   # 이름 추출·권리 판정·본문 요약. 이게 없으면 캐릭터 발굴이 안 돈다
        sync: false
      - key: TIKHUB_KEY          # 인스타·X·틱톡 수집
        sync: false
      - key: YOUTUBE_KEY         # 유튜브 붙이기
        sync: false
      - key: NAVER_ID            # 네이버 검색 추이
        sync: false
      - key: NAVER_SECRET
        sync: false
      # GitHub Actions의 자동 수집 요청을 검증한다. Actions의 CRON_SECRET과 같은 값을 넣는다.
      - key: CRON_SECRET
        sync: false

      # 하루 수집 상한. **배포본에 로그인이 없으므로 이게 비용의 천장이다.**
      # 주소를 아는 사람이면 누구나 수집 버튼을 누를 수 있다. 막는 대신 세어서 잠근다
      # (lib/core/run-limit.ts). 수동·자동을 합쳐 세고, 한국 날짜 자정에 풀린다.
      #
      # 판정기별과 전체를 따로 둔다. 앞엣것이 없으면 뉴스를 몇 번 돌린 날 캐릭터를
      # 아예 못 돌리고, 뒤엣것이 없으면 판정기 수만큼 곱해져 총액이 는다.
      - key: TREND_HUB_MAX_RUNS_PER_DISCOVERY
        value: "3"
      - key: TREND_HUB_MAX_RUNS_PER_DAY
        value: "10"
      - key: TREND_HUB_MAX_AUTOMATIC_RUNS_PER_DAY
        value: "3"

      # ── 카드뉴스 렌더 서버 (이름이 Render.com 과 겹치지만 다른 것이다) ──
      - key: RENDER_BASE
        value: https://cardnews-render.onrender.com

      # ── 아직 안 쓰는 것들. 비워 두면 그 기능만 화면에서 내려간다 ──
      - key: FAL_KEY             # 포스터 키비주얼. 2026-09-17 사용자 지시로 호출 안 함
        sync: false
      - key: GEMINI_API_KEY      # 참조 이미지 생성·영상 분석 (P4-3)
        sync: false

      # 1 을 넣으면 키가 있어도 전부 가짜 데이터로 돈다. 배포에서는 반드시 비워 둔다.
      - key: TREND_HUB_MOCK
        value: ""

      # ── 트렌드 레이더 ──
      # 레이더는 별도 파이썬 앱이다. 전에는 출력 폴더를 직접 읽어서 배포에서는 통째로
      # 내려갔다 — 그 폴더가 배포 환경에 없기 때문이다. 이제 HTTP 로도 읽는다.
      # 레이더를 어디든 띄우고 그 주소를 넣으면 배포본에서도 새 회차를 돌릴 수 있다.
      # 비워 두면 종전대로 화면에서 내려간다(lib/discoveries/radar.ts 의 held).
      # 저장된 회차는 어느 쪽이든 그대로 보인다.
      - key: RADAR_BASE
        sync: false
