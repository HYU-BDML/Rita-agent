            - **«카드 밖으로 N px 나간다»** — 그 줄을 **32~34자로 짧게 다시 써라.** 낱말만 바꿔치기하면 길이가 그대로다. 방금 한글로 옮긴 낱말이 길어서 넘쳤을 수 있다 — 그럴 땐 그 문장의 다른 데를 줄여서 자리를 만들어라.

            - **«꼭지가 N개다»** — 꼭지 수를 {{#2000000000003.count#}}개로 맞춰라.

            - **«3행 전언이 N/M 이다»** — 지적이 이름으로 대준 꼭지들의 본문 3행만 평서·~죠·느낌표·단서부사 중 서로 다른 걸로 바꿔라.

            - **«옮기지 않은 영문 [...]»** — 대괄호 안 낱말을 전부 한글로 바꿔라.

