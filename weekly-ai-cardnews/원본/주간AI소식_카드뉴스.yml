            - **«옮기지 않은 영문 [...]»** — 대괄호 안 낱말을 전부 한글로 바꿔라. 약어·모델명이 아니라고 판정된 것이니 예외를 만들지 마라.

            - 위에서 이름이 안 나온 꼭지·줄은 그대로 둔다. 통째로 다시 쓰면 어미 분포가 무너진다.


