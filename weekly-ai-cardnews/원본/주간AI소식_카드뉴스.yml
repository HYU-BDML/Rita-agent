        prompt_template:
        - role: system
          text: "# 표지 글 쓰기 — ai_freaks.kr **주차별 소식**\n\nDify 의 LLM 노드에 그대로 붙여 넣는 지시문이다.\n`dify/02_대본.py` 의 `slides[0]`(`\"type\": \"표지\"`) 를 만든다.\n\n> **이 문서는 주차별 소식(「N월 N주차 AI 소식」) 전용이다.**\n> 근거는 그 게시물 **19편**뿐이다. 팁·가이드나 단일 뉴스 게시물에는 쓰지 마라 — 틀이 다르다.\n\n**근거.** 2025-11-11 ~ 2026-08-15 의 주차별 소식 19편. 표지 훅은 OCR 로 뽑아 셌고,\n**표지 그림은 19장 전부 눈으로 봤다.** 아래 숫자는 전부 그 19편 실측이다.\n\n---\n\n## 0. 만들 것은 **한 줄뿐이다**\n\n2행은 **19편 전부 예외 없이** 이 형태다.\n\n```\n{N}월 {N}주차 AI 소식      ← 글자 하나 바꾸지 않는다\n```\n\n**그러니 이 노드가 만드는 건 1행 한 줄과 그림이다.** 2행은 날짜에서 계산해 넣는다.\n\n### 입력과 출력\n\n**입력**: 그 주 대본(`slides[]`). 꼭지들의 브랜드·헤드라인·본문.\n\n```json\n{\n  \"headline\": [\"1행 (만든다)\", \"8월 2주차 AI 소식 (계산해서 넣는다)\"],\n  \"eyebrow\": \"Weekly AI\",\n  \"accent_text\": \"8월 2주차\",\n  \"meme\": \"밈사전에서 고른 이름 — **반드시 하나 고른다**\",\n  \"밈쓰임\": \"그 밈의 「장면」을 그림에서 어떻게 쓰는지 한 줄 (한글). 검증이 밈사전의 장면과 대본다\",\n  \"image_type\": \"밈그림 | 로고캐릭터 | 은유그래픽 | 공식키비주얼\",\n  \"cast\": [\n    {\"role\": \"밈에서 이 자리가 누구인지\", \"company\": \"회사\",\n     \"strategy\": \"A_얼굴 | B_로고\", \"face\": \"쓸 인물 이름 (A일 때만)\"}\n  ],\n  \"gen_prompt\": \"4장 걸음4 의 네 줄 공식대로\",\n  \"ref_needed\": true\n}\n```\n\n`accent_text` 는 **청록(#00E1FF)으로 칠할 구간**이다. 주차별 표지는 `N월 N주차` 만\n청록이고 `AI 소식` 은 흰색이다. 줄 전체를 물들이면 안 된다.\n\n---\n\n## 1. 1행의 골격\n\n- **글자 수: 6~12자, 중앙 9자.** 19편을 다시 세어 확정했다 —\n  6자 1 · 7자 1 · 8자 3 · **9자 7** · 10자 4 · 11자 2 · 12자 1.\n- **상한선은 글자 수가 아니라 폭이다.** 헤드라인 107px, 여백 78, 캔버스 1080\n  → 쓸 수 있는 폭 **1002px**.\n\n| 1행의 구성 | 안전 | 한계 |\n|---|---|---|\n| **순한글만** | **10자** | **11자** (1002px, 딱 맞음) |\n| 공백 섞임 (보통) | 12자 | 13자 |\n| 영문·숫자 섞임 | 14자 | 16자 |\n\n`가` 11자 = 1002px(한계), 12자 = 1093px(넘침).\n확실하게 하려면 `render-server/template_render.py` 의 `_measure_tracked()` 로 재라.\n\n### 1행을 끝내는 방식\n\n| 방식 | 19편 중 | 예 |\n|---|---|---|\n| **쉼표** | **10 (53%)** | `생태계 교란 중,` `무너지는 저작권,` `업데이트 폭탄,` |\n| 그냥 끊기 | 4 (21%) | `로봇 경쟁 본격화` `챗지피티 땡큐` `메타의 브랜뉴데이` |\n| 물음표 | 3 (16%) | `그래서 뭐 써요?` `GPT 안 쓰시나요?` |\n| 말줄임 | 1 | `구글은 신이야..` |\n| 느낌표 | 1 | `영상 AI 대격돌!` |\n\n**쉼표가 기본값이다.** 절반이 쉼표로 끊고 2행으로 넘긴다.\n\n---\n\n## 2. **1행 문구**의 갈래 — 넷뿐이다\n\n> 뒤에 나오는 §4 「**그림**의 농담 넷」과 다른 것이다. 여기는 **글**, 저기는 **그림**이다.\n\n19편이 이 넷에 **하나도 빠짐없이** 들어간다.\n\n### ① 판 전체의 상태 — 10건 (53%) · **기본값**\n\n그 주 업계 전체의 온도를 한마디로. **특정 회사 편을 들지 않는다.**\n\n```\n로봇 경쟁 본격화 · 대세는 AI 쇼핑, · 영상 AI 대격돌! · 끝나지 않는 전쟁,\n업데이트 폭탄, · 생태계 교란 중, · 무너지는 저작권, · 에이전트 급증,\n비주얼 전쟁 중, · 매주 바뀌는 판도,\n```\n\n**만드는 법**: 그 주 꼭지들을 훑어 공통 주제를 찾는다 → 명사구로 압축한다.\n`전쟁` `교란` `폭탄` `급증` `대격돌` 처럼 **판이 흔들린다는 낱말**을 쓴다.\n\n### ② 한 회사를 콕 집어 — 4건 (21%)\n\n그 주에 한 회사가 압도했을 때만. **감탄이나 조롱으로 받는다.**\n\n```\n구글은 신이야.. · 챗지피티 각성, · 챗지피티 땡큐 · 메타의 브랜뉴데이\n```\n\n### ③ 독자에게 말 걸기 — 3건 (16%)\n\n```\n그래서 뭐 써요? · GPT 안 쓰시나요? · AI 싸움수준 실화냐?\n```\n\n### ④ 밈 인용 — 2건 (11%)\n\n```\n오늘도 혼란한 업계 (혼란하다 혼란해) · 설명할 시간이 없어, (영화 대사)\n```\n\n---\n\n## 3. 밈은 **반드시 고른다**\n\n> **원본과 다른 우리 규칙이다.** 원본 19편에서 밈을 쓴 훅은 **7/19 (37%)** 뿐이고\n> 이 문서도 한때 「필수가 아니다」라고 적어 두었다. **그 문장이 사고를 냈다** —\n> 훅 검증은 밈을 필수로 막는데 문서는 아니라고 하니, LLM 이 **밈 이름만 채우고\n> 그림은 밈과 무관하게** 만들었다(실측 2026-08-20: 금색 구슬 표지).\n> **문서와 검증이 어긋나면 LLM 은 엉뚱한 쪽을 확신을 갖고 따른다.**\n>\n> 왜 필수로 바꿨나: 밈이 없으면 서버가 프롬프트만 보고 그림을 통째로 지어내는데,\n> 그게 한눈에 «AI 가 만든 티» 가 난다. 밈이 있으면 구도·조명을 실제 사진에서\n> 가져오고 배역만 갈아끼운다. **원본 분포보다 그림 품질을 택했다.**\n\n**밈이 붙으면 훅과 그림이 한 몸이 된다.** [`밈사전.md`](밈사전.md) 에서 고르고,\n**고른 밈의 「장면」이 `gen_prompt_en` 안에 실제로 들어가야 한다** — 이름만 채우면 안 된다.\n\n| 훅 | 가리키는 것 | 표지 그림 |\n|---|---|---|\n| `설명할 시간이 없어,` | 영화 대사 클리셰 | 머스크가 사이버트럭에서 손 내밀고 뒤엔 폭발 |\n| `메타의 브랜뉴데이` | 스파이더맨: 브랜드 뉴 데이 | 저커버그 얼굴 + 스파이더맨 슈트, 가슴에 메타 ∞ |\n| `오늘도 혼란한 업계,` | «혼란하다 혼란해!» | 트럼프 만화. 밈 원문이 그림 안에 그대로 |\n| `GPT 안 쓰시나요?` | 좌절 짤 | 홍명보가 머리 쥐어뜯는 사진, 이마에 OpenAI 로고 |\n| `챗지피티 각성,` | 마늘 먹고 각성 | 샘 알트만 흑백 + 마늘이 떠다님 (캡션 이모지도 \U0001F9C4) |\n\n**맞는 밈이 안 보이면 억지로 끼우지 말고 «다른 밈» 을 찾아라.** 밈사전에 74개가 있다.\n1인·2인·다인용이 다 있으니 그 주의 판에 맞는 배역 수부터 고르면 대개 하나는 걸린다.\n\n### 이름을 아낀다\n\n**1행에 브랜드 이름이 든 건 5/19 (26%)뿐이다.** 나머지 74%는 회사 이름이 없다.\n갈래 ②일 때만 이름을 쓴다.\n\n### 하지 말 것\n\n- 두 줄 합쳐 30자 넘기기 / 순한글 11자 넘기기\n- 1행에 회사 이름 + 제품 이름 + 숫자를 몰아넣기 (광고문이 된다)\n- `놀라운` `혁신적인` `충격` 같은 맹물 수식어 — 19편 중 한 건도 없다\n- 2행 `N월 N주차 AI 소식` 을 건드리기\n- 한 훅에 밈 두 개 / 밈 문구를 통째로 베끼기\n- 이모지 (표지엔 없다, 캡션에만)\n- 국내 정치인·사건사고를 소재로 쓰기\n\n---\n\n## 4. 표지 그림 만드는 법 — 다섯 걸음\n\n### 걸음 1 — 주인공 회사를 정한다\n\n**`slides[1].brand`** — 표지 바로 다음, 첫 뉴스 꼭지의 회사. 6편에 대고 재 보니\n**첫 꼭지 5/6**, 최다 등장 회사 4/6 이었다. 첫 꼭지가 이긴다.\n\n`8/09 메타` 가 증거다. 메타 꼭지는 그 편에 하나뿐(최다는 OpenAI 4개)인데도\n표지 주인공이 저커버그였다 — 그게 02번이었기 때문이다.\n\n**우선순위 (위가 이긴다)**\n1. **밈이 요구하는 배역** — `설명할 시간이 없어` 는 «차 모는 사람» 이라 머스크가 됐다\n2. **본문에 사람 이름이 박혀 있으면 그 사람** — 266꼭지 중 14개(5%)\n3. **`slides[1].brand` → 회사 → 얼굴**\n\n### 걸음 2 — 밈의 배역이 몇 자리인지 센다\n\n밈사전의 「장면」 칸을 보고 사람이 몇 명 필요한지 센다. **배역 수 = 등장 회사 수.**\n\n| 배역 | 밈 예 | 회사 |\n|---|---|---|\n| 1인 | 누가 돌아왔게 · 좌절 짤 · 설명할 시간이 없어 · 마늘 각성 | 1개 |\n| 2인 | 슬램덩크 · 오늘부터 1일 · 딱 대 | 2개 |\n| 3인 이상 | 어벤져스 · 사무라이 대결 · 다 모여 | 3개+ |\n\n### 걸음 3 — 어떤 «손» 으로 그릴지\n\n**기법은 갈래가 아니다.** 걸음 4 에서 정한 농담을 그리는 방법이다.\n한때 이 표가 걸음 3 과 걸음 4 에 나뉘어 두 번 적혀 있었다 — 합쳤다(2026-08-20).\n\n| 기법 | 언제 | 예 |\n|---|---|---|\n| **얼굴 합성 (전략 A)** | **①의 기본값.** 밈 인물 자리에 CEO 얼굴 | 저커버그+스파이더맨 · 머스크+사이버트럭 |\n| **로고 얹기 (전략 B)** | 얼굴 없는 브랜드 · 밈 원본 인물을 살려야 할 때 · 배역 3명 이상 · 국내 정치인 | 홍명보 **이마에** OpenAI · 슬램덩크 선수 얼굴에 로고 |\n| **누끼 + 평면 바탕** | **오려낸 것에 «뜻» 이 있을 때만** | 알트만 흑백+마늘(밈을 안다는 신호) · 두 CEO 듀오톤(맞붙은 구도) |\n| **3D 렌더** | ②에서 로고를 캐릭터로 | 3D 로고 캐릭터 둘 |\n| **사진** | ③④ | 수정구슬 · 마네킹 로봇 |\n\n**A 가 먼저다.** 얼굴 합성과 로고 얹기 둘 다 좋다는 평을 받았지만\n**둘 중에는 얼굴 합성이 낫다**(사용자 평 2026-08-20). B 는 위 조건일 때만 간다.\n\n> **누끼는 뜻이 없으면 쓰지 마라.** 뜻 없이 사람만 오려 단색에 얹으면\n> 그냥 사진만 못하다(2026-08-20 실측: 피차이+민트+추상선이 그랬다).\n\n### 우리가 다루는 브랜드는 일곱 — 얼굴은 다섯뿐\n\n| 브랜드 | 출처 | 얼굴 | 전략 |\n|---|---|---|---|\n| ChatGPT · OpenAI | `@OpenAI` / openai.com/news | 샘 알트만 | **A** |\n| Claude · Anthropic | `@AnthropicAI` / anthropic.com/news | 다리오 아모데이 | **A** |\n| Gemini · Google | `@GeminiApp` / blog.google | 순다르 피차이 | **A** |\n| Grok · xAI | `@xai` / x.ai/news | 일론 머스크 | **A** |\n| Meta AI | `@AIatMeta` / ai.meta.com/blog | 마크 저커버그 | **A** |\n| **Cursor** | `@cursor_ai` / cursor.com/blog | **없음** | **B 고정** |\n| **Perplexity** | `@perplexity_ai` / perplexity.ai/hub | **없음** | **B 고정** |\n\n**Cursor·Perplexity 는 전략 A 가 불가능하다.** 위키미디어에 인물 사진이 없다\n(실측 2026-08-19). 이 둘이 주인공이면 무조건 로고다.\n\n**참조 사진은 「얼굴 신분증」이지 자세 견본이 아니다.** 앉은 사진·화난 사진을 따로 구하려\n들지 마라 — 위키미디어의 CEO 사진은 무대에서 말하는 정면 컷 한 장뿐이다. 자세·표정·옷은\n**프롬프트가 만든다.** `procure/faces.py` 가 받아 온다.\n\n### 걸음 4 — 무슨 «농담» 인지부터 정한다\n\n**2026-08-20 2차 개정.** 1차에서는 갈래를 «화풍»(AI생성/실사/누끼/합성/만화)으로\n나눴는데, 그렇게 시켰더니 **다섯 장이 「AI 가 빨라졌다」 하나를 다섯 화풍으로 그린**\n결과가 나왔다. 톤이 다 비슷했고 웃기지 않았다.\n\n**원본 18장이 실제로 나뉘는 축은 화풍이 아니라 「농담의 방식」이다.**\n\n| 농담 | 편 | 비율 | 원본 예 |\n|---|---|---|---|\n| **① 아는 밈에 갖다 붙이기** | 6 | 33% | 알트만+마늘 · 홍명보 이마에 로고 · 저커버그 스파이더맨 · 머스크 사이버트럭 · 트럼프 만화 · 브래드 피트 |\n| **② 브랜드를 사람처럼** | 4 | 22% | 3D 로고 캐릭터 둘이 껴안음 · 로고 캐릭터 대결 · 빨간 벌레 · 두 CEO 듀오톤 대결 |\n| **③ 한 컷 은유** | 5 | 28% | 수정구슬 · 레트로 CRT · 제미나이 별 · 나무뿔 인물 |\n| **④ 그냥 좋은 사진** | 3 | 17% | 마네킹 로봇 · 폰 쇼핑 · 비눗방울 소녀 |\n\n**①②가 절반이 넘는다(56%). 이 판은 웃기려고 만드는 판이다.**\n③④는 그 주에 붙일 농담이 없을 때 가는 길이지 기본값이 아니다.\n\n**갈래를 돌려 쓰는 게 아니라 재료가 정한다.**\n\n```\n그 주 사건에 딱 맞는 밈이 있나?      → ① 밈에 붙인다\n브랜드 둘이 맞붙은 주인가?           → ② 사람처럼 세운다\n사건은 큰데 그림으로 만들 밈이 없나?  → ③ 한 컷 은유\n그마저 없나?                       → ④ 좋은 사진 하나\n```\n\n#### 갈래마다 지킬 것 — 2026-08-20 2차 결과를 보고 정했다\n\n**① 밈에 붙이기 — 손은 걸음 3 을 보라.** 얼굴 합성이 기본값이고 로고 얹기는 조건부다.\n\n**② 브랜드를 사람처럼 — 여럿이어도 된다.** 2차에서 로고 박은 캐릭터 다섯이 줄지어\n선 그림이 좋았다. 「주인공 하나」는 **개수 규칙이 아니라 초점 규칙**이다 —\n여럿이 **한 무리로 뭉쳐 한 덩어리로 읽히면** 그건 초점 하나다.\n흩어져 각자 놀면 안 된다.\n\n**③ 한 컷 은유 — 오브젝트가 «실물» 이어야 한다.** 스톡 3D 아이콘 같은 것(로켓 모양\n칩·유리구슬)은 1차에서 「웃기지도 눈에 걸리지도 않는다」는 평을 받았다.\n원본의 수정구슬·CRT 는 **실제로 있을 법한 낡은 물건**이다.\n\n**④ 그냥 좋은 사진 — «순수» 사진이다. 그래픽을 얹지 마라.**\n원본 셋(마네킹 로봇 · 폰 쇼핑 · 비눗방울 소녀)에는 **떠 있는 빛·상징·추상 오버레이가\n하나도 없다.** 2차에서 야경 사진 위에 「AI 로고를 연상시키는 빛 궤적」을 하늘에\n넣었더니 **합성한 티가 났다**(사용자 평: 「뭔가 합성이 잘 안 된 듯」).\n이 갈래는 **카메라로 찍을 수 있는 것만** 담는다.\n\n#### 얼굴이 나오면 «아는 얼굴» 이어야 한다\n\n**모르는 사람의 얼굴이 주인공이면 스톡 사진으로 읽힌다.** 2차 ④번이 그랬다 —\n사무실에서 노트북을 보는 무명 회사원이 나왔고, **「사람이 누군데?」** 라는 평을 받았다\n(2026-08-20).\n\n**규칙: 사람이 나오면 «아는 사람» 이다.** 알트만 · 아모데이 · 피차이 · 머스크 ·\n저커버그, 또는 밈이 요구하는 그 인물. **모르는 사람은 아예 안 쓴다.**\n\n> **실루엣·뒷모습으로 피하지 마라.** 이 규칙을 처음 쓸 때 「장면이 주인공이면\n> 얼굴을 안 보여도 된다」는 여지를 뒀더니, 다음 판이 곧바로 **무명 인물을 실루엣으로**\n> 세워 왔다(2026-08-20). 얼굴을 가리는 것은 답이 아니다.\n\n**사람 없이 가도 된다.** 원본 ④갈래에도 사람이 안 나오는 편이 있다 — 폰을 든 손,\n마네킹, 물건 하나. **모르는 사람을 세우느니 사람을 빼라.**\n\n```\n아는 사람이 있다   → 그 사람을 크게\n아는 사람이 없다   → 사람을 빼고 물건·손·장면으로 간다\n```\n\n#### ④갈래의 기본값은 «아는 얼굴 다큐멘터리 사진» 이다\n\n밈 없이 그 주의 주인공을 **다큐멘터리 사진처럼** 담는다 — 무대에서 말하는 알트만,\n사무실 창가의 피차이. 밈을 붙이는 ①과 다른 점은 **농담이 없다**는 것뿐이다.\n\n**같은 주 소식으로 둘을 나란히 뽑아 대보고 정했다**(2026-08-20):\n\n| | 결과 |\n|---|---|\n| 아는 얼굴 — 무대의 알트만 | **이쪽으로 간다** |\n| 사물 — 역에 들어오는 고속열차 | 나쁘지 않으나 진다 |\n\n**원본 18편에는 이 조합이 없다. 우리가 더한 갈래다** — 원본의 ④는 무명 모델·손·\n사물이었는데, 그건 스톡 사진으로 읽힌다는 판단이다(사용자 결정).\n\n```\n그 주 주인공이 뚜렷하다        → 그 사람을 다큐멘터리 사진으로   ← 기본값\n주인공이 여럿이라 못 고르겠다   → 사물·손·장면으로 간다\n```\n\n무대·사무실·복도처럼 **실제로 그 사람이 있을 법한 자리**에 두고, 카메라·빛을\n구체로 적는다(85mm f/2 · 키노트 스포트라이트 front-left · 4500K · 필름 그레인).\n**밈을 안 붙이므로 얼굴을 바꾸는 게 아니라 그 사람 그대로다.**\n\n---\n\n### 걸음 5 — 프롬프트 쓰는 법\n\n구글이 밝힌 권장 구조와 우리 실측을 합친 것이다.\n\n```\n① 화풍     한 갈래만. 「사진이면 사진」 — 섞으면 어중간해진다\n② 주인공   초점 하나. 여럿이어도 «한 무리» 로 뭉쳐 있으면 된다\n③ 자리     어디에 있나 · 카메라가 어디서 보나\n④ 빛       방향 · 색온도 · 그림자\n⑤ 바탕     한 겹. 색을 «이름» 으로 지정한다\n⑥ 아래 띠  글자가 앉을 자리를 «어떻게 생겼는지» 로 적는다\n```\n\n#### 부정문으로 쓰지 마라 — 이게 제일 크다\n\n구글 문서가 못 박는다: **「없다」가 아니라 「어떻게 생겼다」로 쓴다.**\n\n```\n안 됨   no cars, no text, no clutter, no multiple logos\n됨      an empty deserted street · blank unmarked surfaces ·\n        a single subject against an even field\n```\n\n`no cars` 안에는 **`cars` 라는 낱말이 들어 있다.** 모델은 프롬프트 전체를 조건으로\n받는데 「없음」이라는 논리는 약하게 실리고 **개념은 그대로 실린다.**\n\n> **우리 실측으로는 아직 이 때문에 망한 적이 없다.** 13장을 뽑는 동안 부정문을\n> 프롬프트마다 1~6개씩 썼는데 글자가 새어 나온 장은 **0장**이었다(2026-08-20).\n> 한때 「『Nothing else in the frame』을 적고도 아이콘이 여섯 개 떴다」를 근거로 적었는데\n> **그건 오진이었다** — 그 프롬프트는 `abstract glowing emblems float in the air` 라고\n> **긍정문으로 여섯 개를 요구하고 있었다.**\n>\n> **그러니 진짜 위험은 부정문이 아니라 «긍정문으로 잡동사니를 요구하는 것» 이다.**\n> 그건 「초점 하나」 규칙이 잡는다. 부정문은 구글 권고이고 손해도 없으니 안 쓰는 게\n> 좋지만, **이걸로 되돌리는 관문은 만들지\
            \ 않는다**(사용자 결정 2026-08-20) —\n> 근거가 이론뿐인 관문은 거짓 경보만 만든다.\n\n#### 색은 이름으로 부른다 — 청록은 «글자색» 이지 그림색이 아니다\n\n**`#00E1FF` 는 헤드라인 강조색이다. 그림 팔레트가 아니다.**\n1차에서 다섯 프롬프트에 전부 `teal` 이 들어가 다섯 장이 다 같은 톤이 됐다.\n\n원본이 실제로 쓴 바탕색:\n\n```\n하늘색 (12월 3주차)   빨강 (12월 4주차)     분홍·검정 (2월 1주차)\n분홍·보라 (4월 4주차)  주황·노랑 (7월 4주차)  회색 실내 (11월 3주차)\n```\n\n**밝은 표지가 원본의 절반이다.** 어둡게만 만들지 마라.\n색은 `deep crimson` · `flat sky blue` · `warm cream` 처럼 **이름으로** 적는다.\n\n#### 사진일 때는 카메라를 적는다\n\nAI 그림이 가짜로 보이는 이유는 **빛이 사방에서 똑같이 오고, 너무 깨끗해서**다.\n사진 갈래(③④)에서는 이걸 넣는다.\n\n```\nShot on 85mm at f/1.8 · late afternoon light from the left, warm 4500K,\nlong shadows falling right · fine film grain · natural skin texture\n```\n\n#### 아래 띠 — «어둡게» 가 아니라 «이렇게 생겼다»\n\n「아래 45% 를 어둡게」라고만 했더니 **판 전체가 어두워졌다**(1차 다섯 장 전부).\n그 자리가 어떻게 생겼는지로 적는다.\n\n```\nThe bottom 45 percent is one calm unbroken field — deep shadow, a plain wall,\nopen water, or a single saturated colour — dark enough that white text reads on it.\nThe subject sits above it.\n```\n\n#### 완성 예 — 갈래별로 이렇게 생겨야 한다\n\n**① 밈에 붙이기**\n\n> Cinematic film still. Elon Musk leans out of the open door of an angular steel\n> pickup, one arm reaching toward the camera. Night street, wet asphalt.\n> Key light from a streetlamp camera-left, cool 5600K, hard shadow to the right.\n> Fine film grain, natural skin texture. The bottom 45 percent is the dark car\n> body and unlit road — one even field, dark enough for white text.\n\n**② 브랜드를 사람처럼**\n\n> Soft 3D render, matte clay material. Two rounded mascot characters — one warm\n> orange with a square head, one pale mint with a round head — shake hands in the\n> centre, filling the upper two thirds. Studio light from above, soft shadow below.\n> Background is a flat **sky blue** field. The bottom 45 percent is that same blue\n> deepening into navy, empty.\n\n**③ 한 컷 은유**\n\n> Photorealistic still life, shot on 85mm at f/2. A single crystal sphere rests on\n> a weathered concrete plinth in an empty field. Overcast light from above,\n> muted palette, fine grain. The horizon sits high; the bottom 45 percent is\n> dark grass in shadow, one even field.\n\n---\n\n### 18편 전부에 있는 것 — 빠뜨리면 남의 판으로 보인다\n\n- **계정 로고가 아래 가운데** (x 451~668 · y 1233~1316). 18/18. 렌더러가 그린다\n- **그림 안에 글자 없음** (만화 1편의 원본 말풍선만 예외)\n- **아래 40% 가 어둡거나 비어 있음**\n- 윗글씨는 셋 중 하나: `Weekly AI` 11편 · `WEEKLY AI` 4편 · `AI NEWS` 3편\n\n> **반복 방지**: 최근 3편에 같은 얼굴이 나왔으면 이번 편은 전략 A 를 쓰지 않는다.\n> 로고 캐릭터나 은유 그래픽으로 가고, 밈도 다인용·무인용에서 고른다.\n\n---\n\n## 5. 내보내기 전 자기 점검\n\n1. **2행이 `{N}월 {N}주차 AI 소식` 그대로인가?** 건드렸으면 되돌린다.\n2. **1행이 7~11자인가?** 순한글이면 10자를 넘기지 않았는가?\n3. 1행이 네 갈래 중 어디인가? 못 대면 다시 쓴다.\n4. 갈래 ②가 아닌데 회사 이름을 넣지 않았는가? (74%가 이름이 없다)\n5. 밈을 억지로 붙이지 않았는가? 3분의 2는 밈이 없다.\n6. `accent_text` 가 `N월 N주차` 인가? (`AI 소식` 까지 넣으면 안 된다)\n7. `gen_prompt` 에 «하단 40% 어둡게» 가 들어갔는가?\n8. 최근 3편에 같은 얼굴을 또 쓰지 않았는가?\n\n## 6. 예시 — 19편 전부\n\n```\n1행                    갈래   그림\n로봇 경쟁 본격화          ①판   사람과 휴머노이드 로봇이 등 맞대고 선 홍보컷\n구글은 신이야..          ②회사  밤하늘 제미나이 별을 올려다보는 사람\n대세는 AI 쇼핑,          ①판   폰으로 쇼핑앱 넘기는 손\n영상 AI 대격돌!          ①판   비 오는 밤 식당, AI 로 만든 영화풍 장면\n챗지피티 각성,           ②회사  샘 알트만 흑백 + 마늘 (밈)\n끝나지 않는 전쟁,         ①판   피차이와 알트만 나란히, 배경에 로고\n업데이트 폭탄,           ①판   나뭇가지 뿔 판타지 인물 (Runway 결과물)\n생태계 교란 중,          ①판   빨간 벌레 캐릭터 (OpenClaw 로고 캐릭터화)\n무너지는 저작권,          ①판   피 흘리는 브래드 피트 (본문의 Seedance 논란 영상)\n에이전트 급증,           ①판   폐허 CRT 위 수정구슬에 AI 로고들\n비주얼 전쟁 중,          ①판   레트로 CRT 에 OpenAI 로고\n그래서 뭐 써요?          ③말걸기 3D 로고 캐릭터 둘이 껴안음\n매주 바뀌는 판도,         ①판   비눗방울 부는 교복 소녀\n오늘도 혼란한 업계        ④밈   트럼프 만화 + SPACEX·OpenAI·Claude 로고\nGPT 안 쓰시나요?         ③말걸기 홍명보 좌절 짤 + 이마에 OpenAI 로고 (밈)\nAI 싸움수준 실화냐?       ③말걸기 사무라이 갑옷 입은 로고 캐릭터들\n챗지피티 땡큐            ②회사  샘 알트만 얼굴 영화 합성 (밈)\n메타의 브랜뉴데이          ②회사  저커버그 + 스파이더맨 슈트 (밈)\n설명할 시간이 없어,        ④밈   머스크 사이버트럭 + 폭발 (밈)\n```\n\n---\n\n## 이 문서가 딛고 선 것과 못 딛은 것\n\n**딛은 것.** 주차별 소식 19편 전수. 훅은 OCR, 그림은 19장 다 눈으로 봤다.\n글자 폭은 저장소 폰트로 직접 쟀다.\n\n**못 딛은 것.**\n- **19편은 작은 표본이다.** 갈래 비율(①53% ②21% ③16% ④11%)은 몇 편만 더 쌓여도 흔들린다.\n- **2026-06-20 에 표지 방향이 크게 바뀌었다.** 그 전 13편은 밈이 거의 없고 은유·그래픽\n  위주, 그 뒤 6편이 밈·영화 패러디다. 본문이 5줄→3줄로 바뀐 날과 같은 날이다.\n  **최신 쪽에 무게를 두고 읽어라.**\n- 밈 출처를 특정 못 한 것이 있다 (2026-08-03 알트만 합성이 무슨 영화인지 모른다).\n- `무너지는 저작권` 편 표지는 9:16 비율에 `dy1` 워터마크가 있다. **남의 콘텐츠\n  리포스트일 수 있으니** 모범 사례로 삼지 마라.\n\n\n---\n\n# 밈 사전 — 표지 훅용\n\n[`표지글_쓰기.md`](표지글_쓰기.md) 3~4장이 쓰는 창고다. 훅은 밈의 절반이라 **밈을 못 찾으면\n훅이 안 나온다.** 그래서 밈 이름이 아니라 **AI 소식 상황별**로 묶었다 — \"이 소식엔 무슨 밈?\"\n으로 찾게.\n\n## 소식에서 밈 찾는 법 — 2단계\n\n**① 소식이 12칸 중 어디인지 고른다.** 본문을 읽고 사건 유형을 판정한다.\n실제 소식 266개로 재 보니 **95% 가 어느 칸엔가 들어간다**(안 들어간 것 13개, 5%).\n평균 2.2칸에 걸리므로 후보가 여럿 나온다.\n\n**② 그 칸의 밈 중 하나를 고른다.** 최근에 안 쓴 것, \U0001F525 정점인 것, ⚙️ 자동화 되는 것 우선.\n\n### 어느 소식을 1번(표지)으로 올릴까 — **드문 칸이 이긴다**\n\n266꼭지의 칸 분포를 세면 심하게 쏠린다. 그래서 «밈이 붙느냐» 로는 변별이 안 된다 —\n거의 다 붙기 때문이다. **드문 칸일수록 그 주의 특이한 사건**이고, 그 칸 밈은 아직 안\n써봤을 테니 신선하다.\n\n| 순위 | 칸 | 266꼭지 중 | 뜻 |\n|---|---|---|---|\n| 1 | 6 인재 이탈 | 3 (1%) | **제일 드물다. 있으면 무조건 표지감** |\n| 2 | 10 급전개 | 4 (2%) | |\n| 3 | 4 줬다 뺏기 | 11 (4%) | |\n| 4 | 5 인수합병 | 17 (6%) | |\n| 5 | 2 경쟁사 추월 | 19 (7%) | |\n| 6 | 7 사고·사과 | 20 (8%) | |\n| 7 | 11 팁·가이드 | 37 (14%) | |\n| 8 | 3 값 인하·무료 | 54 (20%) | |\n| 9 | 8 성능 폭발 | 63 (24%) | |\n| 10 | 9 일이 편해졌다 | 146 (55%) | 매주 있다 |\n| 11 | 1 신제품 등장 | 175 (66%) | **매주 있다. 표지로 쓰면 매주 똑같아진다** |\n\n**«센 소식» 을 주관으로 고르는 대신 이 표를 쓴다.** 근거가 숫자라 재현된다.\n\n## 표를 읽는 법\n\n- **장면** 칸이 곧 표지 그림이다. 장면이 안 적히는 밈은 훅으로도 쓰지 마라.\n- **출처** 칸:\n  - ✅ **이 계정이 실제로 쓴 것** — 204개 훅과 266개 꼭지 헤드라인에서 확인\n  - \U0001F50D **웹에서 확인한 한국 밈** — 나무위키·캐릿 등에서 실재 확인\n  - ⚠️ **내가 아는 것 (미검증)** — 쓰기 전에 사람이 한 번 봐라. 낡았거나 틀릴 수 있다\n\n---\n\n## 1. 신제품이 나왔다 · 등장했다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 원피스 | 내 동료가 돼라 | 루피가 손 내밀며 영입 | ✅ `너, AI 잘한다며 / KT랑 동료가 돼라` · `너 내 동료가 돼라! / OpenAI·OpenClaw 합류` |\n| 아이언맨 | 안에 사람 없습니다 | 슈트 안이 비었는지 두드려 보는 장면 | ✅ `X-peng Iron' 공개, / \"안에 사람 없습니다..\"` |\n| 리얼스틸 | 로봇 격투 | 링 위 로봇이 사람 동작을 그대로 따라함 | ✅ `리얼스틸이 현실로,` |\n| 어벤져스 | 어셈블 / 인피니티 스톤 | 히어로들이 한 줄로 모임 | ✅ `AI 어벤져스 합작` · `클로드의 타임스톤,` |\n| 나야, 들기름 | 나야, 들기름 | 정색한 얼굴로 자기 정체를 밝힘 | ✅ `나야, 제미나이.` |\n| 그런데 그것이 실제로 일어났습니다 | 〃 | 만화 컷 뒤에 붙는 자막 | \U0001F50D |\n| 상상도 못한 정체 | 〃 | 반전 공개 순간 | ✅ `상상도 못한 정체, / 의료사업 시작한 미드저니` |\n\n## 2. 경쟁사를 제쳤다 · 왕좌를 뺏었다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 슬램덩크 | 왼손은 거들 뿐 | 강백호 슛 자세, 관중석 안 선생님 | ✅ `인간은 거들 뿐,` — 선수 얼굴에 로고 씌움 |\n| 슬램덩크 | 포기를 모르는 남자 / 영감님의 영광의 시대는 언제였죠? | 벤치·코트 대치 | ⚠️ |\n| 태조 왕건 궁예 | 누가 기침 소리를 내었는가 | 궁예가 관심법으로 신하를 노려봄 | \U0001F50D — 회사가 딴짓하다 걸린 소식에 |\n| 드루와 | 드루와 | 문 열고 도발하는 장면 | ✅ `제미나이 드루와..` |\n| 딱 대 | 딱 대 | 붙자고 손짓 | ✅ `어도비 딱 대,` |\n| 왕좌 탈환 | — | 왕좌에 앉은 실루엣 | ✅ `코딩 AI 왕좌 탈환,` · `AI 왕의 귀환,` |\n| 나노바나나 멈춰! | 멈춰! | 손바닥 내밀어 제지 | ✅ `나노바나나 멈춰!` |\n| 이거 실화냐? | 〃 | 눈 크게 뜨고 화면 응시 | ✅ `AI 싸움수준 실화냐?` \U0001F50D |\n| **누가 돌아왔게** \U0001F525 | 감옥에서 누가 돌아왔게~? | 문 열고 압도적 성량으로 등장 | ✅ `중국에서 누가 돌아왔게` \U0001F50D — 2026.07~ 정점, `OO에서` 만 갈아 끼우면 됨 |\n| 그린그린 레드레드 | 별로면 레드레드\U0001F6A8 좋으면 그린그린\U0001F49A | 비포&애프터 두 칸 | \U0001F50D 벤치마크 비교에 |\n\n## 3. 값이 내렸다 · 무료로 풀렸다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 야나두 | 야, 너두 할 수 있어 | 손가락으로 가리키며 권함 | ✅ `야 너도 할 수 있어,` |\n| 갓성비 | 갓+가성비 | 가격표에 후광 | ✅ `갓성비로 돌아왔다` |\n| 아묻따 | 아무것도 묻지도 따지지도 말고 | 손사래 치며 바로 결제 | ✅ `아묻따 타는겁니다` |\n| 떠먹여드림 | 떠먹여 준다 | 숟가락을 입에 대 줌 | ✅ `자동화 떠먹여드림` |\n| 딸깍 | 딸깍 한 번이면 끝 | 마우스 클릭 한 번 | ✅ 여러 건 |\n\n## 4. 값이 올랐다 · 혜택이 줄었다 · 배신당했다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 줬다 뺏기 | 줬다 뺏는 게 제일 나빠 | 손에 쥔 걸 도로 뺏는 장면 | ✅ `줬다 뺏기 레전드,` |\n| 내 OO 돌려줘요 | 〃 | 울먹이며 손 내밈 | ✅ `내 페이블 돌려줘요,` |\n| 고만해, 미친놈들아! | 〃 | 말리며 절규 | \U0001F50D |\n| 근데 어쩔건데? | 〃 | 어깨 으쓱 | \U0001F50D |\n| 내가 고자라니 | 〃 | 무릎 꿇고 절규(아수라) | \U0001F50D — 강도가 세니 가벼운 소식엔 쓰지 마라 |\n\n## 5. 인수·합병·제휴했다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 오늘부터 1일 | 〃 | 커플이 손잡고 셀카 | ✅ `오늘부터 1일 / 머스크 X 앤트로픽` |\n| 꿀꺽 | 통째로 삼킴 | 큰 입이 작은 걸 삼킴 | ✅ `90조원으로 '커서 꿀꺽` · `제미나이를 삼켰다` |\n| 입주 | 〃 | 이사 트럭이 건물로 들어감 | ✅ `노션에 입주한 커서` · `GPT 안으로 입주한 구글 드라이브` |\n| 우리도 데려가줘요 | 〃 | 뒤에서 손 흔들며 따라감 | ✅ `우리도 데려가줘요,` |\n| 다 모여! | 〃 | 한자리에 우르르 | ✅ `금융 전문가 다 모여!` |\n\n## 6. 인재가 떠났다 · 사람이 옮겼다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 줄줄이 | 〃 | 짐 싸서 줄지어 나감 | ✅ `구글 AI 인재들 / 줄줄이 앤트로픽으로` |\n| 너 내 동료가 돼라 | 〃 | (위와 같음) | ✅ |\n| 왔다 갑니다 | 〃 | 잠깐 들렀다 떠나는 뒷모습 | ✅ `젠슨황 18년만에 / 서울대 왔다 갑니다` |\n\n## 7. 사고 쳤다 · 장애 · 사과\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 좌절 짤 (홍명보) | 〃 | 머리를 쥐어뜯는 감독 | ✅ `GPT 안 쓰시나요?` — 이마에 로고 |\n| 혼란하다 혼란해! | 〃 | 웃으며 뒷걸음질 (만화체) | ✅ `오늘도 혼란한 업계,` ⚠️ 정치인 소재라 그림은 수급 필요 |\n| 더 이상의 자세한 설명은 생략한다 | 〃 | 자막만 있는 검은 화면 | \U0001F50D |\n| 그래도 본업은 잘해요 | 〃 | 딴짓하다 본업 성과 내밀기 | ✅ `그래도 본업은 잘해요,` |\n| 이 집 영업 잘하네 | 〃 | 식당에서 감탄 | ✅ `이 집 영업 잘하네,` |\n\n## 8. 성능이 미쳤다 · 압도했다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 각성 (마늘) | 마늘 먹고 각성 | 흑백 인물 주변에 마늘이 떠다님 | ✅ `챗지피티 각성,` — 캡션 이모지도 \U0001F9C4 |\n| 끝판왕 | 〃 | 최종 보스 실루엣 | ✅ `AI 영상 끝판왕` · `이미지 끝판왕 갱신` |\n| 치트키 | 〃 | 게임 콘솔에 코드 입력 | ✅ `치트키 장착하기` |\n| 괴물 | 〃 | 거대한 형체가 다가옴 | ✅ `괴물같은 성능,` · `디자인 괴물의 등장,` |\n| 코딩 맹수 | 〃 | 맹수가 키보드 앞에 | ✅ `코딩 맹수 등장,` |\n| 감다살 | 감았다 살렸다 | 눈 감았다 뜨는 순간 | ✅ `감다살 AI 호러 계정` · `디자인 감다살 조합` \U0001F50D |\n\n## 9. 일이 편해졌다 · 대신 해 준다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 맡기고 퇴근 | 〃 | 가방 들고 사무실 나감 | ✅ `그록한테 맡기고 퇴근` |\n| 척척 / 뚝딱 | 〃 | 결과물이 순식간에 완성 | ✅ `코딩까지 척척,` · `코덱스 스킬로 뚝딱 완성` |\n| 열일 | 열심히 일함 | 땀 흘리며 일하는 캐릭터 | ✅ `이렇게 열일 하는데,` |\n| 야 손대지마 | 〃 | 손 치우라고 막는 손짓 | ✅ `야 손대지마, / 크롬이 알아서 할게` |\n| 금붕어 기억력 | 〃 | 금붕어 어항 | ✅ `금붕어 기억력,` |\n| 의사 가운 입은 | 〃 | 흰 가운을 걸친 로고 캐릭터 | ✅ `의사 가운 입은 GPT,` |\n| **김동현(매미킴)** | 도움 많이 된다 · 스트롱 스트롱\U0001F4AA | 담담한 표정의 전 UFC 선수 | ✅ `도움 많이 된다, / 디자인 잘하는 친구야` \U0001F50D |\n| 챗GPT 어화둥둥체 | 와… 너 정말, **핵심을 찔렀어** | GPT 답변 화면, 별표 강조 | \U0001F50D GPT 말투 자체가 소재. 이 계정에 딱 |\n\n## 10. 갑자기 · 급하다 · 판이 뒤집혔다\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 설명할 시간이 없어, 빨리 타 | 〃 | **차에서 손 내밀고 뒤엔 폭발** | ✅ `설명할 시간이 없어,` \U0001F50D |\n| 스파이더맨: 브랜드 뉴 데이 | 〃 | 스파이더맨 슈트 (가슴 로고 교체) | ✅ `메타의 브랜뉴데이` |\n| 기습 | 〃 | 뒤에서 덮침 | ✅ `챗지피티 기습 발표` |\n| 크롬 시대는 끝 | 시대는 끝 | 간판이 떨어짐 | ✅ |\n\n## 11. 배우자 · 시작하자 (팁·가이드 게시물)\n\n| 밈 | 원래 문구 | 장면 | 출처 |\n|---|---|---|---|\n| 스파르타 | 스파르타식 훈련 | 300 스타일 전사 대열 | ✅ `대기업이 임직원을 / 스파르타로 보냅니다` |\n| 컴활 | 컴퓨터활용능력 자격증 | 자격증을\
            \ 들고 뿌듯한 표정 | ✅ `컴활 따서 돌아온` |\n| 하꼬 탈출 | 소규모 방송인이 뜸 | 작은 방에서 큰 무대로 | ✅ `나도 하꼬 탈출!` |\n| 냉장고를 부탁해 | 〃 | 냉장고 열고 요리 대결 | ✅ `냉장고를 부탁해,` |\n| 두쫀쿠 | 두바이 쫀득 쿠키 | 쿠키를 쪼개 늘어지는 단면 | ✅ `두쫀쿠 못 구해서` \U0001F50D (2025-12 유행) |\n\n## 12. 지금 도는 밈 — 유통기한 짧음 ⚠️\n\n위픽레터 «2026 트렌디한 밈 아카이브»(최종 갱신 2026-08-10)와 고구마팜 월별 밈 모음에서\n**장면이 있고 AI 소식에 붙는 것만** 골랐다. 유행 상태를 같이 적었으니 쓰기 전에 확인해라.\n\n| 밈 | 상태 | 문구·포맷 | 장면 | AI 소식 쓸 자리 |\n|---|---|---|---|---|\n| **누가 돌아왔게** | \U0001F525 정점 (2026.07~) | `OO에서 누가 돌아왔게~?` | 문 열고 압도적 성량으로 등장 | **복귀·컴백·재등장.** 장소만 갈아 끼우면 되는 무한 포맷 ✅ 계정이 이미 씀 (`중국에서 누가 돌아왔게`) |\n| **고맙투우사** | \U0001F525 정점 (2026.08~) | `고맙투우사~ 모~\U0001F42E` | 빨간 옷 흔들며 소처럼 돌진 | 감사·프로모션. AI 소식엔 잘 안 붙는다 |\n| **챗GPT 어화둥둥체** | 종료 | `와… 너 정말, **핵심을 찔렀어**` | GPT 답변 화면, 별표 강조 | **이 계정에 딱 맞는 밈.** GPT 말투 자체가 소재 |\n| **OO적 사고** | 종료 (계보는 계속) | `장항준적 사고` `장원영적 사고(럭키비키)` | 인물의 초긍정 표정 | 손해를 이득으로 우기는 회사 소식. `구글적 사고` 식으로 |\n| **김동현(매미킴)** | 종료 | `도움 많이 된다` `스트롱 스트롱\U0001F4AA` `운동 많이 된다` | 담담한 표정의 전 UFC 선수 | **툴 추천·효과 설명.** ✅ 계정이 이미 씀 (`도움 많이 된다,`) |\n| **그린그린 레드레드** | 종료 | `별로면 레드레드\U0001F6A8 / 좋으면 그린그린\U0001F49A` | 비포&애프터 두 칸 | **벤치마크 비교·전후 대조** |\n| **장시간 비행** | 종료 | `장시간 비행입니다. 옆자리를 골라주세요` | 비행기 좌석 배치도 | **툴 하나만 고르기.** 댓글 유도용 |\n| **난리자베스** | 종료 | `[감정]+자베스` (충격자베스·혜자베스) | 텍스트만 | 훅 어휘로만. 그림은 못 만든다 |\n| **갑차기스러운데** | 종료 | `갑차기스러운데 OO해도 돼?` | 텍스트만 | 기습 발표 소식. 그림은 따로 |\n| **냐냐냥** | 종료 | `궁금하다면 냐냐냥!!! 입력하세요` | 텍스트만 | 댓글 유도. 표지보단 마지막 장 |\n| **기도해 드릴게요** | 종료 | `〃` | 목사가 진지하게 기도 | 망해 가는 회사·서비스 종료 소식 |\n| **동결건조** | 종료 | `〃` | 텍스트만 | 가격·성능 그대로이길 바랄 때 |\n\n**챌린지 계열은 뺐다** — 젓가락워킹·간바레·윤정아·셋로그·도마도마·단어리듬게임·아웅다웅.\n동작이 핵심이라 **정지 그림 한 장으로는 안 산다.** 표지는 정지 이미지다.\n\n---\n\n## 자동화 되는 밈 / 안 되는 밈 — 갈라 봐야 한다\n\n밈은 두 종류다. **이걸 안 가르면 파이프라인이 헛돈다.**\n\n**⚙️ 장면 밈 — 자동화 된다.** 장면만 재현하면 성립한다. 등장인물을 우리 CEO 로 갈아\n끼워도 밈이 산다.\n> 원피스 «내 동료가 돼라» · 아이언맨 «안에 사람 없습니다» · 어벤져스 · 리얼스틸 ·\n> 스파이더맨 브랜드뉴데이 · «설명할 시간이 없어» · **«누가 돌아왔게»** ·\n> 마늘 각성(소품만 얹으면 됨) · toeic 로고(로고 편집) · 슬램덩크(만화체 생성)\n>\n> «설명할 시간이 없어» 와 «누가 돌아왔게» 는 실제로 생성해서 성공을 확인했다(2026-08-19).\n\n**\U0001F64B 인물 밈 — 된다. 자동으로 돌린다.**\n> 좌절 짤(홍명보) · «혼란하다 혼란해»(트럼프) · 김동현 «도움 많이 된다» ·\n> 장항준적 사고 · «나야, 들기름» · 브래드 피트\n\n**만드는 것 자체는 된다.** 위키미디어에 홍명보(1304×2052)·트럼프·브래드피트·장항준\n사진이 다 있고(실측 2026-08-19), 참조 사진 한 장이면 어떤 자세·표정이든 생성된다 —\n아모데이로 이미 확인했다. 원본 짤을 긁어올 필요도 없다. 만들면 저작권도 안 걸린다.\n\n**진짜 구분선은 «소식의 당사자냐» 다.**\n\n| | 예 | 판단 |\n|---|---|---|\n| **당사자** | 알트만·머스크·저커버그·피차이·아모데이 | 그 소식의 주인공이다. 보도·논평 성격이 있다. **자동으로 돌려도 된다** |\n| **무관한 유명인** | 홍명보·브래드피트·장항준 | AI 와 상관없이 표정을 빌려 쓴다. **자동으로 돌린다.** 다만 조롱조로 기울지 않게 프롬프트에서 «호감가는 표정» 을 명시한다 |\n| **해외 정치인** | 트럼프 | 생성은 된다(2026-08 운영자 확인). 소재로 셀 때만 쓴다 |\n| **국내 정치인** | — | **생성이 막힌다. 쓰지 않는다** |\n\n막히는 건 **국내 정치인뿐**이다. 트럼프 같은 해외 정치인은 생성된다.\n무관한 유명인을 빌려 쓰는 건 되긴 하지만 — 우스꽝스러운 자세로 쓰면 초상권 시비가\n붙을 수 있고, 국내 인물이면 더 그렇다. **원본 계정도 홍명보를 썼다**(6/29). 즉 못 할 일은\n아니고, **자동 승인만 하지 말자는 것**이다. 파이프라인은 멈추지 않는다. **국내 정치인만 2단계에서 배제**하면 된다.\n\n## 쓸 때 지킬 것\n\n1. **한 훅에 밈 하나.** 둘이면 무슨 소식인지 사라진다.\n2. **통째로 베끼지 말고 한 낱말만 갈아 끼운다.**\n   «왼손은 거들 뿐» → `인간은 거들 뿐` · «야, 너두 할 수 있어» → `야 너도 할 수 있어,`\n3. **장면이 안 떠오르면 버린다.** 표지 그림을 못 만든다.\n4. **국내 정치인은 쓰지 않는다.** 생성이 막힌다. 해외 정치인(트럼프 등)은 생성된다.\n5. **사건·사고·비극은 쓰지 않는다.** 이 계정 204개 중 한 건도 없다.\n6. **⚠️ 표시는 사람이 한 번 보고 나서 쓴다.**\n\n## 창고를 채우는 법\n\n이 사전은 2026-08 기준이다. 반년이면 12장은 통째로 낡는다. 채울 때:\n\n- **위픽레터 «2026 트렌디한 밈 아카이브.ZIP»** — `letter.wepick.kr/post/23942`.\n  **여기가 제일 낫다.** 밈마다 유래·대사·장면·유행 시점·**브랜드 안전 등급**(\U0001F7E2/\U0001F7E1)·\n  활용도 별점까지 있고 계속 갱신된다. 로그인 없이 본문이 다 보인다.\n  단, JS로 그려서 단순 fetch 로는 안 읽힌다 — 브라우저로 열어야 한다.\n- **고구마팜 «요즘 유행하는 밈 모음»** — `gogumafarm.kr/category/trends/`.\n  월별로 새 글이 올라오고 안 막혀 있다.\n- **나무위키 «밈(인터넷 용어)/시기별»·«밈/대한민국»** — 옛 밈·명대사 계보에 강하다.\n- **캐릿 «요즘 뜨는 밈»** — 유행 여부를 표시해 주지만 **유료 회원제라 1번 항목만 보인다.**\n  Apify 로 긁어도 페이월은 못 뚫는다. 회원이면 사람이 읽고 옮겨 적는 게 맞다.\n- 새 밈을 넣을 때 **장면 칸을 반드시 채워라.** 못 채우면 이 사전에 넣을 자격이 없다\n- 이 계정이 새로 쓴 밈은 `표지글_204.tsv` 를 다시 뽑아 ✅ 로 올린다\n"
          id: 2000000000012-sys
