          text: "그 주 소식 목록:\n{{#2000000000003.news#}}\n\n위 소식으로 뉴스 꼭지를 **한 번에 다** 써라.\n\n**순서를 지켜라 — JSON을 먼저, 점검은 그 뒤에.** 답 길이가 넉넉하지 않다. 초안·자수 계산·글자 하나씩 세기를 먼저 길게 늘어놓다가 JSON을 쓸 자리가 없어져 답이 끊긴 적이 있다(실측 2026-08-23) — JSON이 하나도 안 남아 통째로 못 썼다. **그러니 JSON부터 완성해서 내놓고, §9 자기 점검은 JSON 뒤에 짧게(항목당 한 줄, 글자를 하나씩 세지 말고 어림으로) 붙여라.** 점검에서 걸리는 게 있으면 JSON을 다시 고쳐 쓰지 말고 그냥 적어만 둬라 — 검사 노드가 따로 다시 세서 필요하면 재작성을 시킨다.\n\n---\n**내놓기 전에 이 셋을 반드시 확인해라. 여기서 제일 자주 틀린다.**\n\n1. **꼭지는 정확히 {{#2000000000003.count#}}개다.** 위 목록의 «[브랜드]» 하나가 꼭지 하나다. **한 브랜드를 둘로 쪼개지 마라** — 소식이 여러 개로 보여도 한 꼭지로 묶어 쓴다. 더 만들지도, 빼지도 않는다.\n2. **본문 세 줄은 각각 32~36자를 노려라.** 한 줄씩 세어 봐라.\n   **39자를 넘으면 카드 밖으로 잘려 나가서 그 장을 통째로 못 쓴다.**\n   그래서 34자쯤을 겨냥한다 — 조금 넘겨도 안전하도록. 36자를 넘겼으면 내용을 줄여서라도 맞춘다. 넘치는 것보다 덜 담는 편이 낫다.\n3. **띄어쓰기가 적거나 긴 외래어가 둘 이상이면 32자 안쪽으로 줄여라.** 글자 수가 같아도 빽빽하면 폭이 넘친다.\n\n**세 줄을 다 쓰고 나서 한 줄씩 글자를 세어 보고, 36자가 넘는 줄은 그 자리에서 줄여라.** 여기서 걸리면 판 전체가 안 나온다."
