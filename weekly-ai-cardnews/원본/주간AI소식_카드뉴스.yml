        code: "# Dify 코드 노드 「훅 검증」   ← LLM 「표지 훅」 뒤에 붙는다\n#\n# **이 노드가 하는 일: 「스킬대로 썼나」를 기계가 다시 세어 본다.**\n#\n# LLM 에게 스킬(`docs/표지글_쓰기.md`)을 통째로 주고 §5 자기 점검까지 시켰지만,\n# 자기가 자기를 점검했다는 말은 믿을 수 없다. 아래 검사는 전부 그 스킬의\n# §3「하지 말 것」과 §5「자기 점검」에서 옮겨 온 것이다 — 새로 지어낸 규칙은 없다.\n#\n# 입력 변수:\n#     text    String   ← 표지 훅 / text        (처음 쓴 것)\n#     고친것   String   ← 훅 다시 쓰기 / text   (안 돌았으면 빈 글자)\n#\n# **왜 둘을 받나.** 본문 검증과 같은 이유다 — 이 노드로 오는 길이 둘이라\n# 한 쪽만 읽으면 안 돈 노드의 결과를 읽으려다 죽는다.\n#     week   String   ← 시작 / week        (\"8월 2주차\")\n#     memes  String   ← 시작 / memes       밈 이름 목록 (쉼표로 이음. 서버가 준다)\n#\n# 출력 변수:\n#     cover   Object  표지 한 장 — headline·accent_text·meme·gen_prompt_en\n#     막힘     String  **되돌려야 하는 잘못.** 비어 있으면 통과\n#     점수표    String  사람이 보는 몫\n#     ok      String  \"1\" 이면 통과 (글자다 — 갈래가 글자끼리만 비교한다)\n#\n# 본문 검증과 같은 규칙으로 가른다 — **답이 하나인 것만 되돌린다.**\n#\n# 기준값은 전부 `docs/표지글_쓰기.md` · `docs/규칙표.md` 에서 왔다.\n# 주차별 소식 19편 실측이다.\n\nimport json\nimport re\n\n일행자수 = (6, 12)        # 19편 분포: 6자 1 · 7자 1 · 8자 3 · 9자 7 · 10자 4 · 11자 2 · 12자 1\n순한글안전 = 10           # 잘림 한계는 11자. 한 자 여유를 둔다\n\n맹물 = (\"놀라운\", \"혁신적인\", \"충격\", \"대박\", \"역대급\", \"미친\", \"엄청난\")\n\"\"\"§3「하지 말 것」 19편 중 0건. 이런 수식어를 쓰면 훅이 죽는다.\"\"\"\n\n두줄합 = 30              # §3「두 줄 합쳐 30자 넘기기」\n\n브랜드들 = (\"ChatGPT\", \"챗GPT\", \"Claude\", \"클로드\", \"Gemini\", \"제미나이\",\n           \"NVIDIA\", \"엔비디아\",\n            \"Grok\", \"그록\", \"Cursor\", \"커서\", \"Perplexity\", \"퍼플렉시티\",\n            \"Meta\", \"메타\", \"OpenAI\", \"오픈AI\", \"Anthropic\", \"앤트로픽\", \"구글\")\n\n\ndef _벗기기(글):\n    글 = (글 or \"\").strip()\n    글 = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", 글, flags=re.M).strip()\n    처음, 끝 = 글.find(\"{\"), 글.rfind(\"}\")\n    return 글[처음:끝 + 1] if 처음 >= 0 and 끝 > 처음 else 글\n\n\ndef _갈래(일: str, 밈이름: str, 쓴브랜드: list) -> str:\n    \"\"\"§2 1행의 갈래는 넷뿐이다. §5-3 「못 대면 다시 쓴다」 — 어디인지 알려준다.\"\"\"\n    if 밈이름:\n        return \"④ 밈 인용 (11%)\"\n    if 쓴브랜드:\n        return \"② 한 회사를 콕 집어 (21%)\"\n    if re.search(r\"(나요|까요|세요|해요\\?|\\?)$\", 일.strip()) or \"당신\" in 일:\n        return \"③ 독자에게 말 걸기 (16%)\"\n    return \"① 판 전체의 상태 (53%, 기본값)\"\n\n\n장면표 = {}\n\n# ── 걸음 5 「프롬프트 쓰는 법」을 기계가 다시 본다 ──────────────────────\n#\n# 2026-08-20 까지 이 노드는 **프롬프트를 거의 안 봤다** — 있는지만 봤다.\n# 스킬의 걸음 5 규칙 다섯이 전부 «글로만» 있었고, 그래서 반쯤만 지켜졌다.\n\n부정문 = re.compile(\n    r\"\\bno\\s+(?:text|letter|word|logo|visible|other|extra|clutter|on-?screen|\"\n    r\"readable|signage|watermark|brand|ui|icon|people|person|face)\"\n    r\"|\\bwithout\\s+any\\b|\\bavoid\\b|\\bfree of\\b\", re.I)\n\"\"\"§걸음5「부정문으로 쓰지 마라」.\n\n**«no time to explain» 같은 밈 문구는 안 잡는다** — `no` 뒤에 오는 낱말을 좁혀서\n«지시로서의 부정문» 만 고른다. 밈 인용까지 막으면 거짓 경보가 된다.\"\"\"\n\n화풍말 = (\"photograph\", \"photorealistic\", \"photo-realistic\", \"film still\", \"cinematic\",\n          \"3d render\", \"3-d render\", \"anime\", \"flat vector\", \"cutout\", \"collage\",\n          \"comic\", \"documentary\", \"illustration\", \"oil painting\", \"studio portrait\")\n\n초점말 = (\"a single\", \"one hero\", \"one person\", \"one object\", \"one character\",\n          \"single subject\", \"one figure\", \"a lone\", \"two \", \"a pair\")\n\n색말 = (\"blue\", \"red\", \"pink\", \"cream\", \"orange\", \"green\", \"purple\", \"yellow\",\n        \"crimson\", \"navy\", \"teal\", \"black\", \"white\", \"gold\", \"grey\", \"gray\",\n        \"beige\", \"violet\", \"amber\", \"mint\")\n\n카메라말 = (\"mm\", \"f/\", \"iso\", \"depth of field\", \"bokeh\", \"grain\", \"kelvin\", \"k,\")\n\n얼굴있는브랜드 = {\n    \"OpenAI\", \"ChatGPT\", \"Codex\", \"Anthropic\", \"Claude\",\n    \"Google\", \"Gemini\", \"xAI\", \"Grok\", \"Meta\", \"Meta AI\",\n    \"NVIDIA\", \"Nvidia\", \"엔비디아\",\n}\n\"\"\"**이 브랜드들은 위키미디어에 CEO 사진이 있다** (`procure/faces.py` 의 FACE_OF).\n\n표지 굽기가 사진을 받아 밈 인물 자리에 **얼굴을 갈아끼운다**. 그러니 이 브랜드를\n골랐으면 `gen_prompt_en` 에 **갈아끼울 사람이 하나 서 있어야** 한다.\nCursor·Perplexity 처럼 얼굴이 없는 브랜드는 로고 전략으로 가면 된다.\n\"\"\"\n\n사람표지 = re.compile(\n    r\"\\b(?:man|woman|person|people|founder|executive|ceo|engineer|researcher\"\n    r\"|developer|scientist|human|guy|leader|speaker|presenter|entrepreneur)\\b\", re.I)\n\"\"\"프롬프트가 «사람» 을 세웠는지 본다.\n\n**`figure`·`character` 를 뺐다.** 「a single figure」·「mascot character」 처럼\n사람이 아닌데도 걸려서 통과시켰다 (실측 2026-08-21). 사람을 가리키는 게\n분명한 낱말만 남긴다.\"\"\"\n\n_사람낱말 = (r\"(?:man|woman|person|people|founder|executive|ceo|engineer|researcher\"\n          r\"|developer|scientist|human|guy|leader|speaker|presenter|entrepreneur)\")\n_인형낱말 = (r\"(?:mascot|creature|blob|figurine|toy|robot|android|plush|doll|puppet\"\n          r\"|beast|animal|claymation|clay|3d|cartoon)\")\n비인간 = re.compile(\n    r\"\\b\" + _인형낱말 + r\"(?:[\\s-]+(?:like|style|shaped))?[\\s-]+\" + _사람낱말 + r\"\\b\"\n    r\"|\\b\" + _사람낱말 + r\"[\\s-]+(?:like|shaped)[\\s-]+\" + _인형낱말 + r\"\\b\"\n    r\"|\\b\" + _인형낱말 + r\"[\\s-]+(?:figure|character|version|model|avatar)s?[\\s-]+of[\\s-]+\"\n    r\"(?:(?:a|an|the)[\\s-]+)?\" + _사람낱말 + r\"\\b\", re.I)\n\"\"\"**사람 낱말을 «직접 꾸밀 때만» 사람이 아니다.**\n\n「a single clay man」·「a mascot person」·「human-like robot」·「clay figure of a man」\n처럼 사람 낱말을 꾸미면 인형이다. 그러면 서버가 CEO 사진을 붙이고 «얼굴을\n갈아끼워라» 명령하는데 그림은 인형이라, **모델이 인형 얼굴을 지워 민둥민둥한\n머리**를 내놓는다.\n\n**떨어져 있으면 사람이 맞다** — 「A single man, Sam Altman, … Behind him, mascot-like\nAI characters」. 예전엔 프롬프트 어디에든 mascot 이 있으면 막아서, 사람을 세운\n판을 세 번 연달아 거짓으로 막았다 (2026-09-30, 딥시크 판).\"\"\"\n\n\n등돌림 = re.compile(\n    r\"\\bfrom behind\\b|\\bback view\\b|\\brear view\\b|\\bseen from the back\\b\"\n    r\"|\\bfacing away\\b|\\bback (?:is )?turned\\b|\\bsilhouett|\\bfaceless\\b\"\n    r\"|\\bhis back\\b|\\bher back\\b|\\btheir back\\b\", re.I)\n\"\"\"**얼굴이 안 보이면 얼굴 합성이 통째로 헛일이다.**\n\n2026-08-20 실측: 서버는 «얼굴: Sam Altman» 이라고 보고했는데 나온 그림은\n**뒷모습 익명 남자**였다. 얼굴을 넣을 자리가 없으니 합성이 아무 일도 안 한 것이다.\n**그런데 «성공» 으로 떴다.** 사용자가 「실루엣으로 피하지 마라」고 못 박은 자리인데\n글로만 적혀 있어서 지켜지지 않았다.\"\"\"\n\n글자그리기 = re.compile(\n    r\"\\b(?:sign|banner|screen|poster|label|badge|card|display)\\s+(?:that\\s+)?\"\n    r\"(?:reads|reading|saying|says|showing the text)\\b\"\n    r\"|\\bthe words?\\s+[\\\"'“‘]\"\n    r\"|\\btext\\s+(?:reading|that reads|saying)\\b\"\n    r\"|\\b(?:exit|neon|led)\\s+sign\\b\", re.I)\n\"\"\"**그림 속 글자는 뭉개져 나온다.** 글은 카드가 이미 얹는다.\n\n실측 2026-08-20 표지에 «EXIT» 간판과 «Grok» 딱지가 그려져 나왔다.\"\"\"\n\n얼굴보임 = (\"looking at the camera\", \"facing the camera\", \"facing camera\",\n            \"face visible\", \"front view\", \"three-quarter view\", \"eye contact\",\n            \"portrait of\", \"close-up of his face\", \"close-up of her face\",\n            \"looking straight\")\n\"\"\"얼굴 합성을 쓰려면 얼굴이 카메라 쪽을 봐야 한다.\"\"\"\n\n\ndef _낱말(글):\n    \"\"\"한글 낱말의 **앞 두 글자**. 「장면」과 「밈쓰임」을 대볼 때 쓴다.\n\n    **조사를 떼야 한다.** 통째로 대봤더니 «마늘이» 와 «마늘과» 가 안 겹치고\n    «떠다님» 과 «떠다니는» 이 안 겹쳤다. 밈을 제대로 썼는데 «안 맞는다» 고\n    막았다(실측 2026-08-20) — 그러면 LLM 은 고칠 수가 없다. 이미 맞게 썼으니까.\n\n    한국어 조사·어미는 뒤에 붙으므로 **앞 두 글자**만 보면 대부분 붙는다.\n    두 글자로 자르면 엉뚱하게 겹칠 수도 있지만, 문턱이 «둘 이상» 이라 견딘다.\n    \"\"\"\n    흔한 = {\"장면\", \"사람\", \"그림\", \"표정\", \"모습\", \"하는\", \"있는\", \"되는\", \"이는\"}\n    것들 = [w for w in re.findall(r\"[가-힣]{2,}\", 글 or \"\") if w not in 흔한]\n    return {w[:2] for w in 것들}\n\n\ndef _프롬프트검사(p: str, 브랜드: str = \"\") -> list:\n    \"\"\"**되돌릴 것.** 답이 하나인 규칙만 여기 둔다.\"\"\"\n    탈 = []\n    찾은 = 부정문.findall(p)\n    if 찾은 or 부정문.search(p):\n        m = 부정문.search(p)\n        탈.append(f\"프롬프트에 부정문이 있다 («{p[m.start():m.start()+40].strip()}…») — \"\n                  f\"걸음5: 「없다」가 아니라 「어떻게 생겼다」로 써라\")\n    if not any(w in p.lower() for w in 화풍말):\n        탈.append(\"화풍을 안 박았다 — 걸음5①: photograph / cinematic film still / \"\n                  \"3D render / anime / flat vector / cutout 중 하나를 첫머리에 못 박아라\")\n    if not any(w in p.lower() for w in 초점말):\n        탈.append(\"주인공이 하나로 안 읽힌다 — 걸음5②: «a single …» 처럼 초점 하나를 \"\n                  \"명시해라 (여럿이면 한 무리로 뭉쳐 있다고 써라)\")\n    m = 등돌림.search(p)\n    if m:\n        탈.append(f\"프롬프트가 인물을 등지게 세웠다 («{p[m.start():m.start()+34].strip()}…») — \"\n                  f\"「실루엣으로 피하지 마라」. 얼굴이 안 보이면 얼굴 합성이 헛일이 된다\")\n    m = 글자그리기.search(p)\n    if m:\n        탈.append(f\"프롬프트가 그림 속에 글자를 그리라고 한다 \"\n                  f\"(«{p[m.start():m.start()+34].strip()}…») — \"\n                  f\"그림 글자는 뭉개진다. 글은 카드가 얹는다\")\n    if not re.search(r\"bottom[^.]{0,80}(?:40|45)\\s*percent\", p, re.I):\n        탈.append(\"아래 띠 지시가 없다 — 걸음5⑥: «The bottom 45 percent is one calm \"\n                  \"unbroken field …» 를 넣어라. 없으면 헤드라인이 안 읽힌다\")\n    사람인가 = bool(사람표지.search(p)) and not 비인간.search(p)\n    if 브랜드 and 브랜드.strip() in 얼굴있는브랜드 and not 사람인가:\n        탈.append(f\"«{브랜드.strip()}» 은 얼굴이 있는 브랜드인데 그림에 사람이 없다 — \"\n                  f\"서버가 위키미디어에서 그 회사 대표 사진을 받아 «얼굴을 갈아끼우는» \"\n                  f\"방식이라, 마스코트·사물만 그리면 그 사진이 통째로 헛돈다. \"\n                  f\"`a single man/woman/founder …` 처럼 사람 하나를 세워라 \"\n                  f\"(얼굴 없이 가려면 brand 를 Cursor·Perplexity 같은 쪽으로 두거나 \"\n                  f\"로고를 크게 넣는 마스코트로 가라)\")\n    return 탈\n\n\ndef _프롬프트점수(p: str) -> list:\n    \"\"\"**보여줄 것.** 있으면 좋지만 없다고 되돌릴 만큼은 아닌 것.\"\"\"\n    쓴색 = [w for w in 색말 if w in p.lower()]\n    사진인가 = any(w in p.lower() for w in (\"photograph\", \"photorealistic\", \"film still\",\n                                            \"cinematic\", \"documentary\"))\n    카메라 = [w for w in 카메라말 if w in p.lower()]\n    return [\n        f\"프롬프트 {len(p)}자\",\n        f\"바탕색 이름: {쓴색 or '없음'}\"\n        + (\"  ⚠️ 색을 이름으로 적어라 (걸음5⑤)\" if not 쓴색 else\n           \"  ⚠️ 청록은 글자색이다\" if 쓴색 == [\"teal\"] else \"  ✅\"),\n        f\"카메라 용어: {카메라 or '없음'}\"\n        + (\"  ⚠️ 사진 갈래인데 렌즈·조명이 없다\" if 사진인가 and not 카메라 else \"  ✅\"),\n    ]\n\n\n# -*- coding: utf-8 -*-\n\"\"\"글꼴 없이 글자 폭을 잰다 — Dify 코드 노드에 박아 넣는 조각.\n\n**왜 있나.** Dify 코드 노드에는 글꼴이 없다. 그래서 대본 검증이 «글자 수» 만 세고\n진짜 상한선인 «픽셀 폭» 은 못 봤다. 자수는 통과했는데 폭에서 넘치는 대본이 그대로\n굽기까지 가서 **8장 중 6장이 죽었다** (실측 2026-08-20).\n\n**어떻게 재나.** 서버(`template_render._measure_tracked`)는 글자마다 폭을 재서\n더하고 자간을 글자 사이마다 넣는다. 그 셈을 그대로 옮겼다. 한글은 폭이 하나로\n고정이라(Pretendard 실측) 표가 작다.\n\n**표는 `render-server/폭표.py` 가 만든다.** 자리표의 글자 크기를 바꾸면\n**표를 다시 구워야 한다** — 안 그러면