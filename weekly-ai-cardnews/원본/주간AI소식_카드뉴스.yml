tedSans-Medium.otf\"\\n  },\\n  \"headline_default\": \"Pretendard-Bold\",\\n  \"body_default\": \"Pretendard-Medium\",\\n  \"_decision_note\": \"82px 8줄 대조 NCC: Pretendard-Bold 0.9781 vs WantedSans-Bold 0.9774 — 잡음 수준 차이라 확정 못함. verify.py가 17장 전체로 두 글꼴을 각각 구워 점수 높은 쪽을 고른다. 기본값은 이미 설치돼 있는 Pretendard.\"\\n },\\n \"brand_logos\": {\\n  \"_status\": \"미확보\",\\n  \"_note\": \"2026-08-19 확정 명단 일곱. 그전 목록(Codex·Nvidia·GoogleDeepMind 등)은 복제판 한 건에서 나온 것이라 지웠다\",\\n  \"needed\": [\\n   \"ChatGPT\",\\n   \"Claude\",\\n   \"Gemini\",\\n   \"Grok\",\\n   \"Cursor\",\\n   \"Perplexity\",\\n   \"Meta AI\"\\n  ],\\n  \"_쓰는곳\": \"표지 전략 B 뿐. 뉴스 장 브랜드 칩에는 아이콘이 없다\"\\n }\\n}\\n')\n# **빌드하면 위에 «폭재기 + 폭표들 + 재는틀» 이 박힌다.** (make_dsl_v3.본문검증_코드)\n# 여기서는 그게 없을 때만 파일에서 읽어 온다 — 시험·CI 가 이 파일을 그냥 돌리기 때문이다.\n# **두 길이 같은 값을 봐야 한다.** 달라지면 «검증은 통과인데 굽기에서 죽는» 상태로\n# 되돌아간다. `render-server/폭표대조.py` 가 표와 글꼴이 같은지 매번 본다.\nif \"넘치는_줄\" not in dir():\n    import sys as _sys\n    from pathlib import Path as _P\n    _뿌리 = _P(__file__).resolve().parent\n    _sys.path.insert(0, str(_뿌리))\n    from 폭재기 import 넘치는_줄                                    # noqa: F401\n    폭표들 = json.loads((_뿌리.parent / \"render-server\" / \"폭표.json\")\n                       .read_text(encoding=\"utf-8\"))\n    재는틀 = json.loads((_뿌리.parent / \"render-server\" / \"template.json\")\n                       .read_text(encoding=\"utf-8\"))\n\n\ndef main(text: str, 소식수: int = 0, 소식글: str = \"\", 고친것: str = \"\", 고친것2: str = \"\") -> dict:\n    # **늦게 고친 것부터 본다.** 검증 3 은 «1차 수정본» 과 «2차 수정본» 을 다 받는다.\n    # 2차가 안 돌았으면(1차에서 이미 깨끗해졌으면) 그 칸이 비는데, 그때 원본으로\n    # 돌아가면 **이미 고친 막힘을 다시 내놓는다** — 실제로 그래서 판이 통째로\n    # 거부당했다(2026-08-20). 빈 칸은 «안 돌았다» 지 «내용이 없다» 가 아니다.\n    글 = next((x for x in (고친것2, 고친것, text) if (x or \"\").strip()), text)\n    꼭지, 파싱탈 = _꼭지뽑기(글)\n    n = len(꼭지)\n    막힘, 남은영문, 지어낸숫자, 긴줄 = [], [], [], []\n    if 파싱탈:\n        막힘.append(파싱탈)\n    말맛 = 전언 = 쉼표 = 죠 = 과거 = 0\n    전언목록 = []   # §9-11 되돌릴 때 «어느 꼭지» 인지 이름으로 대주려고 (2026-08-23)\n\n    # ── 편 전체 ①: §9-9 「소식 수만큼 꼭지를 냈는가」 ─────────────\n    if 소식수 and n != int(소식수):\n        막힘.append(f\"소식이 {int(소식수)}건인데 꼭지가 {n}개다 — \"\n                    f\"§9-9: 지어내지도 버리지도 마라\")\n\n    for i, k in enumerate(꼭지, 1):\n        이름 = k.get(\"brand\") or f\"{i}번\"\n        h = k.get(\"headline\") or []\n        b = k.get(\"body\") or []\n\n        # **폭을 먼저 잰다.** 자수보다 폭이 진짜 상한선이라, 폭이 넘친 줄에는\n        # 자수 이야기를 안 한다 — 한 줄에 서로 다른 숫자 둘을 주면 LLM 이 못 고친다.\n        넘침 = 넘치는_줄({\"type\": \"뉴스\", \"headline\": h, \"body\": b}, 재는틀, 폭표들)\n        넘친자리 = {x[\"자리\"] for x in 넘침 if not x.get(\"탈\")}\n\n        # ── ① 되돌릴 것 — 스킬이 못 박은 것 ──────────────────\n        if len(h) != 2:\n            막힘.append(f\"{이름}: 헤드라인이 {len(h)}줄이다 (2줄이어야 한다) §9-1\")\n        if len(b) != 3:\n            막힘.append(f\"{이름}: 본문이 {len(b)}줄이다 (3줄이어야 한다) §9-1\")\n        for j, 줄 in enumerate(b):\n            if f\"본문 {j + 1}행\" in 넘친자리:\n                continue                      # 폭 쪽이 «몇 자 줄여라» 를 이미 말한다\n            # **자수 «상한» 으로는 반려하지 않는다 (2026-08-21).**\n            #\n            # 자수는 폭의 어림이었다. 이제 폭을 직접 재니 어림이 필요 없고, 실제로\n            # 어긋난다 — 39자짜리가 953px 로 멀쩡히 들어가는데 «38자여야 한다» 며\n            # 막았다. **들어가는 줄을 막으면 검증이 아니라 훼방이다.**\n            #\n            # 하한은 그대로 막는다. «너무 짧다» 는 폭으로 못 잡는 디자인 규칙이다 —\n            # 29자 미만이면 줄이 비어 보인다(§2).\n            if len(줄) < 본문자수[0]:\n                긴줄.append(f\"{이름} 본문 {j+1}행 {len(줄)}자(짧음)\")\n            elif len(줄) > 본문자수[1]:\n                긴줄.append(f\"{이름} 본문 {j+1}행 {len(줄)}자(김)\")\n        for j, (줄, 범위) in enumerate(zip(h, (제목1자수, 제목2자수))):\n            if f\"헤드라인 {j + 1}행\" in 넘친자리:\n                continue\n            # 헤드라인도 자수로는 반려하지 않는다. 잘리는지는 폭이 이미 봤다.\n            if not (범위[0] <= len(줄) <= 범위[1]):\n                긴줄.append(f\"{이름} 헤드라인 {j+1}행 {len(줄)}자\"\n                          f\"(겨냥 {범위[0]}~{범위[1]})\")\n\n        # ── ★ 폭 — 위에서 이미 쟀다. 그 결과를 여기서 말한다 ──────\n        #\n        # **이 검사가 없어서 8장 중 6장이 죽었다 (실측 2026-08-20).** 자수(30~42)는\n        # 다 통과했는데 굽는 자리에서 «글이 카드 밖으로 나간다» 로 전멸했다.\n        # 같은 42자라도 «메타가 자연어 한 줄로…» 는 넘치고 «오픈AI가 …» 는 안 넘친다 —\n        # 한글은 폭이 같지만 영문·숫자·부호는 좁아서, 자수만으로는 알 수가 없다.\n        #\n        # 여기서 잡으면 재수정 LLM 이 한 번에 고친다. 못 잡으면 그 장이 통째로 죽는다.\n        for x in 넘침:\n            if x.get(\"탈\"):\n                막힘.append(f\"{이름}: {x['탈']}\")\n                continue\n            # **딱 맞게 말하면 모자라게 깎는다.** 「2자 줄여라」라고 했더니 64px 를\n            # 남기고 다시 왔다(실측 2026-08-20). 한글 한 칸이 31px 이라 딱 떨어지는\n            # 계산인데도 그렇다 — 낱말을 바꾸면서 길이가 들쭉날쭉해지기 때문이다.\n            # **한 자를 더 얹어 말한다.** 조금 짧은 줄은 괜찮지만 넘친 줄은 못 쓴다.\n            한칸 = 폭표들[\"Pretendard-Medium|36\"][\"한글\"] or 31\n            넘은자수 = max(1, round(x[\"넘침\"] / 한칸)) + 1\n            막힘.append(\n                f\"{이름} {x['자리']}이 카드 밖으로 {x['넘침']:.0f}px 나간다 — \"\n                f\"한글 {넘은자수}자 줄여라 (덜 줄이면 또 넘친다. 자수는 맞아도 \"\n                f\"폭이 넘칠 수 있다): «{x['글']}»\")\n\n        # ── §9-8-1 「gen_prompt_en 을 꼭지마다 다 썼는가」 ──────\n        #\n        # **이게 비면 그 장이 통째로 죽는다.** 그 브랜드가 그 주에 미디어를 하나도\n        # 안 올렸을 때 서버가 이 값으로 그림을 만드는데, 없으면\n        # `ValueError: 3번 장에 만들 내용(gen_prompt)이 없다` 로 멈춘다.\n        # 어느 브랜드가 그럴지는 대본을 쓸 때 알 수 없으니 **전부** 있어야 한다.\n        지시 = (k.get(\"gen_prompt_en\") or \"\").strip()\n        if not 지시:\n            막힘.append(f\"{이름}: gen_prompt_en 이 비었다 — §7-1: 꼭지마다 다 쓴다. \"\n                       f\"미디어 없는 브랜드는 이게 없으면 그 장이 죽는다\")\n        else:\n            if not re.search(r\"[A-Za-z]\", 지시):\n                막힘.append(f\"{이름}: gen_prompt_en 에 영문이 없다 — §7-1: 영어로 쓴다\")\n            if re.search(r\"[가-힣]\", 지시):\n                막힘.append(f\"{이름}: gen_prompt_en 에 한글이 섞였다 — §7-1: «{지시[:40]}»\")\n            if len(지시) < 25:\n                막힘.append(f\"{이름}: gen_prompt_en 이 {len(지시)}자뿐이다 — \"\n                           f\"§7-1: «장면» 이어야 한다: «{지시}»\")\n            # 「글자를 그리라」 는 지시. 그림 속 글자는 뭉개진다\n            if re.search(r\"\\b(text|caption|title|word|label|logo|typography)\\b\", 지시, re.I):\n             \
          \   막힘.append(f\"{이름}: gen_prompt_en 이 글자를 그리라고 한다 — \"\n                           f\"§7-1: 글은 카드가 얹는다: «{지시[:50]}»\")\n            # 부정문. 「~가 없는」 이라고 쓰면 오히려 그게 나온다\n            if re.search(r\"\\b(no|not|without|avoid|never|don't)\\b\", 지시, re.I):\n                막힘.append(f\"{이름}: gen_prompt_en 이 부정문이다 — \"\n                           f\"§7-1: 긍정문으로 쓴다: «{지시[:50]}»\")\n\n        # §9-4 · §8 「1행과 2행을 같은 어미로 닫기」\n        if len(b) >= 2:\n            ㄱ, ㄴ = _어미(b[0]), _어미(b[1])\n            if ㄱ == ㄴ != \"?\":\n                막힘.append(f\"{이름} 본문 1·2행이 둘 다 «{ㄱ}» 로 끝난다 — \"\n                           f\"§9-4: 어미가 서로 달라야 한다\")\n\n        본문글 = \" \".join(b)\n        # §9-5 · §8 「느낌표를 한 꼭지에 두 번 이상」\n        느낌 = 본문글.count(\"!\")\n        if 느낌 > 1:\n            막힘.append(f\"{이름} 본문에 느낌표가 {느낌}개다 — §9-5: 한 개 이하\")\n        elif 느낌 == 1 and len(b) == 3 and \"!\" not in b[2]:\n            막힘.append(f\"{이름} 느낌표가 3행이 아닌 곳에 있다 — §9-5\")\n        # §8 「본문에 물음표 (1% 뿐이다)」\n        if \"?\" in 본문글:\n            막힘.append(f\"{이름} 본문에 물음표가 있다 — §8\")\n        # §8 「이모지 (본문에 한 건도 없다)」\n        붙은것 = _이모지(본문글 + \" \".join(h))\n        if 붙은것:\n            막힘.append(f\"{이름} 에 이모지가 있다 ({''.join(붙은것)}) — §8\")\n        # §8 「본문에 합니다체·반말·~네요 섞기」\n        섞인것 = [w for w in 높임말아닌것 if w in 본문글] + ([\"~네요\"] if \"네요\" in 본문글 else [])\n        if 섞인것:\n            막힘.append(f\"{이름} 본문에 {' · '.join(섞인것)} 가 섞였다 — §8: 해요체로만\")\n        # §7 · §9-13 「영문은 한글로 옮긴다 — 약어와 모델명만 남긴다」\n        이꼭지영문 = []\n        for 줄 in h + b:\n            이꼭지영문.extend(_영문(줄))\n        if 이꼭지영문:\n            막힘.append(f\"{이름} 에 옮기지 않은 영문 {sorted(set(이꼭지영문))} — \"\n                       f\"§7: 약어·모델명만 남기고 한글로 («Ultrafast» → «울트라패스트»)\")\n        남은영문.extend(이꼭지영문)\n\n        # ── ② 보여줄 것 — 답이 하나가 아니다 ─────────────────\n        if len(b) == 3 and re.search(r\"(대요|래요|한다고 해요)[.!]?$\", b[2]):\n            전언 += 1\n            전언목록.append(이름)\n        if len(b) >= 2 and _어미(b[1]) == \"죠\":\n            죠 += 1\n        if b and re.search(r\"(했|였|었|왔|났)[어다]\", b[0]):\n            과거 += 1\n        if h and h[0].rstrip().endswith(\",\"):\n            쉼표 += 1\n        if any(w in \" \".join(h) for w in 말맛낱말):\n            말맛 += 1\n        # §9-7 「없는 숫자를 만들지 않았는가」 — 원본에 없는 수를 모은다\n        if 소식글:\n            for 수 in _숫자(\" \".join(b)):\n                if 수 not in 소식글:\n                    지어낸숫자.append(f\"{이름}:{수}\")\n\n    # ── 편 전체 ②: §9-11 「전언이 3분의 1을 넘으면 실패다」 ────────\n    #\n    # **어느 꼭지인지 이름으로 대준다 (2026-08-23).** 예전엔 \"7/7 이다\" 라고만\n    # 했더니 재작성 LLM이 「어느 줄이 지적된 게 아니니 손대지 마라」는 위쪽 지시와\n    # 부딪혀 하나도 안 고치고 그대로 냈다 — 아무 꼭지도 개별 지목이 안 됐기 때문이다.\n    # 남길 것과 바꿀 것을 이름으로 갈라 주면 «지적 안 된 줄은 그대로» 규칙과\n    # 안 부딪힌다 — 이것도 named 지적이 된다.\n    if n and 전언 > n * 전언한계:\n        남길수 = max(1, round(n * 전언목표))\n        바꿀것 = 전언목록[남길수:]\n        막힘.append(f\"3행 전언(~대요)이 {전언}/{n} 이다 — §9-11: 절반을 넘겼다. \"\n                    f\"{', '.join(바꿀것)} 의 본문 3행을 평서·~죠·느낌표·단서부사 중 \"\n                    f\"서로 다른 것으로 바꿔라 ({', '.join(전언목록[:남길수]) or '없음'} 은 \"\n                    f\"«대요» 로 둬도 된다)\")\n\n    def 비율(수):\n        return round(수 / n * 100) if n else 0\n\n    점수 = [\n        f\"꼭지 {n}개\" + (f\" (소식 {int(소식수)}건)\" if 소식수 else \"\"),\n        f\"3행 전언   {전언}/{n} = {비율(전언):3d}%   (원본 {원본비율['전언']}% · 한계 33%)\"\n        + (\"  ⚠️ 넘었다\" if n and 전언 > n * 전언목표 else \"  ✅\"),\n        f\"2행 ~죠    {죠}/{n} = {비율(죠):3d}%   (§9-10 절반 넘으면 몇 개를 바꿔라)\"\n        + (\"  ⚠️ 쏠렸다\" if n and 비율(죠) > 50 else \"  ✅\"),\n        f\"1행 쉼표   {쉼표}/{n} = {비율(쉼표):3d}%   (원본 {원본비율['쉼표']}%)\"\n        + (\"  ⚠️ 쏠렸다 §9-12\" if n and 비율(쉼표) > 50 else \"  ✅\"),\n        f\"1행 과거형  {과거}/{n} = {비율(과거):3d}%   (§9-15 전부 과거형은 아닌가)\"\n        + (\"  ⚠️ 전부 과거형이다\" if n and 과거 == n else \"  ✅\"),\n        f\"말맛 든 헤드라인  {말맛}개 (§9-14)\" + (\"  ⚠️ 담백하기만 하다\" if not 말맛 else \"  ✅\"),\n        f\"원본에 없는 숫자  {지어낸숫자 or '없음'} (§9-7)\"\n        + (\"  ⚠️ 지어낸 것인지 사람이 봐라\" if 지어낸숫자 else \"  ✅\"),\n        # **자수는 반려하지 않는다.** 겨냥점을 벗어났어도 폭이 통과했으면 카드는\n        # 멀쩡히 나온다. 자수는 원래 폭의 어림이었고, 지금은 폭을 직접 잰다.\n        f\"겨냥점을 벗어난 줄  {len(긴줄)}개\"\n        + (f\" ({' · '.join(긴줄[:5])})\" if 긴줄 else \"\")\n        + (\"  ⚠️ 폭은 통과했다 — 사람이 보고 판단하라\" if 긴줄 else \"  ✅\"),\n    ]\n\n    return {\"slides\": 꼭지, \"count\": n,\n            \"blocked\": \"\\n\".join(막힘), \"report\": \"\\n\".join(점수),\n            \"ok\": \"0\" if 막힘 else \"1\"}\n"
        code_language: python3
