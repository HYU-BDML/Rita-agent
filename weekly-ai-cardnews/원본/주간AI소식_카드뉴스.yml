밝기가 위 400줄 90, 아래 400줄 57 로 떨어지는 것을 보고 넣었다.\"\\n   }\\n  },\\n  \"CTA\": {\\n   \"_confidence\": \"중간 — 17.jpg 좌우 여백 픽셀 실측(2026-08-19)으로 세로 그러데이션 확인. 가로 방향은 균일로 본다(폰·글자 구역 빼고는 좌우 차가 노이즈 수준). 글자 세 덩어리는 코드에 박혀 있던 값을 여기로 옮긴 것이고, 원본과 대조해 y·x 네 덩어리 모두 0px 로 맞는 것을 확인했다\",\\n   \"background\": \"#EAF3FB\",\\n   \"note\": \"로고 글자 + 팔로우 유도 문구 + 계정 이름 + 폰 목업 자리(사람이 채움)\",\\n   \"photo_box\": {\\n    \"x0\": 310,\\n    \"y0\": 544,\\n    \"x1\": 770,\\n    \"y1\": 1350,\\n    \"radius\": 40,\\n    \"fill\": \"#D9D9D9\",\\n    \"mark\": \"?\",\\n    \"mark_color\": \"#9A9A9A\",\\n    \"mark_size\": 150,\\n    \"_note\": \"원본은 인스타 프로필을 담은 폰 목업이다. `asset` 이 있으면 그 그림을 칸에 맞춰 넣고, 없으면 회색 자리표시로 둔다. **계정이 자라면 이 파일만 갈아 끼우면 된다** — 코드도 자리표도 안 건드린다.\",\\n    \"asset\": \"폰목업.png\"\\n   },\\n   \"background_gradient\": [\\n    {\\n     \"at\": 0.0,\\n     \"color\": \"#F5FBFF\"\\n    },\\n    {\\n     \"at\": 0.2,\\n     \"color\": \"#E8F9FE\"\\n    },\\n    {\\n     \"at\": 0.85,\\n     \"color\": \"#ECF4FE\"\\n    },\\n    {\\n     \"at\": 1.0,\\n     \"color\": \"#F3F9FF\"\\n    }\\n   ],\\n   \"align\": \"center\",\\n   \"wordmark\": {\\n    \"_measured\": \"잉크 y190-223 · x430-648 — 그림이 아니라 찍은 글자다\",\\n    \"y\": 180,\\n    \"font_size\": 44,\\n    \"weight\": \"Bold\",\\n    \"color\": \"#000000\"\\n   },\\n   \"headline\": {\\n    \"_measured\": \"잉크 1행 y327-369 · 2행 y387-429\",\\n    \"lines_y\": [\\n     320,\\n     380\\n    ],\\n    \"line_height\": 60,\\n    \"font_size\": 46,\\n    \"weight\": \"Bold\",\\n    \"color\": \"#000000\"\\n   },\\n   \"handle\": {\\n    \"_measured\": \"잉크 y466-488 · x462-618. 색은 원본 실측값(#4B5256)이다 — 코드에 박혀 있던 #505050 보다 푸른 쪽이고, 뉴스 장 회색(#6C6D72)과도 다르다\",\\n    \"y\": 460,\\n    \"font_size\": 26,\\n    \"color\": \"#4B5256\"\\n   }\\n  },\\n  \"채용공고\": {\\n   \"_status\": \"2026-08-23 신설. 실측 기준 없음 — 취업 카드뉴스는 원본이 없어 처음부터 설계한 값이다. 실제 결과를 보고 다시 손볼 초안\",\\n   \"background\": \"#FFFFFF\",\\n   \"media_box\": {\\n    \"y0\": 0,\\n    \"y1\": 540,\\n    \"_왜\": \"이미지 40% : 텍스트 60% — 사용자 지정(2026-08-23). 로고 한 장보다 마감일 같은 정보가 이 카드에서 더 중요하다\"\\n   },\\n   \"chip\": {\\n    \"x\": 89,\\n    \"y\": 570,\\n    \"font_size\": 28,\\n    \"weight\": \"Bold\",\\n    \"color\": \"#FFFFFF\",\\n    \"bg_color\": \"#00E1FF\",\\n    \"pad_x\": 16,\\n    \"pad_y\": 8,\\n    \"radius\": 8,\\n    \"_왜\": \"기업형태(대기업·스타트업 등) 배지. 값이 없는 공고는 안 그린다\"\\n   },\\n   \"headline\": {\\n    \"lines_y\": [\\n     636,\\n     706\\n    ],\\n    \"line_height\": 70,\\n    \"font_size\": 58,\\n    \"weight\": \"Bold\",\\n    \"tracking\": -0.5,\\n    \"color\": \"#000000\",\\n    \"left_margin\": 89,\\n    \"_왜\": \"직무명. 뉴스 장 헤드라인(82px)보다 작다 — 긴 채용공고 제목이 잘리기 쉬워서\"\\n   },\\n   \"body\": {\\n    \"lines_y\": [\\n     800,\\n     848,\\n     896,\\n     944\\n    ],\\n    \"line_height\": 48,\\n    \"font_size\": 34,\\n    \"weight\": \"Medium\",\\n    \"tracking\": -0.3,\\n    \"color\": \"#3C3C3C\",\\n    \"left_margin\": 89,\\n    \"_왜\": \"회사명·마감일·경력조건·지역 네 줄. 뉴스 장은 세 줄이지만 여긴 정보가 더 필요해 하나 늘렸다\"\\n   },\\n   \"photo_placeholder\": {\\n    \"fill\": \"#D9D9D9\",\\n    \"mark\": \"?\",\\n    \"mark_color\": \"#9A9A9A\",\\n    \"mark_size\": 140\\n   }\\n  }\\n },\\n \"fonts\": {\\n  \"candidates\": {\\n   \"Pretendard-Bold\": \"fonts/Pretendard-Bold.otf\",\\n   \"Pretendard-Medium\": \"fonts/Pretendard-Medium.otf\",\\n   \"WantedSans-Bold\": \"fonts/WantedSans-Bold.otf\",\\n   \"WantedSans-Medium\": \"fonts/WantedSans-Medium.otf\"\\n  },\\n  \"headline_default\": \"Pretendard-Bold\",\\n  \"body_default\": \"Pretendard-Medium\",\\n  \"_decision_note\": \"82px 8줄 대조 NCC: Pretendard-Bold 0.9781 vs WantedSans-Bold 0.9774 — 잡음 수준 차이라 확정 못함. verify.py가 17장 전체로 두 글꼴을 각각 구워 점수 높은 쪽을 고른다. 기본값은 이미 설치돼 있는 Pretendard.\"\\n },\\n \"brand_logos\": {\\n  \"_status\": \"미확보\",\\n  \"_note\": \"2026-08-19 확정 명단 일곱. 그전 목록(Codex·Nvidia·GoogleDeepMind 등)은 복제판 한 건에서 나온 것이라 지웠다\",\\n  \"needed\": [\\n   \"ChatGPT\",\\n   \"Claude\",\\n   \"Gemini\",\\n   \"Grok\",\\n   \"Cursor\",\\n   \"Perplexity\",\\n   \"Meta AI\"\\n  ],\\n  \"_쓰는곳\": \"표지 전략 B 뿐. 뉴스 장 브랜드 칩에는 아이콘이 없다\"\\n }\\n}\\n')\n# **빌드하면 위에 «폭재기 + 폭표들 + 재는틀» 이 박힌다.** (make_dsl_v3.훅검증_코드)\n# 없을 때만 파일에서 읽는다 — 시험·CI 가 이 파일을 그냥 돌리기 때문이다.\nif \"넘치는_줄\" not in dir():\n    import sys as _sys\n    from pathlib import Path as _P\n    _뿌리 = _P(__file__).resolve().parent\n    _sys.path.insert(0, str(_뿌리))\n    from 폭재기 import 넘치는_줄                                    # noqa: F401\n    폭표들 = json.loads((_뿌리.parent / \"render-server\" / \"폭표.json\")\n                       .read_text(encoding=\"utf-8\"))\n    재는틀 = json.loads((_뿌리.parent / \"render-server\" / \"template.json\")\n                       .read_text(encoding=\"utf-8\"))\n\n\n밈목록 = '원피스, 아이언맨, 리얼스틸, 어벤져스, 나야, 들기름, 그런데 그것이 실제로 일어났습니다, 상상도 못한 정체, 슬램덩크, 태조 왕건 궁예, 드루와, 딱 대, 왕좌 탈환, 나노바나나 멈춰!, 이거 실화냐?, **누가 돌아왔게** 🔥, 그린그린 레드레드, 야나두, 갓성비, 아묻따, 떠먹여드림, 딸깍, 줬다 뺏기, 내 OO 돌려줘요, 고만해, 미친놈들아!, 근데 어쩔건데?, 내가 고자라니, 오늘부터 1일, 꿀꺽, 입주, 우리도 데려가줘요, 다 모여!, 줄줄이, 너 내 동료가 돼라, 왔다 갑니다, 좌절 짤 (홍명보), 혼란하다 혼란해!, 더 이상의 자세한 설명은 생략한다, 그래도 본업은 잘해요, 이 집 영업 잘하네, 각성 (마늘), 끝판왕, 치트키, 괴물, 코딩 맹수, 감다살, 맡기고 퇴근, 척척 / 뚝딱, 열일, 야 손대지마, 금붕어 기억력, 의사 가운 입은, **김동현(매미킴)**, 챗GPT 어화둥둥체, 설명할 시간이 없어, 빨리 타, 스파이더맨: 브랜드 뉴 데이, 기습, 크롬 시대는 끝, 스파르타, 컴활, 하꼬 탈출, 냉장고를 부탁해, 두쫀쿠, **누가 돌아왔게**, **고맙투우사**, **챗GPT 어화둥둥체**, **OO적 사고**, **그린그린 레드레드**, **장시간 비행**, **난리자베스**, **갑차기스러운데**, **냐냐냥**, **기도해 드릴게요**, **동결건조**'\n밈장면 = {'원피스': '루피가 손 내밀며 영입', '아이언맨': '슈트 안이 비었는지 두드려 보는 장면', '리얼스틸': '링 위 로봇이 사람 동작을 그대로 따라함', '어벤져스': '히어로들이 한 줄로 모임', '나야, 들기름': '정색한 얼굴로 자기 정체를 밝힘', '그런데 그것이 실제로 일어났습니다': '만화 컷 뒤에 붙는 자막', '상상도 못한 정체': '반전 공개 순간', '슬램덩크': '강백호 슛 자세, 관중석 안 선생님', '태조 왕건 궁예': '궁예가 관심법으로 신하를 노려봄', '드루와': '문 열고 도발하는 장면', '딱 대': '붙자고 손짓', '왕좌 탈환': '왕좌에 앉은 실루엣', '나노바나나 멈춰!': '손바닥 내밀어 제지', '이거 실화냐?': '눈 크게 뜨고 화면 응시', '**누가 돌아왔게** 🔥': '문 열고 압도적 성량으로 등장', '그린그린 레드레드': '비포&애프터 두 칸', '야나두': '손가락으로 가리키며 권함', '갓성비': '가격표에 후광', '아묻따': '손사래 치며 바로 결제', '떠먹여드림': '숟가락을 입에 대 줌', '딸깍': '마우스 클릭 한 번', '줬다 뺏기': '손에 쥔 걸 도로 뺏는 장면', '내 OO 돌려줘요': '울먹이며 손 내밈', '고만해, 미친놈들아!': '말리며 절규', '근데 어쩔건데?': '어깨 으쓱', '내가 고자라니': '무릎 꿇고 절규(아수라)', '오늘부터 1일': '커플이 손잡고 셀카', '꿀꺽': '큰 입이 작은 걸 삼킴', '입주': '이사 트럭이 건물로 들어감', '우리도 데려가줘요': '뒤에서 손 흔들며 따라감', '다 모여!': '한자리에 우르르', '줄줄이': '짐 싸서 줄지어 나감', '너 내 동료가 돼라': '(위와 같음)', '왔다 갑니다': '잠깐 들렀다 떠나는 뒷모습', '좌절 짤 (홍명보)': '머리를 쥐어뜯는 감독', '혼란하다 혼란해!': '웃으며 뒷걸음질 (만화체)', '더 이상의 자세한 설명은 생략한다': '자막만 있는 검은 화면', '그래도 본업은 잘해요': '딴짓하다 본업 성과 내밀기', '이 집 영업 잘하네': '식당에서 감탄', '각성 (마늘)': '흑백 인물 주변에 마늘이 떠다님', '끝판왕': '최종 보스 실루엣', '치트키': '게임 콘솔에 코드 입력', '괴물': '거대한 형체가 다가옴', '코딩 맹수': '맹수가 키보드 앞에', '감다살': '눈 감았다 뜨는 순간', '맡기고 퇴근': '가방 들고 사무실 나감', '척척 / 뚝딱': '결과물이 순식간에 완성', '열일': '땀 흘리며 일하는 캐릭터', '야 손대지마': '손 치우라고 막는 손짓', '금붕어 기억력': '금붕어 어항', '의사 가운 입은': '흰 가운을 걸친 로고 캐릭터', '**김동현(매미킴)**': '담담한 표정의 전 UFC 선수', '챗GPT 어화둥둥체': 'GPT 답변 화면, 별표 강조', '설명할 시간이 없어, 빨리 타': '**차에서 손 내밀고 뒤엔 폭발**', '스파이더맨: 브랜드 뉴 데이': '스파이더맨 슈트 (가슴 로고 교체)', '기습': '뒤에서 덮침', '크롬 시대는 끝': '간판이 떨어짐', '스파르타': '300 스타일 전사 대열', '컴활': '자격증을 들고 뿌듯한 표정', '하꼬 탈출': '작은 방에서 큰 무대로', '냉장고를 부탁해': '냉장고 열고 요리 대결', '두쫀쿠': '쿠키를 쪼개 늘어지는 단면', '**누가 돌아왔게**': '`OO에서 누가 돌아왔게~?`', '**고맙투우사**': '`고맙투우사~ 모~🐮`', '**챗GPT 어화둥둥체**': '`와… 너 정말, **핵심을 찔렀어**`', '**OO적 사고**': '`장항준적 사고` `장원영적 사고(럭키비키)`', '**그린그린 레드레드**': '`별로면 레드레드🚨 / 좋으면 그린그린💚`', '**장시간 비행**': '`장시간 비행입니다. 옆자리를 골라주세요`', '**난리자베스**': '`[감정]+자베스` (충격자베스·혜자베스)', '**갑차기스러운데**': '`갑차기스러운데 OO해도 돼?`', '**냐냐냥**': '`궁금하다면 냐냐냥!!! 입력하세요`', '**기도해 드릴게요**': '`〃`', '**동결건조**': '`〃`'}\n\n\ndef main(text: str, week: str, 고친것: str = \"\", 고친것2: str = \"\",\n         slides: str = \"\") -> dict:\n    memes = 밈목록\n    장면표 = 밈장면\n    # 늦게 고친 것부터. 이유는 06_본문검증.py 의 같은 자리를 보라.\n    _글 = next((x for x in (고친것2, 고친것, text) if (x or \"\").strip()), text)\n    표지 = json.loads(_벗기기(_글)) or {}\n    h = 표지.get(\"headline\") or []\n    강조 = (표지.get(\"accent_text\") or \"\").strip()\n    밈이름 = (표지.get(\"meme\") or \"\").strip()\n    막힘, 점수 = [], []\n\n    # **브랜드는 훅이 안 준다 — 합치기가 나중에 준다.**\n    # 그래서 여기서 «합치기와 같은 규칙» 으로 직접 뽑는다: 첫 꼭지의 브랜드.\n    # 이걸 안 하면 「얼굴 있는 브랜드인데 사람이 없다」 규칙이 늘 빈칸을 보고\n    # 조용히 지나간다 (2026-08-21 실측).\n    브랜드 = (표지.get(\"brand\") or \"\").strip()\n    # **`slides` 가 글자만 오는 게 아니다.** 소스(본문검증2.slides)는 `array[object]`\n    # 인데 이 노드는 `string` 으로 받는다고 적어 놨다 — Dify 가 그 자리를 «맞춰» 보내\n    # 주지 않고 **실제 파이썬 리스트를 그대로 넘긴다.** `(slides or \"\").strip()` 로\n    # 재던 자리가 그래서 `AttributeError: 'list' object has no attribute 'strip'`\n    # 로 죽었다(실측 2026-08-23). 리스트면 그대로 쓰고, 글자면 예전처럼 벗겨서 판다.\n    if not 브랜드 and slides:\n        try:\n            # **`_벗기기()` 는 배열에서 «첫 {}» 만 뽑아 준다.** 마침 그게 첫 꼭지라\n            # 우리가 원하는 것과 같다. 그래도 통짜 배열이 올 경우까지 받아 둔다.\n            _s = slides if isinstance(slides, list) else json.loads(_벗기기(slides))\n            if isinstance(_s, dict):\n                _s = _s.get(\"slides\") or _s.get(\"꼭지\") or [_s]\n            if isinstance(_s, list) and _s and isinstance(_s[0], dict):\n                브랜드 = (_s[0].get(\"brand\") or \"\").strip()\n        except Exception:\n            브랜드 = \"\"\n\n    주차 = (week or \"\").strip()\n    맞는2행 = f\"{주차} AI 소식\"\n\n    # ── 되돌릴 것 ────────────────────────────────────────────\n    if len(h) != 2:\n        막힘.append(f\"헤드라인이 {len(h)}줄이다 (2줄이어야 한다)\")\n    else:\n        일, 이 = h[0].strip(), h[1].strip()\n\n        # 2행은 19편 전부 예외 없이 «{N}월 {N}주차 AI 소식» 이다. 글자 하나 안 바뀐다.\n        if 이 != 맞는2행:\n            막힘.append(f\"2행이 «{이}» 다 — «{맞는2행}» 여야 한다 (19편 전부 예외 없음)\")\n\n        # **자수로는 반려하지 않는다 (§21).** 잘리는지는 아래 폭 검사가 본다 —\n        # «개발자 모여드는 한 주,» 13자가 922px 로 넉넉히 들어가는데 막고 있었다.\n        # 자수는 점수표에 이미 나온다. 본문에서 정리한 것을 훅에도 맞춘다.\n\n        # **어림이 아니라 실제 폭으로 잰다 (2026-08-20).**\n        #\n        # 예전엔 «순한글이면 11자까지» 라는 어림을 썼다. 순한글일 때만 맞고, 영문·숫자가\n        # 섞이면 아예 안 봤다. 이제 서버와 **같은 표**로 픽셀을 잰다 — 코드 노드에는\n        # 글꼴이 없어서 «글자→폭 표» 를 빌드할 때 박아 넣는다.\n        for x in 넘치는_줄({\"type\": \"표지\", \"headline\": h}, 재는틀, 폭표들):\n            if x.get(\"탈\"):\n                막힘.append(x[\"탈\"])\n                continue\n            막힘.append(f\"{x['자리']}이 카드 밖으로 {x['넘침']:.0f}px 나간다 — \"\n                       f\"줄여라 (자수가 아니라 폭이 상한선이다): «{x['글']}»\")\n\n        # 강조는 «N월 N주차» 뿐이다. «AI 소식» 까지 물들이면 안 된다.\n        if 강조 != 주차:\n            막힘.append(f\"accent_text 가 «{강조}» 다 — «{주차}» 여야 한다 \"\n                       f\"(«AI 소식» 까지 넣으면 줄 전체가 청록이 된다)\")\n\n        # §3「두 줄 합쳐 30자 넘기기」\n        # 두 줄 합계도 마찬가지 — 폭이 진짜 상한선이다.\n\n        # §3「이모지 (표지엔 없다, 캡션에만)」\n        붙은것 = [c for c in 일 + 이\n                  if 0x1F300 <= ord(c) <= 0x1FAFF or 0x2600 <= ord(c) <= 0x27BF\n                  or ord(c) in (0x2764, 0x2B50)]\n        if 붙은것:\n            막힘.append(f\"헤드라인에 이모지가 있다 ({chr(32).join(붙은것)}) — §3: 표지엔 없다\")\n\n        # §3「맹물 수식어 — 19편 중 한 건도 없다」. 스킬이 «하지 말 것» 으로\n        # 못 박았으니 보여주기만 하지 않고 되돌린다.\n        쓴맹물 = [w for w in 맹물 if w in 일]\n        if 쓴맹물:\n            막힘.append(f\"맹물 수식어 {쓴맹물} 를 썼다 — §3: 19편 중 한 건도 없다\")\n\n    # **밈은 반드시 고른다.** 스킬(§3)은 «19편 중 37%만 밈» 이라 했고 원본은 그렇다.\n    # 그런데 밈이 없으면 서버가 `gen_prompt` 만 보고 그림을 통째로 지어내는데,\n    # 그게 한눈에 «AI 가 만든 그림» 으로 보인다(실측 2026-08-20: 로고 박힌 화면 앞에서\n    # 머리 쥐어뜯는 삽화가 나왔다). 밈을 주면 구도·조명을 실제 사진에서 가져오고\n    # 배역만 갈아끼우기 때문에 그 티가 안 난다. **원본 분포보다 그림 품질을 택했다.**\n    있는것 = {m.strip() for m in (memes or \"\").split(\",\") if m.strip()}\n    if not 밈이름:\n        막힘.append(\"밈을 안 골랐다 — 밈 없이 만든 그림은 «AI 가 만든 티» 가 난다. \"\n                    \"밈사전에서 이 주의 판에 맞는 것을 하나 골라라\")\n    elif 있는것 and 밈이름 not in 있는것:\n        막힘.append(f\"밈 «{밈이름}» 이 밈사전에 없다 — 그림을 못 찾는다\")\n\n    프롬 = (표지.get(\"gen_prompt_en\") or 표지.get(\"gen_prompt\") or \"\").strip()\n    if not 프롬:\n        막힘.append(\"gen_prompt 가 없다 — 표지 그림을 못 만든다\")\n    else:\n        막힘 += _프롬프트검사(프롬, 브랜드)\n        점수 += _프롬프트점수(프롬)\n\n    # §3「고른 밈의 「장면」이 gen_prompt_en 안에 실제로 들어가야 한다」\n    #\n    # **이름만 검사했더니 이름만 채웠다.** 밈 이름은 밈사전에 있는 것으로 골라 놓고\n    # 그림은 밈과 무관한 은유로 그린 판이 나왔다(실측 2026-08-20: 금색 구슬 표지).\n    #\n    # 장면은 한글이고 프롬프트는 영문이라 낱말로 못 댄다. 그래서 **한글 한 줄**을\n    # 따로 받는다 — `밈쓰임` 에 «그 장면을 어떻게 쓰는지» 를 적게 하고, 그것이\n    # 밈사전의 장면과 실제로 겹치는지 본다. 쓰려면 장면을 읽어야 하는 구조다.\n    # **밈 이름도 같이 대본다 (2026-08-21).**\n    #\n    # 사전의 «장면» 은 그림을 묘사한 한 줄이고(«가방 들고 사무실 나감»), LLM 은 같은\n    # 뜻을 다른 말로 쓴다(«일을 몽땅 맡겨두고 퇴근하는 장면»). 그러면 겹치는 낱말이\n    # 없어서 «밈을 안 썼다» 고 막힌다 — **실제로는 밈 이름을 그대로 쓰고 있었다.**\n    # 밈 이름(«맡기고 퇴근»)까지 대보면 잡힌다.\n    장면 = ((장면표 or {}).get(밈이름, \"\") + \" \" + 밈이름).strip()\n    쓰임 = (표지.get(\"밈쓰임\") or \"\").strip()\n    if 밈이름 and 장면:\n        if not 쓰임:\n            막힘.append(f\"«밈쓰임» 이 비었다 — 밈 «{밈이름}» 의 장면(«{장면}»)을 \"\n                        f\"그림에서 어떻게 쓰는지 한 줄로 적어라\")\n        else:\n            겹침 = _낱말(장면) & _낱말(쓰임)\n            # **문턱은 «하나라도» 다 (2026-08-21).**\n            #\n            # 둘로 뒀더니 밈을 제대로 쓴 것을 막았다. 밈 «맡기고 퇴근» 을 «일을 몽땅\n            # 맡겨두고 퇴근하는 장면» 이라고 썼는데 겹친 게 «퇴근» 하나였다 —\n            # «맡기고» 와 «맡겨두고» 는 활용이 달라 앞 두 글자가 안 맞는다.\n            #\n            # **막으려는 것은 «이름만 대고 딴 그림을 그리는 것»** 이고, 그건 겹침이\n            # 0이다(실측: 밈은 «각성(마늘)» 인데 «금색 구슬» 을 그렸다 → 0개).\n            # 하나만 겹쳐도 그 밈을 보고 쓴 것이다.\n            if not 겹침:\n                막힘.append(f\"«밈쓰임» 이 밈 «{밈이름}» 의 장면과 안 맞는다. \"\n                            f\"장면은 «{장면}» 인데 적은 것은 «{쓰임}» 이다 \"\n                            f\"(겹친 낱말 {sorted(겹침) or '없음'})\")\n\n    # ── 보여줄 것 ────────────────────────────────────────────\n    일 = h[0].strip() if h else \"\"\n    쓴브랜드 = [b for b in 브랜드들 if b in 일]\n    갈래 = _갈래(일, 밈이름, 쓴브랜드)\n    점수 = [\n        f\"1행 «{일}» {len(일)}자 (겨냥 {일행자수[0]}~{일행자수[1]}, 중앙 9)\"\n        + (\"  ⚠️ 겨냥점 밖 — 폭은 통과했다\" if not (일행자수[0] <= len(일) <= 일행자수[1]) else \"  ✅\"),\n        f\"두 줄 합쳐 {len(일) + len(이)}자 (겨냥 {두줄합} 이하)\"\n        + (\"  ⚠️ 겨냥점 밖 — 폭은 통과했다\" if len(일) + len(이) > 두줄합 else \"  ✅\"),\n        f\"밈: {밈이름 or '안 골랐다'}   (원본은 37%였지만 우리는 필수다 — §3)\",\n        f\"1행 갈래(§2): {갈래}\" + (\"  ⚠️ 넷 중 어디인지 못 대면 다시 써라\" if 갈래 == \"못 댐\" else \"  ✅\"),\n        f\"1행에 회사 이름: {쓴브랜드 or '없음'}\"\n        + (\"  ⚠️ 74%는 회사 이름이 없다. 한 회사가 압도한 주에만 쓴다\" if 쓴브랜드 else \"  ✅\"),\n    ]\n\n    return {\"cover\": {**표지, \"headline\": h, \"accent_text\": 강조},\n            \"blocked\": \"\\n\".join(막힘), \"report\": \"\\n\".join(점수),\n            \"ok\": \"0\" if 막힘 else \"1\"}\n"
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - '2000000000009'
          - text
          value_type: string
        - variable: week
          value_selector:
          - '2000000000001'
          - week
          value_type: string
        - variable: slides
          value_selector:
          - '2000000000027'
          - slides
          value_type: array[object]
        outputs:
          cover:
            type: object
            children: null
          blocked:
            type: string
            children: null
          report:
            type: string
            children: null
          ok:
            type: string
            children: null
      zIndex: 0
