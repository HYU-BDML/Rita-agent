        code: "# Dify 코드 노드 「본문 검증」   ← LLM 「본문 대본」 뒤에 붙는다\n#\n# **이 노드가 하는 일: 「스킬대로 썼나」를 기계가 다시 세어 본다.**\n#\n# LLM 에게 스킬(`docs/본문대본_쓰기.md`)을 통째로 주고 §9 자기 점검까지 시켰지만,\n# **자기가 자기를 점검했다는 말을 믿을 수는 없다.** 그래서 여기서 다시 센다.\n# 아래 검사는 전부 그 스킬의 §8「하지 말 것」과 §9「자기 점검」에서 한 줄씩 옮겨 온\n# 것이다 — 새로 지어낸 규칙은 하나도 없다. 옆에 몇 번 항목인지 적어 두었다.\n#\n# 입력 변수:\n#     text    String   ← 본문 대본 / text        (처음 쓴 것)\n#     소식수   Number   ← 소식 고르기 / count     (§9-9 꼭지 수를 대볼 기준)\n#     소식글   String   ← 소식 고르기 / news      (§9-7 없는 숫자를 찾을 원본)\n#     고친것   String   ← 본문 다시 쓰기 / text   (안 돌았으면 빈 글자)\n#\n# **왜 «고친것» 을 받나.** 이 노드로 오는 길이 둘이다 — 막힌 게 없으면 갈래에서 바로\n# 오고, 막혔으면 «다시 쓰기» 를 거쳐 온다. 한 쪽만 읽게 하면 **안 돈 노드의 결과를\n# 읽으려다 죽는다**(실측 2026-08-19). 고친 게 있으면 그걸, 없으면 처음 것을 쓴다.\n#\n# 출력 변수:\n#     slides   Array[Object]  파싱한 꼭지들. 뒤 노드가 이걸 쓴다\n#     count    Number         꼭지 수\n#     막힘     String         **되돌려야 하는 잘못.** 비어 있으면 통과\n#     점수표    String         사람이 보는 몫. 되돌리지 않는다\n#     ok       String         \"1\" 이면 통과, \"0\" 이면 다시 쓰기로\n#                             **글자다.** Dify 의 갈래(`is`)가 글자끼리만 비교한다\n#\n# **잘못을 두 갈래로 가른다.**\n#\n#   ① 막힘 — 스킬이 «하지 말라» 거나 «실패다» 라고 못 박은 것. 고치면 반드시\n#            통과한다 → 되돌린다\n#   ② 점수표 — 스킬이 «몇 개를 바꾼다» 정도로 말한 것. 답이 하나가 아니다\n#            → 되돌리지 않고 보여준다\n#\n# 왜 가르나: 「6꼭지에서 ~죠 가 2개냐 3개냐」는 정답이 없다. 이걸로 반려하면 통과할\n# 때까지 돌 수 있다. **다만 스킬이 «실패다» 라고 쓴 것(3행 전언 1/3)은 ①로 올렸다** —\n# 되돌리기는 판 안에 한 번뿐이라 무한히 돌 걱정이 없다.\n#\n# **폭은 여기서 못 잰다.** Dify 코드 노드엔 글꼴이 없다. 폭은 서버의\n# `/render/check` 가 맡는다 — 이 노드 다음에 그게 붙는다.\n#\n# 아래 기준값은 전부 `docs/본문대본_쓰기.md` 에서 왔다. 원본 87꼭지 실측이다.\n\nimport json\nimport re\n\n본문자수 = (30, 38)\n\"\"\"§2 · §9-2. **42에서 38로 내렸다 (2026-08-21).**\n\n원본 87꼭지는 30~42자였고 사람이 쓰면 42자도 안 넘친다 — 띄어쓰기와 조사가\n넉넉해서다. 그런데 **기계가 쓰면 빽빽해서 39자부터 넘친다.** 실제 실행에서 나온\n13줄을 재 보니 38자 이하는 전부 통과, 39자부터 999~1062px 로 넘쳤다.\n\n규칙이 42면 LLM 은 41~42를 노리고 매번 폭에서 걸린다. **«규칙대로 쓰면 통과»\n가 되게** 상한을 실제 경계에 맞췄다. 사람이 쓴 골든 45줄도 30~38자다.\"\"\"\n제목1자수 = (7, 13)      # §6 · §9-2-1 중앙 10\n제목2자수 = (8, 16)      # §6 · §9-2-1 중앙 12\n\n전언목표 = 1 / 3         # §9-11 「전언이 3분의 1을 넘으면 실패다」 ← 스킬의 말 그대로\n전언한계 = 1 / 2\n\"\"\"**되돌리는 선은 절반이다. 스킬의 3분의 1 이 아니다 — 재 보고 정했다.**\n\n사람이 손으로 쓴 8월 3주차 시안 15꼭지가 **40%** 였다. 87꼭지 실측 평균도 32% 라\n«3분의 1» 은 평균이지 한 편의 상한이 아니다. 33% 에서 되돌리면 사람 솜씨의 대본도\n반려된다 — 그러면 검증이 아니라 훼방이다.\n\n그래서 **되돌리기는 절반, 알리기는 3분의 1** 로 갈랐다. 점수표에는 스킬의 말\n그대로 «한계 33%» 를 띄운다.\"\"\"\n원본비율 = {\"전언\": 32, \"쉼표\": 44, \"죠\": 0}   # 3행 전언 32% · 헤드라인 1행 쉼표 44%\n\n약어최대 = 5\n\"\"\"§7 「약어와 모델명만 남긴다」 — **대문자로만 된 짧은 토막은 약어로 본다.**\n\n목록을 손으로 관리하다 KFC·MS·시리즈B 를 «안 옮긴 영문» 으로 잡았다(실측: 사람이\n쓴 15꼭지 중 3건). 약어는 매주 새로 나오는데 목록은 안 따라온다. 대문자 규칙이면\n저절로 따라온다 — 그리고 걸러내야 할 «Ultrafast»·«Copilot» 은 섞임꼴이라 그대로 걸린다.\"\"\"\n\n말맛낱말 = (\"꿀꺽\", \"딱 대\", \"입주\", \"염탐\", \"가운\", \"돌아온\", \"이사\", \"품으로\",\n            \"삼켰\", \"붙었\", \"터졌\", \"혼쭐\", \"미쳤\", \"각성\", \"출격\", \"상륙\", \"탈환\")\n\n어미들 = (\"대요\", \"래요\", \"네요\", \"죠\", \"어요\", \"아요\", \"에요\", \"예요\", \"요\", \"다\")\n\"\"\"§4 문말 억양 사전. 긴 것부터 맞춰 봐야 «대요» 가 «요» 로 잡히지 않는다.\"\"\"\n\n높임말아닌것 = (\"습니다\", \"ㅂ니다\", \"입니다\", \"합니다\")   # §8 「본문에 합니다체」\n\n\ndef _벗기기(글):\n    \"\"\"LLM 이 ```json 으로 감싸 보내는 일이 흔하다.\"\"\"\n    글 = (글 or \"\").strip()\n    글 = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", 글, flags=re.M).strip()\n    처음, 끝 = 글.find(\"{\"), 글.rfind(\"}\")\n    return 글[처음:끝 + 1] if 처음 >= 0 and 끝 > 처음 else 글\n\n\n그대로쓰는이름 = (\"XAI\", \"X\", \"IOT\", \"IOS\", \"MACOS\", \"IPHONE\", \"IPAD\", \"CHATGPT\")\n\"\"\"**라틴 글자 그대로 쓰는 이름.** 두 갈래다.\n\n- **회사·제품 이름**: `xAI` 는 우리 명단에도 그렇게 적혀 있고 한글 표기가 안 굳었다\n- **대소문자가 섞인 약어**: `IoT` · `iOS` 는 `w.isupper()` 가 거짓이라 약어 검사에\n  안 걸린다. 그런데 한국 기사도 그냥 «IoT» 라고 쓴다\n\n**바꿀 한글이 없는 것을 «한글로 옮겨라» 라고 하면 LLM 은 고칠 수가 없다.**\n실측 2026-08-20 에 `xAI`·`IoT` 로 두 번 그렇게 막혔다.\"\"\"\n\n주소꼴 = re.compile(\n    r\"https?://\\S+\"\n    r\"|[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\"\n    r\"|[A-Za-z][A-Za-z0-9\\-]*\\.(?:ai|com|net|org|io|co|kr|dev|app)(?:/[^\\s,)»]*)?\",\n    re.I)\n\"\"\"**메일 주소와 경로까지 통째로 걷어낸다.** 처음엔 `x.ai` 만 지웠더니 `/bot` 이 남아서\n「bot 을 한글로 옮겨라」는 말이 나왔다(실측 2026-08-20).\"\"\"\n\n\ndef _영문(글):\n    \"\"\"옮겨야 할 영문만. 약어·모델명·회사명·주소는 뺀다.\n\n    **주소는 여기서 잡지 않는다.** `x.ai/bot` 을 «bot· x.ai 를 한글로 옮겨라» 라고\n    말하면 뜻이 안 통한다. 주소는 §8 이 따로 막는다.\n    \"\"\"\n    난것 = []\n    남은글 = 주소꼴.sub(\" \", 글)\n    for w in re.findall(r\"[A-Za-z][A-Za-z0-9\\.\\-]*\", 남은글):\n        if w.isupper() and len(w) <= 약어최대:      # 약어 — AI · API · KFC · MS · B\n            continue\n        if w.upper() in 그대로쓰는이름:\n            continue\n        if re.match(r\"^(GPT|GLM|GEMINI)-\", w.upper()):     # 모델 이름은 남긴다\n            continue\n        난것.append(w)\n    return 난것\n\n\ndef _어미(줄):\n    \"\"\"§4 줄을 닫는 어미를 집어낸다. 못 알아보면 «?».\"\"\"\n    끝 = re.sub(r\"[\\.\\!\\?…\\s\\\"'»~]+$\", \"\", (줄 or \"\").strip())\n    for e in 어미들:\n        if 끝.endswith(e):\n            return e\n    return \"?\"\n\n\ndef _이모지(글):\n    \"\"\"§8 「이모지 (본문에 한 건도 없다)」.\"\"\"\n    return [c for c in (글 or \"\")\n            if 0x1F300 <= ord(c) <= 0x1FAFF or 0x2600 <= ord(c) <= 0x27BF\n            or ord(c) in (0x2764, 0x2B50)]\n\n\ndef _숫자(글):\n    return re.findall(r\"\\d+(?:[.,]\\d+)?\", 글 or \"\")\n\n\ndef _꼭지뽑기(글):\n    \"\"\"LLM 이 내놓은 JSON 에서 꼭지 목록을 꺼낸다. **왜 이렇게 방어적인가.**\n\n    예전엔 `(json.loads(글) or {}).get(\"꼭지\") or []` 한 줄이었다. 그러면 셋이\n    **조용히 0개**가 된다 — 파싱 실패도, `null` 도, 칸 이름이 다른 것(`slides`)도.\n    빈 대본으로 판이 끝까지 돌아 표지와 마무리 두 장만 나온 적이 두 번 있다\n    (실측 2026-08-19·20). 조용한 0개가 이 판에서 제일 비싼 실패다.\n\n    돌려주는 것: (꼭지들, 무슨 일이 있었나 — 아무 탈 없으면 빈 글자)\n    \"\"\"\n    벗긴것 = _벗기기(글)\n    if not (벗긴것 or \"\").strip():\n        return [], \"대본이 비어 있다 — 앞 노드가 아무것도 안 내놨다\"\n    try:\n        d = json.loads(벗긴것)\n    except Exception as e:\n        return [], f\"대본이 JSON 이 아니다 ({e}) — 앞 300자: «{벗긴것[:300]}»\"\n    if not isinstance(d, dict):\n        return [], f\"대본이 묶음이 아니라 {type(d).__name__} 다\"\n    for 칸 in (\"꼭지\", \"slides\", \"items\"):\n        if isinstance(d.get(칸), list):\n            # 스킬은 «꼭지» 라고 했지만 다른 이름으로 오는 일이 있다. 받되 말해 준다.\n            return d[칸], \"\" if 칸 == \"꼭지\" else f\"칸 이름이 «{칸}» 다 — 스킬은 «꼭지» 라고 했다\"\n    return [], f\"«꼭지» 칸이 없다 — 들어 있는 칸: {sorted(d)[:8]}\"\n\n\n# -*- coding: utf-8 -*-\n\"\"\"글꼴 없이 글자 폭을 잰다 — Dify 코드 노드에 박아 넣는 조각.\n\n**왜 있나.** Dify 코드 노드에는 글꼴이 없다. 그래서 대본 검증이 «글자 수» 만 세고\n진짜 상한선인 «픽셀 폭» 은 못 봤다. 자수는 통과했는데 폭에서 넘치는 대본이 그대로\n굽기까지 가서 **8장 중 6장이 죽었다** (실측 2026-08-20).\n\n**어떻게 재나.** 서버(`template_render._measure_tracked`)는 글자마다 폭을 재서\n더하고 자간을 글자 사이마다 넣는다. 그 셈을 그대로 옮겼다. 한글은 폭이 하나로\n고정이라(Pretendard 실측) 표가 작다.\n\n**표는 `render-server/폭표.py` 가 만든다.** 자리표의 글자 크기를 바꾸면\n**표를 다시 구워야 한다** — 안 그러면 여기 답과 서버 답이 갈린다.\n`ci.py` 관문이 둘을 대조한다.\n\"\"\"\n\n\ndef 폭(글: str, 표: dict, 자간: float = 0.0) -> float:\n    \"\"\"`_measure_tracked` 와 같은 셈. 표에 없는 글자는 한글 폭으로 친다.\n\n    표에 없는 글자는 대개 한자·이모지·희귀 부호다. 한글 폭(전각)으로 치면\n    **실제보다 크게 잡히거나 같다** — 좁게 잡아 넘침을 놓치는 것보다 낫다.\n    \"\"\"\n    한 = 표[\"한글\"]\n    총 = 0.0\n    for c in 글:\n        총 += 표.get(c, 한) + 자간\n    return 총 - (자간 if 글 else 0)\n\n\ndef 넘치는_줄(장: dict, 틀: dict, 표들: dict) -> list:\n    \"\"\"카드 밖으로 나갈 줄. 서버 `넘치는_줄()` 과 같은 규칙.\n\n    돌려주는 것: [{\"자리\",\"글\",\"폭\",\"한계\",\"넘침\"}, ...]\n    \"\"\"\n    W = 틀[\"canvas\"][\"w\"]\n    t = (틀.get(\"slide_types\") or {}).get(장.get(\"type\"))\n    if not t:\n        return []\n    가운데 = t.get(\"align\") == \"center\"\n    글꼴 = 틀[\"fonts\"]\n    난것 = []\n\n    def 재라(자리, 줄들, cfg, 글꼴이름):\n        if not 줄들 or not isinstance(cfg, dict):\n            return\n        키 = \"%s|%d\" % (글꼴이름, int(cfg[\"font_size\"]))\n        표 = 표들.get(키)\n        if 표 is None:\n            난것.append({\"자리\": 자리, \"글\": \"\", \"폭\": 0, \"한계\": 0, \"넘침\": 0,\n                        \"탈\": \"폭표에 %s 가 없다 — render-server/폭표.py 를 다시 구워라\" % 키})\n            return\n        여백 = cfg.get(\"left_margin\", t.get(\"left_margin\", 0))\n        한계 = W if 가운데 else W - 여백\n        for i, 줄 in enumerate(줄들):\n            w = 폭(줄, 표, cfg.get(\"tracking\", 0.0))\n            if w > 한계:\n                난것.append({\"자리\": \"%s %d행\" % (자리, i + 1), \"글\": 줄,\n                            \"폭\": 