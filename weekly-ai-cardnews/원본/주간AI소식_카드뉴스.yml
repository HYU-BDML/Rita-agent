          text: '아래는 네가 방금 쓴 표지다.

            {{#2000000000009.text#}}


            **아래가 규칙을 어겼다. 이것만 고쳐라.**

            {{#2000000000010.blocked#}}


            **`gen_prompt_en` 을 고칠 때는 아래 다섯을 «전부» 지켜라 — 하나를 고치다 다른 하나를 깨는 일이 잦다.**

            1. 첫머리에 화풍을 못 박는다 (`Cinematic film still` · `Photograph` · `3D render` 중 하나)

            2. 주인공을 하나로 못 박는다 (`a single ...`)

            3. **얼굴이 카메라를 향하게 한다.** `from behind` · `silhouette` 은 쓰지 마라 — 얼굴이 안 보이면 얼굴 합성이 헛일이 된다

            4. **긍정문으로만 쓴다.** `no other objects` 같이 «없다» 로 쓰면 오히려 그것이 나온다. 대신 «무엇이 있다» 로 써라 (`a plain matte backdrop`)

            5. 끝에 아래 띠를 넣는다 (`The bottom 45 percent is one calm unbroken field of ...`)

            그림 속에 글자를 그리라고 하지 마라 — 글은 카드가 얹는다.


            JSON 하나만 내놓는다.'
