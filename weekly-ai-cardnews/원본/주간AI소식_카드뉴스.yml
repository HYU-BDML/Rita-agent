          text: "주차: {{#2000000000001.week#}}\n\n그 주 꼭지들:\n{{#2000000000027.slides#}}\n\n위 꼭지를 다 보고 **그 주가 어땠나** 를 뽑아 표지를 만들어라. JSON 하나만 내놓는다.\n\n---\n**내놓기 전에 이 다섯을 반드시 확인해라. 여기서 제일 자주 틀린다.**\n\n1. 2행은 «{{#2000000000001.week#}} AI 소식» 그대로, `accent_text` 는 «{{#2000000000001.week#}}» 뿐이다.\n2. **`meme` 은 아래 목록에 «그대로 있는» 이름이어야 한다.** 비슷하게 지어내면 그림을 못 찾아 판이 안 나온다. 목록에 마땅한 게 없으면 `meme` 을 빈 글자로 두고 밈 없이 가라.\n   쓸 수 있는 밈: 원피스, 아이언맨, 리얼스틸, 어벤져스, 나야, 들기름, 그런데 그것이 실제로 일어났습니다, 상상도 못한 정체, 슬램덩크, 태조 왕건 궁예, 드루와, 딱 대, 왕좌 탈환, 나노바나나 멈춰!, 이거 실화냐?, **누가 돌아왔게** \U0001F525, 그린그린 레드레드, 야나두, 갓성비, 아묻따, 떠먹여드림, 딸깍, 줬다 뺏기, 내 OO 돌려줘요, 고만해, 미친놈들아!, 근데 어쩔건데?, 내가 고자라니, 오늘부터 1일, 꿀꺽, 입주, 우리도 데려가줘요, 다 모여!, 줄줄이, 너 내 동료가 돼라, 왔다 갑니다, 좌절 짤 (홍명보), 혼란하다 혼란해!, 더 이상의 자세한 설명은 생략한다, 그래도 본업은 잘해요, 이 집 영업 잘하네, 각성 (마늘), 끝판왕, 치트키, 괴물, 코딩 맹수, 감다살, 맡기고 퇴근, 척척 / 뚝딱, 열일, 야 손대지마, 금붕어 기억력, 의사 가운 입은, **김동현(매미킴)**, 챗GPT 어화둥둥체, 설명할 시간이 없어, 빨리 타, 스파이더맨: 브랜드 뉴 데이, 기습, 크롬 시대는 끝, 스파르타, 컴활, 하꼬 탈출, 냉장고를 부탁해, 두쫀쿠, **누가 돌아왔게**, **고맙투우사**, **챗GPT 어화둥둥체**, **OO적 사고**, **그린그린 레드레드**, **장시간 비행**, **난리자베스**, **갑차기스러운데**, **냐냐냥**, **기도해 드릴게요**, **동결건조**\n3. `밈쓰임` 에 **그 밈의 장면을 어떻게 쓰는지** 한 줄로 적어라. 이름만 적고 딴 그림을 그리면 막힌다.\n4. **주인공은 «아는 얼굴» 이 기본값이다.** 우리가 다루는 회사에는 얼굴이 여섯 있다 — 알트만·머스크·저커버그·피차이·아모데이·젠슨 황. 그 주를 끌고 간 회사의 얼굴을 세워라. **여럿이 모이는 밈이라도 «모인 무리» 대신 «한 사람» 을 앞세울 수 있다.** 모르는 사람·스톡 모델이 주인공이면 스톡 사진으로 읽혀서 안 된다.\n   얼굴을 못 쓸 때만(회사에 얼굴이 없거나 · 배역이 셋 이상이거나 · 밈 원본 인물을 살려야 할 때) 마스코트나 사물로 간다. **그때는 «어느 회사 이야기인지» 가 그림에서 바로 읽혀야 한다** — 그 브랜드의 로고 표식을 주인공 몸이나 화면에 **크고 또렷하게** 넣어라. 아무 표식 없는 점토 인형은 AI 소식 표지가 아니다.\n5. **`gen_prompt_en` 은 다섯을 다 지켜라** — ① 첫머리에 화풍 (`Cinematic film still` · `Photograph` · `3D render`) ② 주인공 하나 (`a single ...`) ③ **얼굴이 카메라를 향하게** (`from behind` · `silhouette` 금지 — 얼굴이 안 보이면 얼굴 합성이 헛일이 된다) ④ **긍정문으로만** (`no other objects` 처럼 «없다» 로 쓰면 오히려 그게 나온다) ⑤ 끝에 아래 띠 (`The bottom 45 percent is one calm unbroken field of ...`).\n   **글자**를 그리라고 하지 마라 — 글은 카드가 얹는다. 다만 **브랜드 로고 표식은 글자가 아니다** — 읽히는 «낱말» 이 아니라 심벌이면 넣어도 되고, 얼굴을 안 쓸 때는 오히려 넣어야 한다.\n"
