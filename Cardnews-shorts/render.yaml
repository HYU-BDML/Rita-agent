# Render 에 올릴 때 쓰는 설정. 저장소를 연결하면 이 파일을 읽어 그대로 만든다.
services:
  - type: web
    name: cardnews-shorts-studio
    runtime: docker
    rootDir: Cardnews-shorts
    plan: standard          # 장면 그리기에 CPU 를 쓴다. 2GB 이상 권장
    numInstances: 1         # 반드시 1대. 만들기 대기열을 그 인스턴스 안에 들고 있다
    healthCheckPath: /api/version
    disk:
      name: projects
      mountPath: /data      # 학생 프로젝트(소스)가 여기 쌓인다. 없으면 재시작 때 사라진다
      sizeGB: 20
    envVars:
      - key: FAL_KEY        # 선택. 비우면 학생이 화면에서 자기 키를 넣는다(서버 기본 키)
        sync: false         # 대시보드에서 직접 넣는다. 저장소에 두지 않는다
      - key: ADMIN_TOKEN    # 교수·조교 화면(/admin) 열쇠
        sync: false
      - key: RENDER_WORKERS
        value: "2"
      - key: MAX_RENDERS_PER_PROJECT
        value: "30"
      - key: MAX_AI_IMAGES_PER_PROJECT
        value: "30"
      - key: ALLOW_LOCAL_KEY
        value: "0"
