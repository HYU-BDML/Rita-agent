      data:
        type: code
        title: 배치 검증
        desc: 넘침·미달·겹침·화면 밖을 다 본다(2026-08-20 사람이 정함).
        selected: false
        code: "# Dify 코드 노드 「배치 검증」   ← 「배치」 뒤에 붙는다\n#\n# **막는 것은 겹침과 화면 밖뿐이다.** 자수는 대본 검증에서 이미 쟀고, 세로로\n# 밀려 나간 것은 세기만 한다(사람 결정 2026-09-18: 「세로줄은 안 본다니까」).\n# 상자가 화면 밖으로 나가거나 글자끼리 겹치는 건 대본 검증 단계에서는 볼 수\n# 없다 — 그건 글이 아니라 자리의 탈이라 여기서만 잡힌다.\n#\n# **겹침은 «글자 대 글자» 와 «글자 대 로고» 만 본다.** 실물(DHqCBQnRAjW)에서\n# 사진·인물 네모는 서로 겹치는 게 정상이다(콜라주) — 1번 장 인물 네모\n# [39,256,587,1127] 이 사진 네모 셋과 다 겹친다. 사진 위에 글자를 얹는 것도\n# 정상이다 — 그게 이 템플릿의 실제 디자인이다(1번 장 헤드라인이 인물 사진\n# 위에 얹혀 있다). **깨지는 건 글자끼리 겹치는 것과, 글자가 로고를 가리는\n# 것뿐이다** — 둘 다 실측 데이터에는 없다(사진·인물끼리, 사진·글자는 겹치되\n# 글자·글자, 글자·로고는 안 겹친다는 걸 실물로 확인함). 여기서 사진·인물끼리\n# 겹침을 «막힘» 으로 잡으면 원본 그대로 배치해도 배치 검증이 못 통과한다.\n#\n# 입력 변수:\n#     카드_json  String  ← 배치 / cards_json               (처음 배치한 것)\n#     틀_json    String  ← 레시피 꺼내기 / 틀_json          (캔버스 크기)\n#\n# 출력 변수:\n#     cards_json  String   최종 카드(다음 노드 — 굽기 — 가 이걸 읽는다). 굽기의\n#                          HTTP 본문이 {{#..#}} 로 이 값을 직접 읽으므로 칸\n#                          이름이 아스키여야 한다(Dify 변수 참조 정규식, 오류모음 §22)\n#     막힘        String\n#     점수표      String\n#     ok         String   \"1\"/\"0\"\n\nimport json\n\n줄간격기본 = 1.32\n\"\"\"줄 간격 — `make_dsl_cardnews.줄간격기본`·`cardnews_compose.LINE_SPACING` 과 같은 값.\"\"\"\n\n\ndef _겹침넓이(a: list, b: list) -> float:\n    ax0, ay0, ax1, ay1 = a\n    bx0, by0, bx1, by1 = b\n    ox = max(0, min(ax1, bx1) - max(ax0, bx0))\n    oy = max(0, min(ay1, by1) - max(ay0, by0))\n    return ox * oy\n\n\ndef main(카드_json: str, 틀_json: str) -> dict:\n    글 = 카드_json\n    카드들 = json.loads(글)\n    틀 = json.loads(틀_json)\n    W, H = 틀[\"캔버스\"][\"w\"], 틀[\"캔버스\"][\"h\"]\n\n    막힘, 권고 = [], []\n    밀림 = 겹침 = 화면밖 = 로고가림 = 0\n    for 카드 in 카드들:\n        i = 카드[\"index\"]\n        장식영역 = 카드.get(\"장식영역\") or []\n        글자영역 = 카드.get(\"글자영역\") or []\n        전체영역 = [r[\"box\"] for r in 장식영역] + [r[\"box\"] for r in 글자영역]\n\n        # **세로로 밀려 나간 것은 세기만 한다 — 안 막는다**(사람 결정 2026-09-18:\n        # 「세로줄은 안 본다니까」). 자수 한계가 네모 «넓이» 를 글자 한 개 넓이로\n        # 나눈 값이라(`make_dsl_cardnews._자수매기기`) 한계껏 쓴 글은 낱말 경계\n        # 때문에 줄 끝이 조금씩 비어 한 줄을 더 잡아먹는다 — 여기서 막으면 규칙\n        # 그대로 쓴 대본이 막힌다(실물 2026-09-18: 시험대본이 1·6번 장에서 막혔다).\n        for r in 글자영역:\n            줄높이 = float(r.get(\"pt\") or 0) * float(r.get(\"줄간격\") or 줄간격기본)\n            높이 = (r[\"box\"][3] - r[\"box\"][1]) if r.get(\"box\") else 0\n            들어갈줄 = int(높이 / 줄높이) if 줄높이 > 0 else 0\n            if 들어갈줄 and len(r.get(\"lines\") or []) > 들어갈줄:\n                밀림 += 1\n                권고.append(f\"{i}번 장 글이 폭에 맞춰 감으니 {len(r['lines'])}줄인데 \"\n                          f\"자리는 {들어갈줄}줄이다\")\n\n        # **글자가 «도형» 안에 있는 것은 세지도 않는다.** 그게 글자그릇이다 —\n        # 검은 알약 안의 소제목, 초록 하트 옆의 글자. 겹치라고 있는 자리를\n        # 「겹침」으로 세면 알약 디자인이 통째로 막힌다(2026-08-26).\n        # 로고 겹침은 «경고» 로만 센다(2026-08-25). 글자끼리는 그대로 막는다 —\n        # 그건 읽을 수가 없다.\n        글자박스 = [r[\"box\"] for r in 글자영역]\n        로고박스 = [r[\"box\"] for r in 장식영역 if r.get(\"종류\") == \"로고\"]\n        for a in range(len(글자박스)):\n            for b in range(a + 1, len(글자박스)):\n                if _겹침넓이(글자박스[a], 글자박스[b]) > 0:\n                    겹침 += 1\n                    막힘.append(f\"{i}번 장 글자가 글자와 겹친다 — {글자박스[a]} 와 {글자박스[b]}\")\n        # **글자가 로고를 가리는 것은 «경고» 다 — 막지 않는다.**\n        # 처음엔 막았다. 실측 게시물이 하나(DHqCBQnRAjW)뿐이었고 거기서는 한 번도\n        # 안 겹쳤기 때문이다. 둘째 게시물(DG0AA6PJ8s4)을 재 보니 일곱 장 중\n        # **다섯 장**에서 본문 글자 네모가 구석 로고를 문다 — 디자이너가 늘 그렇게\n        # 긋는다는 뜻이지 잘못 그은 게 아니다. 표본 하나로 정한 규칙이었다.\n        # 사람이 「로고 덮어도 괜찮다」고 정했다(2026-08-25).\n        # 글자끼리 겹치는 것은 그대로 막는다 — 그건 읽을 수가 없다.\n        for gb in 글자박스:\n            for lb in 로고박스:\n                if _겹침넓이(gb, lb) > 0:\n                    로고가림 += 1\n\n        for box in 전체영역:\n            x0, y0, x1, y1 = box\n            if x0 < 0 or y0 < 0 or x1 > W or y1 > H:\n                화면밖 += 1\n                막힘.append(f\"{i}번 장 영역이 화면({W}x{H}) 밖이다 — {box}\")\n\n    점수 = [f\"장 {len(카드들)}개\",\n            f\"겹침 {겹침}건 · 화면밖 {화면밖}건\",\n            f\"경고 — 아래로 밀림 {밀림}건 · 글자가 로고를 가림 {로고가림}건 (둘 다 안 막는다)\",\n            *권고[:12]]\n\n    return {\"cards_json\": 글, \"막힘\": \"\\n\".join(막힘), \"점수표\": \"\\n\".join(점수),\n            \"ok\": \"0\" if 막힘 else \"1\"}\n"
        code_language: python3
        variables:
        - variable: 카드_json
