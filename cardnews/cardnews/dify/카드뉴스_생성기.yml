    - id: '2200000000021'
      type: custom
      position:
        x: 300
        y: 40
      positionAbsolute:
        x: 300
        y: 40
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: llm
        title: 구조
        desc: 정확한 자수는 안 잰다 — 「대본 검증」 사슬이 그건 맡는다.
        selected: false
        model: &id001
          provider: langgenius/bedrock/bedrock
          name: global.anthropic.claude-sonnet-4-6
          mode: chat
          completion_params:
            max_tokens: 16000
        prompt_template:
        - role: system
          text: 너는 카드뉴스 편집자다. 원고를 몇 장으로 나눌지만 정한다. **정확한 글자 수·문장은 신경 쓰지 마라** — 그건 뒤에서 다른 사람이 한다.
          id: 2200000000021-sys
        - role: user
          text: "주제: {{#2200000000001.topic#}}\n\n사용자가 직접 쓴 원고(비어 있으면 주제만 보고 판단):\n{{#2200000000001.user_script#}}\n\n카드뉴스는 훅 1장 + 사례 N장(네가 N을 정한다) + 요약 1장 + CTA 1장으로 구성된다.\n\n**할 일 — 딱 두 가지만:**\n1. 원고에 실제로 뚜렷이 구분되는 사례·예시가 몇 개 있는지 세어 N을 정한다(1~6 사이).\n   - 원고가 비어 있으면(주제만 있으면) N=4으로 한다.\n   - 사례가 6개보다 많으면 대표적인 것만 6개 추린다.\n   - 원고가 하나의 흐름으로 된 글이라 사례 형식이 아니거나 사례가 한둘뿐이면 N을 작게 잡아도 된다 — 억지로 쪼개 늘리지 마라.\n2. 사례마다 무엇을 다루는지 한 줄로 요약한다(정확한 문장·글자 수는 필요 없다).\n\nJSON 하나만 출력한다(다른 설명 금지):\n{\"사례_개수\": N, \"사례_개요\": [\"...\", \"...\"]}\n배열 길이는 반드시 N개다."
          id: 2200000000021-usr
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        structured_output_enabled: false
    - id: '2200000000022'
      type: custom
      position:
        x: 560
        y: 40
      positionAbsolute:
        x: 560
        y: 40
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: code
        title: 구조 정리
        desc: LLM이 정한 사례 장수를 1~6 안으로 가두고, 파싱 실패·빈 원고는 조용히 기본값(4)으로 돌아간다.
        selected: false
        code: "# Dify 코드 노드 「구조 정리」   ← LLM 「구조」 뒤에 붙는다\n#\n# **이 노드가 하는 일: 「구조」LLM 이 정한 사례 장수·개요를 기계가 다시 다듬는다.**\n# 「구조」는 원고(또는 주제)를 보고 \"사례가 몇 개(1~6)\"·\"사례마다 뭘 다루는지 한 줄\"만\n# 정하는 가벼운 LLM 이다 — 정확한 글자 수·문장은 신경 쓰지 않는다(그건 뒤에 오는\n# 「대본」LLM 의 몫). 이 코드 노드는 그 결과를 파싱해서 숫자는 범위 안으로 가두고,\n# 실패하면(파싱 안 되거나 원고가 비어 있으면) 조용히 기본값(4)으로 돌아간다 —\n# 여기서 막히면 전체 파이프라인이 못 돈다, 「구조」는 안전망이 있어야 하는 자리다.\n#\n# 입력 변수:\n#     text   String   ← 구조 / text\n#\n# 출력 변수:\n#     사례_개수   String   \"1\"~\"6\" 사이. 「레시피 꺼내기」의 입력으로 그대로 간다.\n#     outline    String   사람이 읽는 개요(\"1. ...\\n2. ...\\n...\"). 비어 있을 수 있다\n#                          (원고 없이 주제만 준 경우). 칸 이름이 아스키인 이유: 「대본」\n#                          LLM 프롬프트가 {{#..#}} 로 이 값을 직접 읽는다 — Dify 의\n#                          변수 참조 정규식이 아스키만 받는다(오류모음 §22).\n\nimport json\nimport re\n\n사례_최소, 사례_최대, 기본_사례개수 = 1, 6, 4\n\n\ndef _벗기기(글: str) -> str:\n    \"\"\"LLM 이 ```json 으로 감싸 보내는 일이 흔하다(카드뉴스_대본검증.py 와 같은 함정).\"\"\"\n    글 = (글 or \"\").strip()\n    글 = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", 글, flags=re.M).strip()\n    처음, 끝 = 글.find(\"{\"), 글.rfind(\"}\")\n    return 글[처음:끝 + 1] if 처음 >= 0 and 끝 > 처음 else 글\n\n\ndef main(text: str) -> dict:\n    벗긴것 = _벗기기(text)\n    try:\n        d = json.loads(벗긴것) if 벗긴것 else {}\n    except Exception:\n        d = {}\n\n    try:\n        n = int(d.get(\"사례_개수\"))\n    except (TypeError, ValueError):\n        n = 기본_사례개수\n    n = max(사례_최소, min(사례_최대, n))\n\n    개요목록 = d.get(\"사례_개요\")\n    if not isinstance(개요목록, list):\n        개요목록 = []\n    개요목록 = [str(x).strip() for x in 개요목록 if str(x).strip()][:n]\n    outline = \"\\n\".join(f\"{i}. {줄}\" for i, 줄 in enumerate(개요목록, start=1))\n\n    return {\"사례_개수\": str(n), \"outline\": outline}\n"
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - '2200000000021'
          - text
          value_type: string
        outputs:
          사례_개수:
            type: string
            children: null
          outline:
            type: string
            children: null
    - id: '2200000000024'
      type: custom
      position:
        x: 820
        y: 40
      positionAbsolute:
        x: 820
        y: 40
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: http-request
        title: 틀 받기
        desc: 주소가 비면 기본 틀, 있으면 그 주소의 틀을 받아 온다.
        selected: false
        method: post
        url: https://l26m3zzcjd.execute-api.ap-northeast-2.amazonaws.com/template/resolve
        authorization:
          type: no-auth
          config: null
        headers: Content-Type:application/json
        params: ''
        body:
          type: json
          data:
          - id: 2200000000024b
            type: text
            key: ''
            value: '{"url": "{{#2200000000001.template_url#}}", "이름": "{{#2200000000001.template_name#}}"}'
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        ssl_verify: true
    - id: '2200000000025'
      type: custom
      position:
        x: 1080
        y: 40
      positionAbsolute:
        x: 1080
        y: 40
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: code
        title: 틀 고르기
        desc: 대본이 정한 장 수만큼 골격을 만들고, 장마다 서랍에서 어울리는 디자인을 고른다. 틀이 장 수를 정하지 않는다.
        selected: false
        code: "# -*- coding: utf-8 -*-\n# 「틀 고르기」 — Dify 코드 노드 본문.\n#\n# **대본이 장 수를 정하고, 틀은 그 장에 입힐 옷을 댄다.** 틀이 장 수를 정하지 않는다.\n# 그래서 이 노드가 하는 일은 두 가지다:\n#\n#   1. 「구조」가 정한 사례 장수로 **골격을 만든다** (훅 1 + 사례 N + 요약 1 + CTA 1)\n#   2. 골격의 장마다 **서랍에서 어울리는 디자인을 고른다**\n#\n# 예전에는 「레시피 꺼내기」가 사례 장수별 틀을 **미리 다 만들어 박아 두고** 골라\n# 썼다. 그러면 바깥에서 가져온 틀을 못 쓴다 — 고리가 닫히지 않는다.\n#\n# 입력 변수:\n#     틀_json     String  ← 틀 받기 / body — templates/*.json 한 개\n#     사례_개수    String  ← 구조 정리 / 사례_개수\n#\n# 출력 변수:\n#     틀_json  String  골격이 사례 개수만큼 늘어나고 슬라이드가 채워진 틀\n#     few_shot String  「대본」 LLM 에게 줄 칸 설명\n#     고른것    String  어느 디자인을 골랐는지 사람이 읽는 한 줄들\n\nimport json\n\n# 통자수는 대본 검증·배치 검증과 **한 곳**에서 온다(카드뉴스_자수.py).\nimport 카드뉴스_자수 as 자수\n\n역할순서 = (\"훅\", \"사례\", \"요약\", \"CTA\")\n\n# 그 역할이 서랍에 없을 때 대신 쓸 역할. **앞에서부터 있는 것을 쓴다.**\n#\n# 실측 게시물마다 역할 구성이 다르다 — 키키(DG0AA6PJ8s4)는\n# 훅·정의·사례·해결·요약 이고 CTA 가 없다. 예전 코드는 없는 역할을 만나면\n# ValueError 로 멈춰서, 키키 틀 하나로는 한 장도 못 만들었다.\n#\n# **본문류(해결·정의·문제·비교·데이터)는 서로 바꿔 쓸 수 있다** — 칸 구성이\n# 「소제목 한 줄 + 본문 여러 줄」로 같기 때문이다. 훅은 안 적는다: 훅은 글자가\n# 크고 사진이 크게 들어가 본문 자리에 넣으면 눈에 띄게 어긋난다.\n대신표 = {\n    \"사례\": (\"해결\", \"정의\", \"문제\", \"비교\", \"데이터\"),\n    \"해결\": (\"사례\", \"정의\", \"문제\", \"비교\", \"데이터\"),\n    \"정의\": (\"사례\", \"해결\", \"문제\", \"비교\", \"데이터\"),\n    \"요약\": (\"CTA\", \"사례\", \"해결\"),\n    \"CTA\": (\"요약\", \"사례\", \"해결\"),\n    \"훅\": (),          # 훅은 대신할 것이 없다 — 서랍에 훅이 없으면 그때는 멈춘다\n}\n\n\ndef 대신할역할(역할: str, 서랍: dict):\n    \"\"\"`역할` 이 서랍에 없을 때 대신 쓸 역할. 있으면(대신할 필요가 없으면) None.\"\"\"\n    if 서랍.get(역할):\n        return None\n    for 딴것 in 대신표.get(역할, ()):\n        if 서랍.get(딴것):\n            return 딴것\n    return None\n\n\n# 「본문류」 — 칸 구성이 「소제목 한 줄 + 본문 여러 줄」로 같아서 서로 바꿔 써도\n# 어긋나지 않는 무리다. **이 무리는 «그 역할이 있어도» 한 통으로 모은다.**\n#\n# 없을 때만 대신하면 서랍이 기울어 있을 때 놀고 있는 옷이 생긴다 — 실측\n# (DG0AA6PJ8s4): 사례 1벌 · 해결 4벌인데 사례 자리 넷을 그 «하나»로 돌려 쓰고\n# 해결 넷은 한 번도 안 불렸다(2026-08-26). 훅·요약·CTA 는 모으지 않는다.\n# 요약 자리에 CTA 디자인이 섞이면 그건 다른 옷이다.\n본문류 = (\"사례\", \"해결\", \"정의\", \"문제\", \"비교\", \"데이터\")\n\n\ndef 후보모으기(역할: str, 서랍: dict) -> list:\n    \"\"\"그 역할에 쓸 디자인 후보. 본문류면 무리를 통째로 모은다.\n\n    모을 때 차례는 `본문류` 에 적힌 차례다 — 서랍의 열쇠 차례(파이썬 사전 순서)에\n    기대면 계량표를 다시 뽑을 때마다 고르는 옷이 조용히 바뀐다.\n    \"\"\"\n    if 역할 in 본문류:\n        모은것 = []\n        for 이름 in (역할,) + tuple(x for x in 본문류 if x != 역할):\n            모은것 += 서랍.get(이름) or []\n        return 모은것\n    return 서랍.get(역할) or []\n\n\ndef 고르기(서랍: dict, 골격: list) -> list:\n    \"\"\"골격의 장마다 디자인 하나씩. **아직 안 쓴 것을 먼저** 쓴다.\n\n    같은 디자인이 연달아 나오면 눈에 띈다. 그래서 역할마다 순번을 따로 돌리고,\n    다 쓰면 처음부터 다시 돈다. 서랍이 얕으면(디자인이 하나뿐이면) 결과가 예전\n    돌려쓰기와 같아진다 — 그건 서랍을 채우면 저절로 나아지는 문제지 코드 문제가\n    아니다.\n\n    본문류(사례·해결·정의·문제·비교·데이터)는 `후보모으기` 가 무리를 통째로\n    모아서 준다 — 그 역할이 서랍에 있어도 그렇다. 훅·요약·CTA 는 그대로\n    「없을 때만」 대신표를 탄다.\n    \"\"\"\n    쓴수 = {}\n    난것 = []\n    for 역할 in 골격:\n        후보 = 후보모으기(역할, 서랍)\n        쓸역할 = 역할\n        if not 후보:\n            쓸역할 = 대신할역할(역할, 서랍)\n            후보 = 서랍.get(쓸역할) or [] if 쓸역할 else []\n        if not 후보:\n            raise ValueError(f\"서랍에 «{역할}» 도, 대신 쓸 것도 하나도 없다 — \"\n                             f\"있는 것: {', '.join(sorted(서랍)) or '없음'}\")\n        # **셈 열쇠는 «어느 통에서 꺼냈나» 로 잡는다.** 본문류는 `후보모으기`\n        # 가 요청 역할마다 다른 차례로 통을 새로 만든다 — 그래서 역할이 곧\n        # 통이고, 역할로 세면 된다. 반면 훅·요약·CTA 의 대신하기는 **남의\n        # 통을 그대로 빌리는 것**이다 — 「요약 자리」와 「요약으로 대신한\n        # CTA 자리」가 같은 서랍 칸(같은 통)을 나눠 쓴다. 그런데도 역할로\n        # 세면 두 자리가 각자 0번부터 세서 같은 디자인이 잇달아 나온다\n        # (재현: 서랍에 요약 두 벌·CTA 없이 훅·사례·요약·CTA 를 고르면 요약\n        # 자리와 CTA 자리가 둘 다 첫 번째 요약을 집는다 — 2026-08-26 재검토).\n        # 그래서 이 갈래는 쓸역할(실제로 연 통)로 세야 한다.\n        통열쇠 = 역할 if 역할 in 본문류 else 쓸역할\n        i = 쓴수.get(통열쇠, 0)\n        쓴수[통열쇠] = i + 1\n        고른것 = dict(후보[i % len(후보)])\n        # **다른 역할 디자인을 골랐으면 적어 둔다.** 조용히 바꿔치기하면 결과가\n        # 이상할 때 원인을 못 찾는다. 이 값은 `main` 이 쪽지로 옮기고 틀에는\n        # 안 실린다. 본문류는 대신표를 안 타고도 무리에서 다른 역할을 집을 수\n        # 있어서, 「대신표를 탔는가」가 아니라 「고른 디자인의 역할이 요청한\n        # 역할과 다른가」로 판단한다.\n        if 고른것.get(\"역할\") != 역할:\n            고른것[\"_대신\"] = 역할\n        난것.append(고른것)\n    return 난것\n\n\ndef 칸설명(슬라이드: list, 본보기끄기: bool = False) -> str:\n    \"\"\"「대본」 LLM 에게 줄 칸 설명 — 장마다 어떤 칸이 몇 줄·몇 자인지.\n\n    `main` 에서 뽑아 둔 것은 **말이 맞는지 따로 시험하기 위해서**다 — 틀을\n    통째로 고르지 않고도 칸 설명만 견줄 수 있다.\n    \"\"\"\n    # **장 수를 맨 앞에 숫자로 못 박는다.**\n    #\n    # 「1번 장 … 7번 장」 이 죽 적혀 있으니 개수는 «세면» 알 수 있다. 그런데\n    # 모델이 그걸 안 센다 — 실물(2026-08-28): 7장짜리 틀에 **9장을 써서** 두 판을\n    # 고쳐 쓰고도 막혔다. 세게 하지 말고 그냥 알려 준다.\n    골격줄 = \" → \".join(s[\"역할\"] for s in 슬라이드)\n    줄 = [f\"이 카드뉴스는 「정확히 {len(슬라이드)}장」이다. \"\n         f\"slides 를 {len(슬라이드)}개 낸다 — 더도 덜도 안 된다.\",\n         f\"차례: {골격줄}\",\n         \"\",\n         \"장마다 쓸 수 있는 칸:\"]\n    for s in 슬라이드:\n        줄.append(f\"{s['index']}번 장 ({s['역할']}):\")\n        for j, slot in enumerate(s[\"글자슬롯\"], start=1):\n            # **위계를 맨 앞에 적는다.** 「이 칸은 제목이다」를 알면 LLM 이 글을\n            # 그에 맞게 쓴다 — 굵기·자수만으로는 그 뜻이 전해지지 않는다.\n            # 틀에 위계가 없으면(옛 틀) 그 말만 빠지고 나머지는 그대로다.\n            #\n            # **별표로 감싸지 않는다.** 여기 `**제목**` 이 있으니 모델이 그걸\n            # 따라 써서 카드에 별표가 그대로 찍혀 나왔다(실물 2026-08-27:\n            # «**감성 인테리어 포토존 특화 카페**»). 낫표로 바꾸면 그 유혹이 없다.\n            머리 = f\"「{slot['위계']}」, \" if slot.get(\"위계\") else \"\"\n            # **줄 수를 안 시킨다 — 「통틀어 몇 자」 하나만 시킨다**(사람 결정\n            # 2026-09-16 본문, 2026-09-18 모든 칸: 「세로줄은 안 본다니까」).\n            #\n            # 「정확히 4줄, 줄마다 15~23자」를 시키면 모델이 그걸 «네 문장» 으로\n            # 읽고 문장마다 30자씩 쓴다(실물 2026-08-28). 짧게 끊어 상자 오른쪽이\n            # 빈 채로 나오기도 한다(실물: 파란 타임라인 5번 장, 오른쪽 35% 가 빔).\n            # 줄 나누기는 코드가 글꼴 폭을 재서 한다.\n            통최소, 통최대 = 자수.통자수(slot)\n            줄.append(f\"  블록{j}: {머리}{slot.get('weight')}, 줄 나누지 말고 \"\n                     f\"한 덩어리로, 통틀어 {통최소}~{통최대}자(서식 기호 제외, \"\n                     f\"영문·숫자·띄어쓰기는 반 자로 센다)\")\n            # **원래 있던 말을 같이 보여 준다.** 자리만 맞고 말투가 딴 사람이면\n            # 그건 그 디자인이 아니다. 결만 따르라고 프롬프트가 못 박는다.\n            #\n            # **제 말투를 골랐으면 끄지 않는다**(사람 결정 2026-08-29). 여태는\n            # 말투를 «고르기만 하면» 껐다 — 「키키 템플릿에 키키 말투」처럼 같은\n            # 게시물에서 나온 짝까지 원문이 사라졌다. 말투를 고르는 것은 「그\n            # 템플릿의 훅과 규칙을 다 배워 따라 써라」는 뜻인데, 정작 배울 글을\n            # 지워 버리니 모델이 스스로 지어내고 그래서 「AI 스럽다」가 됐다.\n            #\n            # 남의 말투(다른 게시물)일 때만 끈다 — 그때는 목소리가 둘이 된다.\n            if slot.get(\"본보기\") and not 본보기끄기:\n                # **줄마다 나눠 보여 준다**(사람 지적 2026-08-30).\n                #\n                # 한 덩이로 붙여 보내면 모델이 그걸 «산문» 으로 읽고 한 문장을\n                # 죽 쓴다. 그러면 코드가 폭에 맞춰 다시 감는데, 그 자리는 낱말\n                # 경계일 뿐 뜻의 경계가 아니다 — 원본은 「① 압도적인 광고\n                # 효율성 / 평균 1100%에 달하는… / 기업의…」처럼 첫 줄이\n                # 소제목인데, 우리 것은 「① 창의적 사고 없던 것을 / 만드는 인간\n                # 고유의 발상력 / …」로 문장 중간에서 잘렸다.\n                #\n                # 원본이 어디서 끊었는지와 **줄마다 몇 자였는지**를 그대로\n                # 보여 준다. 모델이 그 결로 쓰면 다시 감기가 아예 안 돈다.\n                조각 = [x.strip() for x in str(slot[\"본보기\"]).split(\"/\") if x.strip()]\n                if len(조각) > 1:\n                    줄.append(\"      원본은 줄마다 이렇게 끊었다 \"\n                              f\"({'·'.join(str(len(x)) for x in 조각)}자):\")\n                    줄 += [f\"        {k}줄: «{x}»\" for k, x in enumerate(조각, 1)]\n                else:\n                    줄.append(f\"      말투 본보기: «{slot['본보기']}»\")\n    return \"\\n\".join(줄)\n\n\n# 끝맺는 역할. **서랍에 있는 것만 골격에 넣는다**(사람 결정 2026-09-18: 「너 CTA\n# 2개 쓴 거 맞네, 애초에 대본을 템플릿에 맞춰서 작성했어야지」).\n#\n# 여태는 `[\"요약\", \"CTA\"]` 를 못 박아 서랍이 무엇을 갖고 있든 넣었다. 그래서\n# 없는 역할이 대신표(`대신표`)를 타고 **있는 역할의 디자인을 빌려 썼고**, 같은\n# 옷이 두 장 나왔다 — 실물 DYzN0Uzgaq6(AI소식 미니)의 서랍에는 요약이 없어서\n# 요약 자리가 CTA 를 빌렸다.\n#\n# 본문류(사례 등)는 그대로 둔다 — 그쪽은 서로 바꿔 입어도 어긋나지 않는 한 무리라\n# 빌려 쓰는 것이 뜻이 있다(`본문류` 참고).\n끝맺는역할 = (\"요약\", \"CTA\")\n\n\ndef _마무리(서랍: dict) -> list:\n    \"\"\"서랍에 있는 끝맺는 역할만. 둘 다 없으면 빈 목록 — 본문으로 끝난다.\"\"\"\n    return [역할 for 역할 in 끝맺는역할 if 서랍.get(역할)]\n\n\ndef main(틀_json: str, 사례_개수: str, 본보기끄기: bool = False) -> dict:\n    틀 = json.loads(틀_json)\n    서랍 = 틀.get(\"서랍\")\n    if not 서랍:\n        raise ValueError(\"이 틀에는 «서랍» 이 없다 — 옛 모양이다. \"\n                         \"make_dsl_cardnews.py 를 다시 돌려 기본.json 을 만들거나, \"\n                         \"작업대에서 「틀로 저장」한 파일을 써라\")\n    try:\n        n = max(1, min(6, int(str(사례_개수).strip())))\n    except (ValueError, TypeError):\n        n = 4\n    골격 = [\"훅\"] + [\"사례\"] * n + _마무리(서랍)\n    고른것 = 고르기(서랍, 골격)\n\n    슬라이드 = []\n    for i, 디자인 in enumerate(고른것, start=1):\n        슬라이드.append({\"index\": i, \"역할\": 디자인[\"역할\"],\n                      \"배경\": 디자인[\"배경\"],\n                      \"장식영역\": 디자인[\"장식영역\"],\n                      \"글자슬롯\": 디자인[\"글자슬롯\"]})\n    새틀 = dict(틀)\n    새틀[\"골격\"] = 골격\n    새틀[\"슬라이드\"] = 슬라이드\n    새틀.pop(\"서랍\", None)   # 뒤 노드는 서랍을 안 본다 — 깊이를 얕게 유지한다\n\n    설명 = 칸설명(슬라이드, 본보기끄기)\n    쪽지 = []\n    for s, 디자인 in zip(슬라이드, 고른것):\n        사진자리 = sum(1 for r in s[\"장식영역\"] if r.get(\"종류\") in (\"사진\", \"인물\"))\n        대신 = 디자인.get(\"_대신\")\n        꼬리 = f\" ← «{대신}» 자리에 대신 씀\" if 대신 else \"\"\n        쪽지.append(f\"{s['index']}번 장({s['역할']}) — 글자 {len(s['글자슬롯'])}덩이 · \"\n                  f\"사진자리 {사진자리}개{꼬리}\")\n    return {\"틀_json\": json.dumps(새틀, ensure_ascii=False),\n            \"few_shot\": 설명,\n            \"고른것\": \"\\n\".join(쪽지)}\n"
        code_language: python3
        variables:
        - variable: 틀_json
