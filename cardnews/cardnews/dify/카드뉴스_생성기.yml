      data:
        type: code
        title: 배치
        desc: §2 고정 자리·색·글꼴 위에 새 글자를 얹는다. 형광펜은 §4 참고 통계의 간단한 규칙. 사진 주소가 있으면 사진·인물·로고 자리에 그대로 채운다.
        selected: false
        code: "# Dify 코드 노드 「배치」   ← 「대본 검증 2」 뒤에 붙는다\n#\n# 검증을 통과한 대본(장마다 역할+블록 목록)을 §2 고정 자리·색·글꼴 위에 얹는다.\n# 자리·글꼴·굵기·정렬·색은 전부 그 게시물(`DHqCBQnRAjW`) 라벨에서 그대로 가져온\n# 값이다 — 사람이 「자리는 쉽다」고 확인했다(진행표 2026-08-20, \"자리·크기는 고정,\n# 형광펜 등 강조는 생성 시점 판단으로 가른다\"). 여기서 새로 정하는 건 형광펜뿐이다.\n#\n# **형광펜·굵게는 이제 §4 참고 통계가 아니라 LLM 이 글 안에 직접 찍는다**\n# (`**굵게**`·`##형광펜##`, 카드뉴스_강조.py). 그 표시는 «감기 전 글» 의 글자\n# 번호로 붙어 있는데 여기서는 «감은 뒤 줄» 로 그려야 해서, 감기 전에 표시를\n# 떼고 감은 뒤 자리를 다시 셈한다(`_구간으로`) — §4 통계 기반 자리 추정(28%\n# 근사)은 문장 한가운데를 잘랐다(실물 \"있습니다. 진정성\") 그래서 뺐다.\n#\n# **왜 카드를 JSON 문자열 하나로 접나.** Dify 코드 노드는 출력 객체를 5층까지만\n# 받는다(«Depth limit 5 reached, object too deep»). 카드 하나가 장식영역+글자영역을\n# 품고 그 글자영역이 다시 box(리스트)를 담으면 6층을 넘는다. 그래서 카드 전체를\n# JSON 문자열로 접어 맨 위 칸(`cards_json`) 하나에 담는다 — 굽는 노드는 이 글자를\n# 본문 **맨 위**에서 그대로 끼워 넣는다(장 안에 파묻으면 Dify 가 이스케이프를\n# 하다 만다 — dify-workflow 스킬).\n#\n# 입력 변수:\n#     slides       Array[Object]  ← 대본 검증 2 / slides\n#     틀_json       String         ← 레시피 꺼내기 / 틀_json\n#     photo_urls   String     (선택) ← 시작 / photo_urls — 손으로 붙여넣은 사진 주소,\n#                              줄마다 하나. \"사진\"·\"인물\" 장식영역에 나오는 순서 그대로\n#                              하나씩 채운다. 사진은 이제 결과를 보고 «작업대»에서\n#                              넣는다(설계 §1) — 여기 붙여넣기는 자동화로 미리 주소를\n#                              아는 경우에 쓴다. 개수가 모자라면 남은 자리는 그냥\n#                              자리표시로 남는다(\"?\").\n#     logo_url     String     (선택) ← 시작 / logo_url — 손으로 붙여넣은 로고 주소.\n#                              \"로고\" 장식영역 전부 같은 사진으로 채운다.\n#\n# 출력 변수:\n#     cards_json  String   장마다 배경·장식영역·글자영역을 다 얹은 목록(JSON 문자열)\n#     count     Number\n\nimport json\nimport re\n\n# 통자수 자리의 «한 덩어리 → 폭 재서 감기» 는 대본 검증·틀 설명과 **한 곳**에서 온다.\nimport 카드뉴스_자수 as 자수\n# 표시 떼기·세기는 대본 검증·프롬프트와 **한 곳**에서 온다(카드뉴스_강조.py).\nimport 카드뉴스_강조 as 강조\n\n\ndef _구간으로(줄들: list, 자리들: list) -> list:\n    \"\"\"감기 «전» 글자 번호를 감은 «뒤» 줄·칸으로 옮긴다.\n\n    한 강조가 줄을 건너뛰면 줄마다 한 토막씩 낸다 — 굽는 쪽이 줄 단위로\n    그리기 때문이다. 줄바꿈 자리의 글자 하나는 어느 줄에도 안 센다.\n    \"\"\"\n    난것 = []\n    흐른것 = 0\n    for 번호, 줄 in enumerate(줄들, 1):\n        줄끝 = 흐른것 + len(줄)\n        for 자리 in 자리들:\n            시작 = max(자리[\"시작\"], 흐른것)\n            끝 = min(자리[\"끝\"], 줄끝)\n            if 시작 < 끝:\n                난것.append({\"종류\": 자리[\"종류\"], \"줄번호\": 번호,\n                           \"시작\": 시작 - 흐른것, \"끝\": 끝 - 흐른것})\n        흐른것 = 줄끝 + 1      # 줄바꿈 한 글자\n    return 난것\n\n\ndef _구조굵기(슬롯: dict, 줄들: list) -> list:\n    \"\"\"틀이 「첫 줄은 소제목」이라고 적었으면 그 줄을 통째로 굵게.\"\"\"\n    if not 슬롯.get(\"소제목첫줄\") or not 줄들:\n        return []\n    return [{\"줄번호\": 1, \"시작\": 0, \"끝\": len(줄들[0])}]\n\n\ndef _출처입히기(슬롯: dict, 줄들: list) -> list:\n    \"\"\"마지막 줄이 출처면 그 줄에만 색·정렬을 준다. 돌려주는 것은 줄마다의 사전.\"\"\"\n    난것 = [{\"글\": 줄} for 줄 in 줄들]\n    출처 = 슬롯.get(\"출처줄\")\n    if 출처 and len(난것) >= 2:\n        난것[-1][\"색\"] = 출처.get(\"색\")\n        난것[-1][\"align\"] = 출처.get(\"align\")\n    return 난것\n\n\ndef _사진_채운(장식영역: list, 사진순번, 로고: str) -> list:\n    \"\"\"장식영역 목록을 그대로 두되, \"사진\"·\"인물\"은 사진 주소 큐에서 하나씩,\n    \"로고\"는 고정 주소 하나를 `media_url` 로 얹는다. 주소가 없으면(큐가 비었거나\n    아예 안 왔으면) 아무것도 안 얹는다 — 굽는 쪽(`cardnews_compose.py`)이 이미\n    `media_url` 없으면 회색 자리표시로 그리게 돼 있다.\"\"\"\n    결과 = []\n    for r in 장식영역:\n        r = dict(r)\n        if r.get(\"종류\") in (\"사진\", \"인물\"):\n            url = next(사진순번, None)\n            if url:\n                r[\"media_url\"] = url\n        elif r.get(\"종류\") == \"로고\" and 로고:\n            r[\"media_url\"] = 로고\n        결과.append(r)\n    return 결과\n\n\n번호위계 = \"번호\"\n\n\ndef _번호글(차례: int, 전체: int, 본보기: str = \"\") -> str:\n    \"\"\"이 장에 찍을 번호. **원본이 쓰던 꼴을 그대로 따른다.**\n\n    원본이 「03」이면 「05」로, 「3」이면 「5」로, 「3/10」이면 「5/7」로 찍는다.\n    본보기가 없거나 못 읽으면 두 자리로 채운다 — 카드뉴스에서 가장 흔한 꼴이다.\n    \"\"\"\n    본 = (본보기 or \"\").strip()\n    빗금 = re.match(r\"^\\s*(\\d+)\\s*/\\s*(\\d+)\\s*$\", 본)\n    # **「몇 분의 몇」으로 말이 될 때만 빗금 꼴로 본다.** 앞이 뒤보다 크면 그건\n    # 차례/전체가 아니라 잘못 읽은 것이다 — 실물 2026-09-01: 원본의 「08」을\n    # OCR 이 「8 / 0」 으로 읽어, 일곱 장짜리 여섯째 장에 「6/7」이 찍혔다\n    # (다른 장은 전부 「02」·「03」 꼴이었다).\n    if 빗금 and int(빗금.group(1)) <= int(빗금.group(2)):\n        폭 = len(빗금.group(1))\n        return f\"{차례:0{폭}d}/{전체:0{폭}d}\"\n    낱 = re.match(r\"^\\s*(\\d+)\\s*$\", 본)\n    폭 = len(낱.group(1)) if 낱 else 2\n    return f\"{차례:0{폭}d}\"\n\n\n숫자넓이비 = 0.6\n\"\"\"숫자 한 자의 폭 ≈ pt × 이 값(프리텐다드 굵게 「0」 실측 0.58). 번호를 찍을 네모의\n폭을 잡는 데만 쓴다 — 실제 폭은 굽는 쪽이 글꼴로 잰다.\"\"\"\n\n\ndef 찍을네모(번호판: dict, 글자수: int) -> list:\n    \"\"\"번호판 위에 숫자를 찍을 글자 네모(1080 공간). 잰 중심에 가운데 맞춘다 —\n    폭은 숫자 수 × pt × 0.6 에 한 자 여유, 높이는 줄높이(pt × 1.32).\"\"\"\n    x0, y0, x1, y1 = 번호판[\"box\"]\n    숫 = 번호판.get(\"숫자\") or {}\n    pt = float(숫.get(\"pt\") or max(12, (y1 - y0) * 0.5))\n    중심 = 숫.get(\"중심\") or [0.5, 0.5]\n    cx = x0 + (x1 - x0) * float(중심[0])\n    cy = y0 + (y1 - y0) * float(중심[1])\n    w = pt * 숫자넓이비 * max(1, 글자수) + pt * 0.8\n    h = pt * 1.32\n    return [int(round(cx - w / 2)), int(round(cy - h / 2)), int(round(cx + w / 2)), int(round(cy + h / 2))]\n\n\ndef _번호판얹기(카드들: list, 번호판: dict) -> None:\n    \"\"\"**표지 뺀 모든 장**에 번호판 그림을 얹고 장 차례(1·2·3…)를 찍는다(사람 결정\n    2026-09-19). 원본 마지막 장에 번호가 없었으면(`마지막장` 거짓) 마지막 장은 뺀다.\n\n    번호판 그림은 «장식» 으로, 숫자는 «번호» 위계의 글자칸으로 싣는다 — 굽는 쪽과\n    작업대가 이미 아는 두 가지라 새로 배울 것이 없다.\n    \"\"\"\n    if not 번호판 or not 번호판.get(\"그림\") or len(카드들) < 2:\n        return\n    대상 = 카드들[1:]\n    if not 번호판.get(\"마지막장\", True) and len(대상) > 1:\n        대상 = 대상[:-1]\n    숫 = 번호판.get(\"숫자\") or {}\n    본 = 숫.get(\"본보기\") or \"01\"\n    for 차례, 카드 in enumerate(대상, start=1):\n        글 = _번호글(차례, len(대상), 본)\n        카드[\"장식영역\"] = list(카드.get(\"장식영역\") or []) + [\n            {\"종류\": \"장식\", \"box\": list(번호판[\"box\"]), \"그림\": 번호판[\"그림\"], \"번호판\": True}]\n        네모 = 찍을네모(번호판, len(글))\n        pt = 숫.get(\"pt\") or max(12, int((번호판[\"box\"][3] - 번호판[\"box\"][1]) * 0.5))\n        카드[\"글자영역\"] = list(카드.get(\"글자영역\") or []) + [{\n            \"종류\": \"글자\", \"box\": 네모, \"pt\": pt, \"weight\": 숫.get(\"weight\") or \"Bold\",\n            \"align\": \"가운데\", \"font\": 숫.get(\"font\") or \"프리텐다드\",\n            \"글자색\": 숫.get(\"글자색\") or \"#FFFFFF\", \"최소\": 1, \"최대\": max(2, len(글)),\n            \"lines\": [글], \"형광펜\": [], \"굵기\": [], \"위계\": 번호위계, \"세로가운데\": True,\n            \"번호판\": True}]\n\n\ndef main(slides: list, 틀_json: str, photo_urls: str = \"\", logo_url: str = \"\",\n         재기만들기=None) -> dict:\n    틀 = json.loads(틀_json)\n    슬라이드틀 = {s[\"index\"]: s for s in 틀[\"슬라이드\"]}\n    골격 = 틀[\"골격\"]\n    강조색 = 틀.get(\"강조색\") or \"#C9FC95\"\n\n    if len(slides) != len(골격):\n        raise ValueError(f\"장이 {len(slides)}개인데 골격은 {len(골격)}장이다 — \"\n                          f\"대본 검증을 통과했어야 하는 값이 안 맞는다\")\n\n    # 사진은 결과를 보고 «작업대»에서 넣는다(설계 §1). 여기서는 손으로 붙여넣은\n    # 주소만 받는다 — 자동화로 미리 주소를 아는 경우에 쓴다.\n    사진목록 = [u.strip() for u in (photo_urls or \"\").splitlines() if u.strip()]\n    사진순번 = iter(사진목록)\n    로고 = (logo_url or \"\").strip()\n\n    카드들 = []\n    for i, (기대역할, 카드) in enumerate(zip(골격, slides), start=1):\n        틀장 = 슬라이드틀[i]\n        블록 = (카드 or {}).get(\"blocks\") or []\n        슬롯들 = 틀장[\"글자슬롯\"]\n        if len(블록) != len(슬롯들):\n            raise ValueError(f\"{i}번 장 블록 {len(블록)}개, 슬롯 {len(슬롯들)}개 — \"\n                              f\"대본 검증을 통과했어야 하는 값이 안 맞는다\")\n\n        글자영역 = []\n        for 슬롯, 블록글 in zip(슬롯들, 블록):\n            # **감는 것은 표시를 뗀 글이다.** 표시(`**굵게**`·`##형광펜##`)를 단\n            # 채로 폭을 재면 그 표시 글자까지 폭에 들어가 상자가 헐거워진다.\n            # **띄어쓰기를 고르고 나서 표시를 뗀다.** `자수.폭감기` 는 안에서\n            # `한덩어리()` 를 불러 겹친 띄어쓰기·앞뒤 공백을 지운다 — 표시를\n            # 뗀 «뒤» 자리로 고르면 그 자리가 뒤로 밀려 감은 줄과 안 맞는다\n            # (검토 지적, 실측: \"앞  단어 **강조** 뒤\" 에서 자리가 「강조」\n            # 대신 「조 」를 가리켰다). `한덩어리` 를 먼저 걸어 두면 `폭감기`\n            # 안의 호출은 이미 고른 글에 다시 걸리는 것이라 안 바뀐다.\n            순수글, 자리들 = 강조.떼기(자수.한덩어리(블록글 or \"\"))\n            # **본문은 폭을 재서 감는다**(사람 결정 2026-09-16). LLM 이 어디서 끊었든\n            # 지우고, 이 슬롯의 글꼴로 낱말을 이어 붙이다 상자 폭을 넘으면 줄을 바꾼다.\n            # 그래야 원본처럼 오른쪽까지 찬다. 넘쳐도 안 자른다 — 배치 검증이 잡는다.\n            재기 = (재기만들기 or 자수.글꼴재기)(슬롯)\n            줄들 = 자수.폭감기(순수글, 재기, 슬롯[\"box\"][2] - 슬롯[\"box\"][0])\n            # **번호는 대본이 아니라 셈이다**(사람 결정 2026-08-30).\n            #\n            # 원본의 01·02·03 은 여태 배경판에 그림으로 박혀 딸려 왔다. 그래서\n            # 일곱 장짜리에 07 이 여섯 번째로 나왔다. 사람이 그 자리를 「번호」로\n            # 라벨하면 배경판에서 구멍으로 빠지고, 여기서 **장 차례**로 다시\n            # 찍는다. 모델이 무엇을 썼든 버린다 — 번호는 지어낼 것이 아니다.\n            if 슬롯.get(\"위계\") == 번호위계:\n                줄들 = [_번호글(i, len(골격), 슬롯.get(\"본보기\"))]\n                자리들 = []   # 줄을 갈아치웠으니 옛 자리는 이 줄과 안 맞는다\n\n            # 감기 전 글자 번호(`자리들`)를 감은 뒤 줄·칸으로 옮긴다.\n            강조구간 = _구간으로(줄들, 자리들)\n            # **형광펜은 우리가 안 찍는다**(사람 결정 2026-09-18). 잰 색을 못\n            # 믿는다 — 어두운 배경 디자인에서는 글자 사이로 비친 배경이 띠로\n            # 잡혀 형광펜색이 거의 검정으로 나온다(실물 DYzN0Uzgaq6: #0E0C0D ·\n            # #0F0C0A · #1E1F1E). 검은 글자 위에 검은 띠가 깔렸다.\n            # 사람이 작업대에서 긁어 칠한다 — 그 단추는 이미 있다.\n            형광펜 = []\n            굵기 = [{\"줄번호\": s[\"줄번호\"], \"시작\": s[\"시작\"], \"끝\": s[\"끝\"]}\n                     for s in 강조구간 if s[\"종류\"] == \"굵게\"] + _구조굵기(슬롯, 줄들)\n\n            글자영역.append({\n                \"종류\": \"글자\", \"box\": 슬롯[\"box\"], \"pt\": 슬롯[\"pt\"],\n                \"weight\": 슬롯[\"weight\"], \"align\": 슬롯[\"align\"],\n                \"font\": 슬롯[\"font\"], \"글자색\": 슬롯[\"글자색\"],\n                \"최소\": 슬롯[\"최소\"], \"최대\": 슬롯[\"최대\"],\n                \"lines\": 줄들,\n                \"형광펜\": 형광펜,\n                \"굵기\": 굵기,\n            })\n            # 출처(마지막 줄)만 색·정렬이 다르면 그 줄에만 얹는다 — 틀에 없으면\n            # `_출처입히기` 가 아무것도 안 보태므로 칸 자체를 안 싣는다.\n            출처 = _출처입히기(슬롯, 줄들)[-1]\n            if \"색\" in 출처:\n                글자영역[-1][\"출처\"] = {\"색\": 출처[\"색\"], \"align\": 출처[\"align\"]}\n            # **틀에 있을 때만 옮긴다.** 안 잰 값을 기본값으로 채우면 굽는 쪽이\n            # 그걸 「잰 값」으로 착각한다 — 줄간격이 특히 그렇다(붙박이 1.32 와\n            # 재어 온 1.32 는 뜻이 다르다). `줄색`·`줄굵기` 는 이제 배치가 안 낸다\n            # (형광펜·굵게는 `굵기`·`형광펜` 이 대신한다) — 옛 틀에 남아 있어도\n            # 옮기면 굽는 쪽이 줄 단위 굵기로 되돌아간다.\n            for 이름 in (\"위계\", \"줄간격\", \"효과\", \"각도\", \"세로가운데\"):\n\
          \                if 이름 in 슬롯:\n                    값 = 슬롯[이름]\n                    # `슬롯` 은 한 틀의 글자슬롯 하나다 — 같은 역할(사례 등)의\n                    # 카드가 여러 장이면 이 슬롯 하나를 장마다 돌려 쓴다. 목록\n                    # (`효과`)을 그대로 물려주면 한 장에서 고친 목록이 다른\n                    # 장에도 그대로 걸친다 — `list(...)` 로 떠서 끊는다.\n                    글자영역[-1][이름] = list(값) if isinstance(값, list) else 값\n\n        카드들.append({\n            \"index\": i, \"역할\": 기대역할, \"배경\": 틀장[\"배경\"],\n            \"장식영역\": _사진_채운(틀장[\"장식영역\"], 사진순번, 로고), \"글자영역\": 글자영역,\n        })\n\n    _번호판얹기(카드들, 틀.get(\"번호판\"))\n    return {\"cards_json\": json.dumps(카드들, ensure_ascii=False), \"count\": len(카드들)}\n"
        code_language: python3
        variables:
        - variable: slides
          value_selector:
          - '2200000000018'
          - 표시슬라이드
