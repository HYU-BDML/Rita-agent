          - 기본
          - DG0AA6PJ8s4
          - DHqCBQnRAjW
          default: 기본
        - variable: template_url
          label: 디자인 틀 주소(고급, 선택) — 적으면 위에서 고른 것보다 이게 이긴다. 목록에 아직 안 오른 틀을 쓸 때만
          type: text-input
          required: false
          max_length: 500
