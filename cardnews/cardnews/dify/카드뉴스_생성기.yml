        code: "# Dify 코드 노드 「대본 검증」 / 「대본 검증 2」   ← LLM 「대본」 뒤에 붙는다\n#\n# **이 노드가 하는 일: 대본이 규칙표(docs/규칙표_카드뉴스.md) §1(자수)·골격을\n# 지키는지 기계가 다시 센다.** 기준값은 전부 「레시피 꺼내기」 노드가 내놓는\n# `틀_json` 에서 온다 — 여기 손으로 적은 숫자는 하나도 없다. `틀_json` 은\n# `analyze/recipe.py` 의 `char_limit_rows()`·`role_quotes()` 실측을 그대로 담고\n# 있다(dify/make_dsl_cardnews.py 가 빌드할 때 박는다).\n#\n# 입력 변수:\n#     text     String   ← 대본 / text                (처음 쓴 것)\n#     틀_json   String   ← 레시피 꺼내기 / 틀_json      (골격·장마다 글자슬롯·자수 한계)\n#     고친것    String   ← 대본 다시 쓰기 / text        (안 돌았으면 빈 글자)\n#\n# **왜 «고친것» 을 받나.** 이 노드로 오는 길이 둘이다 — 막힌 게 없으면 갈래에서\n# 바로 오고, 막혔으면 «다시 쓰기» 를 거쳐 온다. 한 쪽만 읽게 하면 **안 돈 노드의\n# 결과를 읽으려다 죽는다**(dify-workflow 스킬, 06_본문검증.py 와 같은 이유).\n#\n# 출력 변수:\n#     slides   Array[Object]  파싱한 장들 [{\"role\":.., \"blocks\":[..]}] — 표시(`**`·`##`)\n#                              를 뗀 글. 사람이 점수표에서 읽기 좋게 남긴다.\n#     표시슬라이드 Array[Object]  같은 모양이지만 **표시가 살아 있는 글**.\n#                              배치가 받는 것은 이것이다 — 배치가 `**`·`##` 를\n#                              직접 찾아 굵기·형광펜을 만들기 때문이다\n#                              (표시를 뗀 `slides` 를 배치로 보내면 그 둘이 늘\n#                              빈 목록이 된다, 검토 지적 ①).\n#     count    Number\n#     blocked  String   **되돌려야 하는 잘못.** 비어 있으면 통과\n#                        칸 이름은 아스키다 — LLM 프롬프트가 {{#..#}} 로 이 값을\n#                        직접 읽는데, Dify 의 변수 참조 정규식이 아스키만 받는다\n#                        (한글 칸은 조용히 치환이 안 된 채로 간다. 오류모음 §22).\n#     점수표    String   사람이 보는 몫. 되돌리지 않는다 — {{#..#}} 로 안 읽혀서 그대로 둔다\n#     ok       String   \"1\" 이면 통과, \"0\" 이면 다시 쓰기로\n#                        **글자다.** Dify 의 갈래(`is`)가 글자끼리만 비교한다\n#     draft    String   **실제로 검증한 글**(고친것 이 있었으면 그것, 없었으면 text\n#                        그대로). 되돌리기를 여러 판 잇댈 때 다음 판의 `text` 입력이\n#                        이걸 받는다 — \"이번 판이 실제로 무엇을 검증했는지\"를 다음\n#                        판이 원본이 아니라 여기서 이어받아야, 이미 통과한 고친\n#                        글을 다음 판이 원본으로 되돌려 다시 검증하는 일이 없다.\n#\n# 자수 상·하한을 **둘 다** 막는 이유: 진행표 \"Task 9 규칙표에 사람이 오늘 정한 것\n# 셋\" (2) — \"아래 공백(하한)도 넘침(상한)만큼 중요하다\"(2026-08-20, 사람이 그림을\n# 보고 정함). 배치 단계에서도 같은 것을 다시 재지만(방어가 하나뿐이면 배치가\n# 상자·자수를 잘못 짝지어도 못 잡는다), 여기서 먼저 잡으면 LLM 이 고칠 기회가\n# 있다 — 배치 뒤에서는 코드로 자르는 것(넘침)만 가능하고 늘리는 건 못 한다.\n\nimport json\nimport re\nfrom functools import lru_cache\n\n# 통자수·한덩어리는 틀 설명·배치 검증과 **한 곳**에서 온다(카드뉴스_자수.py).\nimport 카드뉴스_자수 as 자수\n# 표시 떼기·세기는 배치·프롬프트와 **한 곳**에서 온다(카드뉴스_강조.py).\nimport 카드뉴스_강조 as 강조\n\n\ndef _다시감기(줄들, n, lo, hi, 끝줄하한=True, 표시줄들=None):\n    \"\"\"줄바꿈은 LLM 이 아니라 코드가 맡는다 — 실물 실행(2026-08-23, §27 후속)에서\n    \"정확히 N줄, 각 줄 M~M자\" 를 LLM 에게 직접 맞히라고 시켰더니 재작성을 여러\n    판 거쳐도 계속 틀렸다(줄 수만 8줄을 낸 적도 있다). 그런데 **낱말 순서만\n    지키면** 되는 줄바꿈은 코드가 항상 정확히 풀 수 있는 문제다 — 그러니 LLM\n    에게는 \"총 이 정도 분량으로 써라\" 만 맡기고, 몇 글자에서 끊을지는 여기서\n    낱말 경계를 그대로 두고 다시 감는다(의미·낱말 순서는 안 바뀐다, 띄어쓰기\n    위치만 줄바꿈으로 바뀐다). 원문 그대로도 이미 조건을 만족하면 이 함수는\n    안 불린다 — 만족 못 할 때만 마지막 구제책으로 쓴다.\n\n    `표시줄들`(선택) — **표시(`**`·`##`)가 살아 있는 같은 글의 줄들.** 줄 나눌\n    자리는 항상 `줄들`(표시를 뗀 글, 자수 기준)의 낱말 길이로 고른다. 낱말\n    수가 서로 같으면(거의 늘 같다 — 표시는 낱말 안에 붙지 띄어쓰기를 새로\n    만들지 않는다) 그 자리에 표시가 붙은 낱말을 끼워 돌려준다. 다르면(드문\n    엇갈림) 표시 없는 낱말로 물러선다 — 표시를 잃을 뿐 줄바꿈 자체는 그대로다.\n    \"\"\"\n    낱말들 = \" \".join(줄들).split()\n    if not 낱말들:\n        return None\n    표시낱말들 = \" \".join(표시줄들).split() if 표시줄들 is not None else None\n    쓸것 = 표시낱말들 if (표시낱말들 is not None and len(표시낱말들) == len(낱말들)) else 낱말들\n    N = len(낱말들)\n    길이들 = [len(w) for w in 낱말들]\n\n    @lru_cache(maxsize=None)\n    def 풀기(i, 남은줄):\n        if 남은줄 == 0:\n            return () if i == N else None\n        총 = -1\n        for j in range(i, N):\n            총 = 길이들[j] if 총 < 0 else 총 + 1 + 길이들[j]\n            if 총 > hi:\n                break\n            if 남은줄 == 1:\n                if j != N - 1:\n                    continue\n                if 끝줄하한 and 총 < lo:\n                    return None   # 마지막 줄도 최소 자수를 지켜야 한다 — 실물 2026-08-24,\n                                   # 여기가 빠져서 \"모두 확인이 됩니다.\"(11자, 최소 19자)\n                                   # 같은 너무 짧은 마지막 줄을 성공으로 잘못 승인했다.\n                return (\" \".join(쓸것[i:j + 1]),)\n            if 총 >= lo:\n                나머지 = 풀기(j + 1, 남은줄 - 1)\n                if 나머지 is not None:\n                    return (\" \".join(쓸것[i:j + 1]),) + 나머지\n        return None\n\n    풀린것 = 풀기(0, n)\n    풀기.cache_clear()\n    return list(풀린것) if 풀린것 else None\n\n\ndef _벗기기(글):\n    \"\"\"LLM 이 ```json 으로 감싸 보내는 일이 흔하다.\"\"\"\n    글 = (글 or \"\").strip()\n    글 = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", 글, flags=re.M).strip()\n    처음, 끝 = 글.find(\"{\"), 글.rfind(\"}\")\n    return 글[처음:끝 + 1] if 처음 >= 0 and 끝 > 처음 else 글\n\n\n# 굵게·형광펜 표시. **재는 쪽과 그리는 쪽이 어긋나서 넣는다.**\n#\n# 레시피는 장마다 「마크다운 기호 제외」라고 적어 두고 자수를 정한다. 그런데\n# 그 말만 있고 **기호를 빼는 코드가 어디에도 없었다** — 세는 쪽은 `**`·`##` 를\n# 글자로 같이 세고, 그리는 쪽은 그것을 글자로 그렸다. 실물(2026-08-27 RITA 첫\n# 성공): 2번 장 제목이 «**감성 인테리어 포토존 특화 카페**» 로 별표까지 찍혀\n# 나왔다. `##` 도 같이 떼야 한다 — 안 그러면 형광펜 표시가 글자로 세어져 예산이\n# 어긋나고, 그리는 쪽은 그 표시를 안 그리므로 상자가 헐거워진다.\n#\n# 뗄 표시는 `카드뉴스_강조.떼기` 가 이미 안다 — **세는 쪽과 감는 쪽이 같이\n# 쓰는 한 곳**이라 여기서도 그걸 쓴다. 두 벌로 갈리면 검증과 배치가 서로 다른\n# 자리를 표시로 본다. 짝이 안 맞고 남은 별표(`_뜬별표`)도 `강조.떼기` 안에서\n# 같이 떼므로 여기서 따로 뗄 것이 없다.\n\n\ndef _기호빼기(글: str) -> str:\n    \"\"\"`**굵게**`·`##형광펜##` → 알맹이만. 짝이 안 맞는 별표도 떼어 낸다.\n\n    **자수는 표시를 뺀 길이로 센다.** 표시를 글자로 세면 예산이 어긋나고,\n    그리는 쪽은 그 표시를 안 그리므로 상자가 헐거워진다.\n    \"\"\"\n    return 강조.떼기(글)[0]\n\n\n# 원본 게시물의 «남의 이름» 을 찾는 자. 라틴 문자로 된 낱말만 본다.\n#\n# **왜 라틴 문자인가.** 실물 2026-09-01: 우리 카드뉴스 마지막 장에 「MOT 매거진\n# 팔로우!」가 그대로 찍혔다 — 원본 게시물의 브랜드다. 모델에게 「내용만 베끼지\n# 마라」고 이미 적어 두었는데도 CTA 장은 본보기를 그대로 옮긴다.\n#\n# 본보기에 든 라틴 낱말은 거의 다 브랜드·제품 이름이다(MOT · COSRX · 네이버\n# 쇼핑 커넥트의 영문 표기…). 한글 낱말까지 막으면 흔한 말이 걸려 다 된 대본을\n# 버리게 되므로 **여기까지만 한다.** 한글 브랜드는 못 잡는다 — 숨기지 않고 적어\n# 둔다(점검이 아니라 이 주석이 그 한계의 기록이다).\n_라틴낱말 = re.compile(r\"[A-Za-z][A-Za-z0-9]{2,}\")\n\n\ndef _남의이름들(틀: dict) -> set:\n    \"\"\"틀의 본보기에 든 라틴 낱말. 원본 게시물의 브랜드·제품 이름이다.\"\"\"\n    난것 = set()\n    for s in 틀.get(\"슬라이드\") or []:\n        for x in s.get(\"글자슬롯\") or []:\n            난것 |= {w.lower() for w in _라틴낱말.findall(x.get(\"본보기\") or \"\")}\n    return 난것\n\n\ndef _사람이_준_낱말(주제: str, 원고: str) -> set:\n    \"\"\"사람이 직접 쓴 라틴 낱말은 막지 않는다 — 그건 이번 글의 내용이다.\"\"\"\n    return {w.lower() for w in _라틴낱말.findall(f\"{주제 or ''} {원고 or ''}\")}\n\n\ndef _슬라이드뽑기(글):\n    \"\"\"LLM 출력에서 «slides» 목록을 꺼낸다. **조용한 0개를 만들지 않는다.**\n\n    `(json.loads(글) or {}).get(\"slides\") or []` 한 줄로 줄이면 파싱 실패·안 돈\n    노드의 `null`·칸 이름이 다른 경우가 전부 «0개» 로 뭉개진다 — 06_본문검증.py 의\n    `_꼭지뽑기` 가 이미 겪고 고친 것과 같은 함정이다.\n\n    돌려주는 것: (장 목록, 무슨 일이 있었나 — 아무 탈 없으면 빈 글자)\n    \"\"\"\n    벗긴것 = _벗기기(글)\n    if not (벗긴것 or \"\").strip():\n        return [], \"대본이 비어 있다 — 앞 노드가 아무것도 안 내놨다\"\n    try:\n        d = json.loads(벗긴것)\n    except Exception as e:\n        return [], f\"대본이 JSON 이 아니다 ({e}) — 앞 300자: «{벗긴것[:300]}»\"\n    if not isinstance(d, dict):\n        return [], f\"대본이 묶음이 아니라 {type(d).__name__} 다\"\n    if not isinstance(d.get(\"slides\"), list):\n        return [], f\"«slides» 칸이 없다 — 들어 있는 칸: {sorted(d)[:8]}\"\n    return d[\"slides\"], \"\"\n\n\ndef main(text: str, 틀_json: str, 고친것: str = \"\",\n         주제: str = \"\", 원고: str = \"\", 언어: str = \"한국어\") -> dict:\n    글 = 고친것 if (고친것 or \"\").strip() else text\n    틀 = json.loads(틀_json)\n    골격 = 틀[\"골격\"]\n    슬라이드틀 = {s[\"index\"]: s for s in 틀[\"슬라이드\"]}\n    # **남의 브랜드 이름이 새는 것을 막는다.** 사람이 제 주제에 적어 넣은\n    # 낱말은 뺀다 — 그건 이번 글의 내용이지 원본에서 베낀 것이 아니다.\n    #\n    # **영어로 쓸 때는 이 검사를 끈다**(사람 결정 2026-09-18: 「가 덩어리부터\n    # 해」). 이 검사는 «한국어 카드라서» 성립한다 — 한국어 글에 라틴 낱말이\n    # 나오면 드문 일이라 원본에서 베낀 것일 확률이 높다. 영어 글은 낱말이\n    # 전부 라틴이라 그 신호가 통째로 사라지고 오검만 남는다. 실측 2026-09-18:\n    # `templates/기본.json` 의 금칙어는 eting·mart·sns·visa·zip 다섯이고,\n    # 영어 게시물로 만든 틀이면 본보기의 모든 낱말이 금칙어가 되어 한 벌도\n    # 못 나온다. **한글 브랜드를 못 잡는 것과 같은 한계다** — 숨기지 않고\n    # 여기 적어 둔다.\n    남의이름 = (set() if 언어 == \"영어\"\n             else _남의이름들(틀) - _사람이_준_낱말(주제, 원고))\n\n    # **몇 곳을 쓸지는 안 막는다 — 쏠림만 막는다**(사람 결정 2026-09-17).\n    # 예전엔 위계별 최빈값(`강조.모으기()`)과 슬롯마다의 개수를 견줬는데,\n    # 실측(기본·DG0AA6PJ8s4·DHqCBQnRAjW)에서 「대부분 0」이 이겨 모든 틀의\n    # 형광펜이 0곳으로 뭉개졌다. 이제는 같은 위계 칸이 둘 이상일 때 «어느\n    # 칸엔 있고 어느 칸엔 없는지» 만 본다 — 아래 루프에서 칸마다\n    # `강조모음` 에 담고, 루프가 끝난 뒤 위계별로 한 번에 검사한다.\n    강조모음: dict = {}\n\n    슬라이드, 파싱탈 = _슬라이드뽑기(글)\n    blocked = []\n    if 파싱탈:\n        blocked.append(파싱탈)\n\n    n = len(슬라이드)\n    if n != len(골격):\n        blocked.append(f\"장이 {n}개인데 골격은 {len(골격)}장이다 \"\n                        f\"({' → '.join(골격)}) — 지어내지도 빼지도 마라\")\n\n    넘침, 미달 = 0, 0\n    무른것 = []   # 막을 것까지는 아닌 것 — 아래 「굳은 것과 무른 것」 참고\n    권고 = []     # **막지 않고 알려만 주는 것.** 자수 미달이 여기로 온다\n    정리된_슬라이드 = []\n    # **표시(`**`·`##`)가 살아 있는 같은 슬라이드.** `정리된_슬라이드` 는 이미\n    # `_기호빼기` 를 거친 글이라 배치가 찾을 표시가 하나도 안 남는다(검토\n    # 지적 ① — 배치의 `굵기`·`형광펜` 이 늘 빈 목록이 되는 원인). 배치는\n    # 이 목록을 받는다.\n    표시_슬라이드 = []\n    for i, 카드 in enumerate(슬라이드, start=1):\n        if i > len(골격):\n            break\n        기대역할 = 골격[i - 1]\n        # **여기서부터 반환하는 「slides」는 항상 {role, blocks} 뿐인 깔끔한\n        # 묶음이다.** LLM 이 붙인 딴 칸(예: \"characters\":[[13,14]])을 그대로\n        # 돌려주면 장마다 모양이 달라져 Dify 의 출력 형식 검사가 code 노드\n        # 자체를 죽인다(\"'list' object has no attribute 'items'\", 실물\n        # 2026-08-23) — try/except 밖이라 이 파일 안에서 못 잡는다. 카드가\n        # 묶음이 아니거나 블록 안에 글자 아닌 게 섞여도 여기서 먼저 걸러\n        # **막힘으로 보고하고, 깨진 모양 그대로는 절대 내보내지 않는다.**\n        if not isinstance(카드, dict):\n            blocked.append(f\"{i}번 장이 묶음이 아니라 {type(카드).__name__} 다\")\n            정리된_슬라이드.append({\"role\": 기대역할, \"blocks\": []})\n            표시_슬라이드.append({\"role\": 기대역할, \"blocks\": []})\n            continue\n        # **역할은 골격에서 온다 — 모델에게 안 묻는다.**\n        #\n        # 몇 번째 장이 무슨 역할인지는 골격이 이미 안다. 그런데 모델에게 그\n        # 낱말을 다시 써 내라 하고, 다르면 막았다. 그러면 «글은 잘 썼는데 이름을\n        # 잘못 붙였다» 는 이유로 다 된 대본을 버리게 된다 — 실물(2026-08-28):\n        # 사례 자리에 「정의」·「문제」라고 적었다고 두 판을 태우고 막혔다.\n        #\n        # 코드가 알 수 있는 것은 코드가 정한다. 줄 나누기를 코드가 맡은 것과\n        # 같은 결이다. 모델이 맞춰야 하는 것은 «차례대로 그 칸에 맞는 글» 이지\n        # 이름표가 아니다.\n        역할 = 기대역할\n        블록원본 = 카드.get(\"blocks\") or []\n        if not isinstance(블록원본,\
          \ list):\n            blocked.append(f\"{i}번 장 blocks 가 목록이 아니라 {type(블록원본).__name__} 다\")\n            정리된_슬라이드.append({\"role\": 역할, \"blocks\": []})\n            표시_슬라이드.append({\"role\": 역할, \"blocks\": []})\n            continue\n        # 강조 수는 표시를 떼기 **전** 글에서 센다 — 뗀 뒤로는 `**`·`##` 가\n        # 이미 사라져 있어서 셀 것이 안 남는다.\n        원문블록 = [b if isinstance(b, str) else json.dumps(b, ensure_ascii=False)\n                for b in 블록원본]\n        블록 = [_기호빼기(t) for t in 원문블록]\n        정리된_슬라이드.append({\"role\": 역할, \"blocks\": 블록})\n        # 표시가 살아 있는 채로 시작해, 아래에서 다시 감긴 블록만 그 자리에서\n        # 표시가 붙은 낱말로 갈아 낀다(그대로 통과한 블록은 원문 그대로 둔다).\n        표시블록 = list(원문블록)\n        표시_슬라이드.append({\"role\": 역할, \"blocks\": 표시블록})\n        슬롯들 = 슬라이드틀.get(i, {}).get(\"글자슬롯\", [])\n        if len(블록) != len(슬롯들):\n            blocked.append(f\"{i}번 장({역할}) 블록이 {len(블록)}개인데 슬롯은 \"\n                        f\"{len(슬롯들)}개다\")\n            continue\n        for j, (슬롯, 블록글, 원문글) in enumerate(zip(슬롯들, 블록, 원문블록), start=1):\n            # **번호 칸은 안 본다**(사람 결정 2026-08-30). 그 자리는 대본이\n            # 아니라 장 차례로 채운다(`카드뉴스_배치._번호글`) — 모델이 무엇을\n            # 썼든 버려지므로, 여기서 자수를 따지면 안 쓸 글 때문에 다 된 대본이\n            # 막힌다.\n            if 슬롯.get(\"위계\") == \"번호\":\n                continue\n            # **강조는 아무것도 안 막는다**(사람 결정 2026-09-18).\n            #\n            # 형광펜 색이 없어도 안 막는다 — 배치가 게시물 강조색으로 그린다\n            # (`카드뉴스_배치`: `슬롯.get(\"형광펜색\") or 강조색`). 막을 기술적\n            # 이유가 없었다.\n            #\n            # 세기만 해서 점수표에 남긴다. 나중에 실물이 쌓이면 그 기록으로\n            # 「몇 대 몇부터 쏠림인가」를 잴 수 있다 — 지금은 근거가 없다.\n            센것 = 강조.세기(원문글)\n            위계 = 슬롯.get(\"위계\")\n            if 위계:\n                강조모음.setdefault(위계, []).append(\n                    {\"자리\": f\"{i}번 장\", \"굵게\": 센것[\"굵게\"] > 0,\n                     \"형광펜\": 센것[\"형광펜\"] > 0})\n            # **모든 칸을 통틀어 몇 자로 본다**(사람 결정 2026-09-16 본문,\n            # 2026-09-18 전부: 「세로줄은 안 본다니까」). 줄은 배치가 글꼴 폭을\n            # 재서 나누므로 여기서 줄 수·줄마다 자수를 따지면 «폭을 다 못 쓰는 짧은\n            # 줄» 을 통과시키고 «폭을 채운 긴 줄» 을 막는다 — 거꾸로다.\n            덩어리 = 자수.한덩어리(블록글)\n            블록[j - 1] = 덩어리\n            # 통자수 자리는 배치가 스스로 표시를 떼고 폭을 재서 감는다\n            # (`카드뉴스_배치.main` 의 `자수.한덩어리` → `강조.떼기` →\n            # `자수.폭감기` 순서) — 여기서는 줄만 한 덩어리로 고르고,\n            # 표시는 그대로 둔다.\n            표시블록[j - 1] = 자수.한덩어리(원문글)\n            통최소, 통최대 = 자수.통자수(슬롯)\n            # **글자 수가 아니라 «몇 자 분량» 으로 잰다**(사람 결정 2026-09-18) —\n            # 실제 글꼴 폭 ÷ 「가」 한 자 폭. 영문·숫자·띄어쓰기가 섞인 글이 글자\n            # 수로는 넘치고 폭으로는 들어가는 일이 예시 5개 중 3개에서 났다.\n            총 = 자수.자분량(슬롯, 덩어리)\n            분량 = f\"{round(총, 1):g}자 분량(글자 수 {len(덩어리)})\"\n            if 총 > 통최대:\n                blocked.append(f\"{i}번 장 블록{j} 은 통틀어 최대 {통최대}자인데 {분량}이다 \"\n                               f\"— 줄여서 다시 써라: «{덩어리}»\")\n            elif 총 < 통최소:\n                권고.append(f\"{i}번 장 블록{j} 은 통틀어 최소 {통최소}자인데 {분량}이다 \"\n                          f\"(모자라면 아래가 빈다)\")\n            샌것 = sorted({w for w in _라틴낱말.findall(덩어리) if w.lower() in 남의이름})\n            if 샌것:\n                blocked.append(\n                    f\"{i}번 장 블록{j} 에 원본 게시물의 이름이 그대로 있다\"\n                    f\"({' · '.join(샌것)}) — 그건 남의 브랜드다. 이번 글의 것으로 \"\n                    f\"바꾸거나 빼라: «{덩어리}»\")\n\n    # **쏠림을 안 막는다 — 점수표에만 적는다**(사람 결정 2026-09-18: 「그냥\n    # 알아서 강조할 부분에 강조하고, 형광펜 쓰고 싶은 부분에 형광펜 쓰고」).\n    #\n    # 여기까지 세 판이었다. ① 위계별 개수를 못 박았다 — 「대부분 0」이 이겨\n    # 실측 틀 전부에서 형광펜이 0곳으로 뭉개졌다. ② 개수를 빼고 «쓰거나 안\n    # 쓰거나가 같은지» 를 봤다 — 설계서엔 「쏠림을 막는다」고 써 놓고 코드는\n    # `any and not all`, 곧 «전부 아니면 전무» 였다. ③ 그 규칙으로 실물 다섯\n    # 벌을 만들어 보니 **한 벌도 안 나왔다**(2026-09-18 실측: 막은 것 19건 중\n    # 강조가 10건 — 22칸 중 6칸에 형광펜을 쓴 것까지 막혔다).\n    #\n    # 「몇 대 몇부터 쏠림인가」를 정할 실측 근거가 없다. 표본 넷(1/2·1/8·6/22)으로\n    # 문턱을 박으면 또 근거 없는 숫자를 넣는 것이다. 그래서 세기만 하고 남긴다.\n    강조적기 = []\n    for 위계, 자리들 in 강조모음.items():\n        for 갈래 in (\"굵게\", \"형광펜\"):\n            쓴수 = sum(1 for x in 자리들 if x[갈래])\n            if 쓴수:\n                강조적기.append(f\"{위계} {갈래} {쓴수}/{len(자리들)}칸\")\n\n    점수 = [f\"장 {n}개 (골격 {len(골격)}개)\",\n            f\"자수 넘침 {넘침}건 · 자수 미달 {미달}건(권고, 안 막음)\"]\n    if 강조적기:\n        점수.append(\"강조 \" + \" · \".join(강조적기) + \" (안 막음)\")\n    점수 += 권고[:12]\n\n    # **굳은 것과 무른 것을 갈라서 낸다.**\n    #\n    # 자수 미달은 «네모가 좀 헐렁해 보인다» 는 뜻이다 — 보기에 아쉬울 뿐 카드가\n    # 망가지지는 않는다. 넘침은 다르다: 글자가 네모 밖으로 나가거나 잘린다.\n    #\n    # 그런데 여태 둘을 똑같이 막았다. 그래서 **두 자밖에 안 모자란 제목 한 줄\n    # 때문에 다 된 일곱 장을 통째로 버리는** 일이 생겼다(실물 2026-08-27:\n    # «강남 카페 4대 트렌드 총정리» 16자, 하한 18자). 사람이 이미 「너무 빡빡하게\n    # 하면 글자수 때문에 제대로 못 한다」고 정해 준 자리다.\n    #\n    # 그래서 **고쳐 쓰라고는 하되, 마지막에 그것만 남았으면 통과시킨다.**\n    # `blocked`(다시 쓰기에게 줄 말)는 그대로 다 담고, `굳은막힘`(정말 막아야\n    # 하는 것)만 따로 낸다. 부르는 쪽이 어느 걸 볼지 고른다.\n    굳은것 = [x for x in blocked if x not in 무른것]\n\n    return {\"slides\": 정리된_슬라이드, \"표시슬라이드\": 표시_슬라이드, \"count\": n,\n            \"blocked\": \"\\n\".join(blocked), \"점수표\": \"\\n\".join(점수),\n            \"굳은막힘\": \"\\n\".join(굳은것), \"굳은ok\": \"0\" if 굳은것 else \"1\",\n            \"ok\": \"0\" if blocked else \"1\", \"draft\": 글}\n"
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - '2200000000003'
          - text
          value_type: string
        - variable: 틀_json
