app:
  name: 카드뉴스_생성기
  mode: workflow
  icon: 🗂️
  icon_background: '#EFF1F5'
  description: 주제 한 줄만 넣으면 규칙표(docs/규칙표_카드뉴스.md, n=1 템플릿)대로 대본을 쓰고 §2 고정 자리에 얹어 카드를 굽는다. 원고·사진·로고는 다 선택 입력, 사례 장수는 「구조」가 원고를 보고 알아서 정한다.
