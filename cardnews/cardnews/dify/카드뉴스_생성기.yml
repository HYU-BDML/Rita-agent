      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: start
        title: 시작
        desc: 주제만 넣어도 돈다. 원고·사진·로고·틀 주소는 다 선택. 사례 장수는 이제 사람이 안 고른다 — 「구조」가 원고를 보고 정한다. 디자인도 이제 사람이 안 고른다 — 「틀 고르기」가 틀의 서랍에서 장마다 고른다. 사진은 결과를 보고 작업대에서 넣는다.
        selected: false
        variables:
        - variable: topic
          label: 카드뉴스 주제
          type: text-input
          required: true
          max_length: 100
          options: []
          default: ''
        - variable: user_script
          label: 직접 쓴 원고(선택) — 비우면 주제로 새로 씀
          type: paragraph
          required: false
          max_length: 20000
          options: []
          default: ''
        - variable: photo_urls
          label: 사진 주소(선택, 줄마다 하나) — 사진·인물 자리에 순서대로 채움
          type: paragraph
          required: false
          max_length: 5000
          options: []
          default: ''
        - variable: logo_url
          label: 로고 주소(선택) — 모든 로고 자리에 같은 걸 채움
          type: text-input
          required: false
          max_length: 500
          options: []
